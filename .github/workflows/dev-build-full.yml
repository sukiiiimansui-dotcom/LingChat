name: 构建开发版（全量测试）

on:
  push:
    # 2026-10-05：把当前开发分支 `feat/worldsim` 加进来 —— 否则这份**四平台全量构建**
    # （windows-amd64 / linux-amd64 / linux-aarch64 / macos）在 fork 上永远不会为提交跑。
    branches: ["feat/worldsim", "dev", "dev/**"]
    # 2026-10-05 第二改：`paths-ignore` → **`paths` 白名单**。
    # 原来只忽略 `**.md`/`docs/**`/`.vscode/**` ⇒ 改 CI 配置、改工具脚本、动 `.github/**` 之类
    # **任何非文档改动都会拉一次 20 分钟的四平台构建**（现在干什么都会触发 ci）。
    # 现在只有**真会影响构建的目录**才自动触发；要临时跑一次用 `workflow_dispatch`（下面本来就有）。
    # 上游同日给触发条件加了 `paths-ignore: mc-mod/**`（`mc-mod/` 改动不触发原生构建）：
    # 白名单语义下没列进来的目录（含 `mc-mod/**`、`docs/**`、`**.md`）不触发，与该忽略清单等价，
    # 故不再同时保留 `paths-ignore`（两套过滤器叠加容易互相打架）。
    paths:
      # 2026-10-05 收窄（干什么都会触发 ci）：这一份是**原生侧**验证 ⇒ 只有 Rust/原生相关
      # 改动才自动跑。前端（`src/**`、`public/**`）由「轻量检查」每次推都验；原生构建另有**每天定时一次**
      # （下面的 `schedule`）+ 手动触发（`workflow_dispatch`）兜底。
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.cargo/**'
      - '.github/workflows/dev-build-full.yml'
  pull_request:
    branches: ["dev", "dev/**"]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.cargo/**'
      - '.github/workflows/dev-build-full.yml'
  # 每天 01:30（UTC+8）跑一次，保证"全平台"不会因为收窄触发而长期没人验
  schedule:
    - cron: '15 18 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # 2026-10-23：fork 上拿不到 macOS runner（任务排队 15 分钟、一步没跑就被取消 ⇒ 整个 run 变红）。
    # 做法：macOS 只在定时与手动触发时尝试（见下面的 if），推送/PR 上根本不排它；
    # 其余三平台仍是硬门禁。真机 macOS/iOS 产物由上游与本地构建兜底。
    # 取消（cancelled）不吃 continue-on-error ⇒ 干脆在 push/PR 上不排 macOS：
    # 只有定时与手动触发才尝试，避免每次推送都出现一个"排队 15 分钟后被取消"的红任务。
    if: matrix.platform != 'macos' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-latest
            artifact-name: lingchat-dev-windows
            artifact-path: target/release/ling_chat.exe
          - platform: linux-amd64
            os: ubuntu-latest
            artifact-name: lingchat-dev-linux-amd64
            artifact-path: target/release/ling_chat
          - platform: macos
            os: macos-latest
            artifact-name: lingchat-dev-macos
            artifact-path: target/release/ling_chat
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            artifact-name: lingchat-dev-linux-aarch64
            artifact-path: target/release/ling_chat

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 安装 rust
        uses: dtolnay/rust-toolchain@stable

      - name: 设置 rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: 安装 Linux 依赖 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            mold

      - name: 创建占位文件和初始化
        shell: bash
        run: |
          rm -rf src-tauri/tauri.windows.conf.json
          mkdir -p data/.official/game_data
          mkdir -p data/third_party
          touch data/.official/game_data/.gitkeep
          touch data/third_party/.gitkeep
          node scripts/prepare-desktop-resources.mjs
          pip install Pillow
          rm -rf ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (1024,1024), color='#4A90D9'); draw=ImageDraw.Draw(img); draw.ellipse((100,100,924,924), fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png

      # Windows 侧必须先备好 `src-tauri/binaries/{onnxruntime,DirectML}.dll`：
      # `src-tauri/tauri.windows.conf.json` 把这两个 dll 声明成 bundle resource，而 `tauri build`
      # 的 build script 在资源缺失时会直接退出 1（`resource path binaries\DirectML.dll doesn't exist`）。
      # `pnpm run init` 里带着这一步，但四平台工作流是手写步骤、漏了它 ⇒ Windows 那条一直红。
      # 上游同日在上面的初始化步骤加了 `rm -rf src-tauri/tauri.windows.conf.json`（不再声明这份
      # bundle resource）；本步骤仍保留：它同时把两个 dll 放进 `target/release/`，产物收集要用。
      - name: 准备 Windows 的 onnxruntime.dll + DirectML.dll
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/ensure-onnxruntime.mjs

      - name: 构建应用
        env:
          RUSTFLAGS: |
            ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
            ${{ runner.os == 'Windows' && '-C linker=rust-lld' || '' }}
            ${{ runner.os == 'macOS' && '' || '' }}
        run: pnpm tauri build --no-bundle

      - name: 收集产物（Windows 附带 onnxruntime.dll 与 DirectML.dll）
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/dist"
          cp "${{ matrix.artifact-path }}" "${{ runner.temp }}/dist/"
          # DirectML.dll 是 DML EP 的运行时依赖，缺了它选 GPU 会静默回落 CPU
          for dll in onnxruntime.dll DirectML.dll; do
            if [ "${{ runner.os }}" = "Windows" ] && [ -f "target/release/$dll" ]; then
              cp "target/release/$dll" "${{ runner.temp }}/dist/"
            fi
          done

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ runner.temp }}/dist
          retention-days: 7
