name: 代码量徽章

# 每天数一遍代码量，把结果重写进首页（`.github/README.md`）里 `LOC-BADGE` 标记之间的那段。
#
# 🔴 2026-10-06 改法（机主报告的问题）：原来是「CI 把数字推到一条专门的 `badges` 分支，
#    首页用 shields 的实时徽章去读它」。但 **GitHub 手机 App 会记住"这个仓库上次看的分支"** ——
#    机主点过一次徽章之后，在仓库里怎么返回都会跳到 `badges` 那条分支去。
#    于是改成：**数字直接写在首页里**（下面这段每天重写一次），`badges` 分支随之删除。
#    少一条机器分支 ⇒ 不会再被带偏；提交流也不再被每天的机器提交刷屏。
#
# 口径（脚本 `scripts/loc-badge.py` 是真源，谁都能本地复算）：
#   · 数 src / src-tauri/src / crates / scripts / public + 仓库根目录的自用页面
#   · 不含空行、不含整行注释
#   · 排除依赖与产物：node_modules / dist* / target / public/vendor / gen / temp
#
# 🔴 2026-10-08 修（run 37700829493 三次全挂）：失败点不是数行数，是**下面的 `git pull --rebase --autostash` 撞 LFS** ——
#    报「9 files that should have been pointers, but weren't」。根因：`.gitattributes` 把 `*.webp`/`*.jpg` 划给 LFS，
#    而本机**没有 git-lfs**，3D 页的角色立绘与 docs 演示图是按普通 blob 提交的 ⇒ 有 lfs 的 runner 认为它们本该是指针。
#    修法是仓库自己的先例（`public/prerender/**`、`public/citypacks-sample/*.zip`）：在 `.gitattributes` 里给这两类路径
#    加 `binary -filter` 例外（**故意不进 LFS**）。这次推这个文件本身就当回归自验（它的 paths 里含自身）。
#    ⚠️ 遗留脆弱点（已知，未改）：这个"自己 rebase + push"的写法对拉取时的 LFS 状态、脏树、并发都敏感；
#    今天的 3 次重试是**撞同一面墙**（只会刷红）。将来要么让它**只出数字不改仓库**，要么失败即退不再重试。
on:
  schedule:
    - cron: '20 18 * * *'   # 每天 02:20（UTC+8）
  workflow_dispatch:
  push:
    branches: ['feat/worldsim', 'feat/world-map-**']
    paths:
      # 只认它自己这两个文件：改了它自验一次；**推源码不再触发**（免得每条推送都产生机器提交）
      - 'scripts/loc-badge.py'
      - '.github/workflows/loc-badge.yml'

permissions:
  contents: write

concurrency:
  group: loc-badge
  cancel-in-progress: true

jobs:
  loc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 拉官方树（只为数行数：浅克隆 dev、不拉 LFS）
        # 「净增」必须用**同一份脚本、同一口径**数两棵树才敢相减。克隆失败不算错 —— 那就只数本仓。
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --branch dev https://github.com/SlimeBoyOwO/LingChat.git /tmp/upstream \
            || echo "⚠️ 官方树没拉下来，本轮只数本仓"

      - name: 数行数 + 重写首页那段
        run: |
          if [ -d /tmp/upstream/.git ]; then
            python3 scripts/loc-badge.py --upstream /tmp/upstream --readme .github/README.md
          else
            python3 scripts/loc-badge.py --readme .github/README.md
          fi

      - name: 数字变了才提交
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/README.md
          if git diff --cached --quiet; then
            echo "✅ 数字没变，不提交（这样不会天天产生空提交）"
            exit 0
          fi
          git commit -q -m "docs: 更新首页的代码量数字（自动生成）"
          # 机器提交可能和人的推送撞车 ⇒ rebase 后重试三次
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" \
               && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ 已推送（第 $i 次尝试）"
              exit 0
            fi
            echo "⚠️ 第 $i 次没推上去，等 10 秒重试"
            sleep 10
          done
          echo "❌ 三次都没推上去"
          exit 1
