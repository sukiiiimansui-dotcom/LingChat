name: 世界模拟·质量报告

# 这份工作流**只出数字，不判红**（每个检查都 `continue-on-error`）。
# 目的：把"屎山有多少"从感觉变成可比的数字 —— 重复率 / 未用导出 / 循环依赖 / 格式漂移 / Rust lint。
# 第一版先跑基线；等主人看过数字，再决定哪几条收紧成"红"（收紧点在下面每个 step 的注释里标了）。
#
# 触发：push 到开发分支（只认源码路径，改文档/工具不触发）+ 手动。
# ⚠️ `paths` 里**故意不含** `.ci-reports/**`（如果将来把报告提交回仓，别造成自我循环）。
on:
  # 2026-10-05：**不吃 push**（主人：「你加的质量报告触发了一半 ci」）—— 质量报告不需要每推必跑，
  # 改成**每天定时一次 + 手动**。
  schedule:
    - cron: '45 17 * * *'   # 每天 01:45（UTC+8）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 前端：重复率 / 未用导出 / 循环依赖 / 格式 ─────────────────────────────
  js-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # 质量检查不需要真素材（指针文件也照样能扫源码）

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 重复代码（jscpd：世界模拟 + 原型页）
        id: jscpd
        continue-on-error: true
        # 收紧点：等基线出来后可改成 `--threshold 1`（重复率 >1% 直接红）。
        run: |
          mkdir -p .ci-reports
          npx --yes jscpd@4 src/components/views/worldsim public/ws3dshow.html \
            --min-lines 20 --min-tokens 120 \
            --reporters console,json --output .ci-reports/jscpd --ignore "**/vendor/**" | tee .ci-reports/jscpd.txt

      - name: 未使用导出/文件（knip）
        id: knip
        continue-on-error: true
        # knip 没有配置时用它的默认推断（vite + tsconfig）；第一版只把清单落盘。
        run: |
          npx --yes knip@5 --reporter json > .ci-reports/knip.json 2> .ci-reports/knip.log || true
          npx --yes knip@5 2>&1 | tail -40 | tee .ci-reports/knip.txt || true

      - name: 循环依赖（madge）
        id: madge
        continue-on-error: true
        # 收紧点：基线出来后，如果环数 > 0 且都在我们自己的模块里，可改成"环数不许增加"。
        run: |
          npx --yes madge@8 --circular --extensions ts,vue \
            src/components/views/worldsim src/components/views/worldmap src/api/services/worldMap.ts \
            2>&1 | tee .ci-reports/madge.txt || true
          grep -c "Found [0-9]* circular" .ci-reports/madge.txt >> .ci-reports/counts.txt 2>/dev/null || true

      - name: 格式漂移（prettier，仓库自带配置）
        id: prettier
        continue-on-error: true
        run: |
          npx prettier --check "src/**/*.{ts,vue,css}" 2>&1 | tail -30 | tee .ci-reports/prettier.txt || true

      - name: 摘要（写进 job summary）
        if: always()
        run: |
          {
            echo "## 世界模拟·质量报告（前端）"
            echo ""
            echo "| 检查 | 结果 |"
            echo "|---|---|"
            echo "| jscpd 重复率 | $(grep -oE 'Found [0-9]+ clones|[0-9.]+% duplicated lines' .ci-reports/jscpd.txt 2>/dev/null | head -2 | tr '\n' ' ') |"
            echo "| knip 未用导出/文件 | $(python3 -c "import json;d=json.load(open('.ci-reports/knip.json'));print(sum(len(v) for v in d.values() if isinstance(v,list)))" 2>/dev/null || echo '见 artifact') |"
            echo "| madge 环 | $(grep -cE '^[0-9]+\) ' .ci-reports/madge.txt 2>/dev/null || echo 0) |"
            echo "| prettier 漂移 | $(grep -cE '^\[warn\]' .ci-reports/prettier.txt 2>/dev/null || echo 0) 个文件 |"
            echo ""
            echo "⚠️ 本 job 全部 \`continue-on-error\`：**只出数字、不判红**（等主人看过基线再决定收紧哪条）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-js
          path: .ci-reports/

  # ── Rust：clippy + rustfmt ────────────────────────────────────────────────
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libpipewire-0.3-dev \
            libspa-0.2-dev libgbm-dev libegl1-mesa-dev libx11-dev libxcb1-dev \
            libxrandr-dev libxcomposite-dev libxcursor-dev libxi-dev libxtst-dev \
            libwayland-dev patchelf

      - name: 装依赖 + 生成 Tauri 前置资源/图标
        # 与 `world-map-check.yml` 同款：`cargo` 系列要 `.bundled_resources` 与 icons 才编得过
        run: |
          pnpm install --frozen-lockfile
          mkdir -p data/.official/game_data data/third_party
          touch data/.official/game_data/.gitkeep data/third_party/.gitkeep
          pip install Pillow
          rm -f ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB',(1024,1024),color='#4A90D9'); d=ImageDraw.Draw(img); d.ellipse((100,100,924,924),fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png
          node scripts/prepare-desktop-resources.mjs

      - name: clippy（只出数字）
        id: clippy
        continue-on-error: true
        # 收紧点：基线出来后，可改成 `-- -D warnings`（新增警告即红）。
        run: |
          mkdir -p .ci-reports
          cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml --message-format short \
            2>&1 | tee .ci-reports/clippy.txt | tail -40

      - name: rustfmt（只出数字）
        id: rustfmt
        continue-on-error: true
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check 2>&1 | tee .ci-reports/rustfmt.txt | tail -20 || true

      - name: 摘要（写进 job summary）
        if: always()
        run: |
          {
            echo "## 世界模拟·质量报告（Rust）"
            echo ""
            echo "| 检查 | 结果 |"
            echo "|---|---|"
            echo "| clippy 警告 | $(grep -cE '^warning' .ci-reports/clippy.txt 2>/dev/null || echo 0) |"
            echo "| clippy 错误 | $(grep -cE '^error' .ci-reports/clippy.txt 2>/dev/null || echo 0) |"
            echo "| rustfmt 漂移行 | $(grep -cE '^Diff in' .ci-reports/rustfmt.txt 2>/dev/null || echo 0) |"
            echo ""
            echo "⚠️ 本 job 全部 \`continue-on-error\`：**只出数字、不判红**。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-rust
          path: .ci-reports/
