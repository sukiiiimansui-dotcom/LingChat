name: 世界模拟·轻量检查

# 这份工作流只回答一个问题：**我们的代码能不能编译**。
#   · 前端构建：`pnpm build`（= 生成语言包版本值 → `vue-tsc --noEmit --skipLibCheck` → `vite build`）
#     —— 与三条原生构建的 `beforeBuildCommand` **同一条命令**，不再各跑各的
#   · Rust：`cargo check --all-targets`（含测试目标 ⇒ 测试代码也一起过一遍类型/借用检查）
# 刻意**不碰 Android SDK / NDK / Gradle**：那套在一台干净的 runner 上要几分钟装、还依赖上游 action
# 是否跟上 runner 镜像（2026-10-05 就栽过一次：`android-actions/setup-android` 默认要装 `tools`，
# 而新镜像的 SDK 仓库已经没有这个包 ⇒ 那一步失败、整条 APK 构建被 skip）。要真产物看 `map-apk.yml`。
#
# 触发：push 到开发分支 / 手动。`paths` 只放在会影响的目录上，改文档不会白跑一次。
on:
  push:
    branches: ['dev', 'feat/worldsim', 'feat/world-map', 'feat/world-map-**']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      # 上游 2026-10-02 workspace 化后，我们的 Rust（含 world_map）在 crates/ 下
      - 'crates/**'
      - 'public/**'
      - 'scripts/**'         # 构建脚本（prepare-desktop-resources / gen-locale-version …）也是构建输入
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/world-map-check.yml'
  workflow_dispatch:

# 同一分支连推时只保留最后一次，省 runner
concurrency:
  group: world-map-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4
        with:
          # 不拉 LFS：这一步只做编译检查，素材真不真不影响 `vue-tsc` / `vite build` / `cargo check`
          # （要真素材的构建走 map-apk.yml，那边有 `lfs: true` 和"确认 LFS 素材是真的"那一步）
          lfs: false

      # 必须用 `pnpm/setup@v1`：仓库 `package.json` 里写了 `packageManager: pnpm@11.21.0`，
      # 再给别的 action 指定版本会报「Multiple versions of pnpm specified」直接挂。
      # 它顺带把 Node 也装好（与官方工作流一致）。
      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: 安装 Linux 依赖（Tauri 的 cargo check 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            patchelf

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 🔴 2026-10-06：这里原来是 `npx vue-tsc` + `npx vite build` 两步，与三条原生构建**实际跑的
      # 那条命令**（`src-tauri/tauri.conf.json` 的 `beforeBuildCommand` → `pnpm build`）**不等价**：
      # `pnpm build` 里还多一步 `node scripts/gen-locale-version.mjs`。结果那个脚本的 esbuild 调用
      # 只在 CI 上炸（本地 Termux 布局不同 ⇒ 一直没暴露），轻量检查全绿、APK / iOS / 四平台全红。
      # 现在直接跑**同一条命令**：这类"只在打包路径上才炸"的问题在这个 ~10 分钟的闸里就能拦住。
      - name: 前端构建（与原生构建同一条命令）
        run: pnpm build

      - name: 创建占位文件 / 生成图标 / 桌面前置资源
        # 这一整块的配方**照抄上游 `dev-build-full.yml` 的「创建占位文件和初始化」**，原因是两条实测：
        #  ① `*.png` 是 LFS 资产（`.gitattributes:4`）⇒ `lfs: false` 的干净 checkout 里
        #     `src-tauri/icons/icon.png` 只是 **130 字节指针**，拿它去 `tauri icon` 必挂；
        #  ② `tauri::generate_context!()` 要读 `icons/32x32.png` 这些**生成物**（gitignore），
        #     少了就是 `proc macro panicked: failed to open icon …/icons/32x32.png`。
        # 所以：先补占位数据目录 → 用 Pillow 画一张占位图 → `tauri icon` 生成全套 → 再备桌面资源。
        shell: bash
        run: |
          mkdir -p data/.official/game_data data/third_party
          touch data/.official/game_data/.gitkeep data/third_party/.gitkeep
          pip install Pillow
          rm -f ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (1024,1024), color='#4A90D9'); draw=ImageDraw.Draw(img); draw.ellipse((100,100,924,924), fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png
          node scripts/prepare-desktop-resources.mjs

      - name: Rust 类型/借用检查（含测试目标）
        run: cargo check --all-targets --manifest-path src-tauri/Cargo.toml
