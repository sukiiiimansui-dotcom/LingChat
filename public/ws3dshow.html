<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小区级 3D 楼房 · 观感调参台（真机看效果用）</title>
    <!--
      ws3dshow.html —— **观感调参台**，不是产品页。

      ## 为什么单独开一页（2026-09-19）
      机主原话：「这个 ai 2d 小区好丑，直接试一下 3d 路线我看看效果」。
      本机无头浏览器**看不到 WebGL**（GPU 上下文首帧后必丢，6 种图形栈实测过），
      所以"好不好看"这件事**只能在真机上调**。而真机上走 App 到小区级要点好几下、
      还要等 AI 精绘 ⇒ 一轮迭代几分钟。
      这一页把"调观感"需要的三件事压到一屏：**真底图 + 真楼房挤出 + 一组能点的档位**。

      ## 它和产品代码的关系
      这里调出来的配方（底图、高度取值、配色、光照）会**原样搬进**
      `src/components/views/worldsim/WsDistrictMapLibre.vue`。所以这一页的表达式
      故意写成可以直接复制粘贴的形状 —— 别在这里发明只此一处的新写法。

      ## 三条踩过的坑（都在这一页里守住了）
      ① 样式对象里**绝不能写 `glyphs: undefined`** → 样式校验失败 → `load` 永不触发，
         而页面**零报错**（第一次就是这么被骗的）。
      ② canvas 必须 `preserveDrawingBuffer: true`，否则截图拍到空白。
      ③ Esri 瓦片路径是 `{z}/{y}/{x}`（**y 在前**）—— 写成 `{z}/{x}/{y}` 不报错但地图会跑到别处。
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #070b11; }
      body { font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eaf6ff; }
      #map { position: fixed; inset: 0; }
      .hud {
        position: fixed; left: 8px; bottom: 8px; z-index: 20;
        display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 62vw;
        padding: 5px 9px; border-radius: 10px;
        background: rgba(7, 11, 17, 0.62);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        font-size: 11px; line-height: 1.7;
      }
      .hud b { color: #79d9ff; font-weight: 600; }
      .hud .w { color: #ffcf8a; }
      .ops {
        position: fixed; right: 8px; bottom: 8px; z-index: 20;
        display: flex; flex-direction: column; gap: 6px;
      }
      .ops button {
        width: 46px; height: 42px; border: none; border-radius: 12px;
        background: rgba(7, 11, 17, 0.66); color: #eaf6ff; font-size: 12px;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .ops button.on { background: #79d9ff; color: #06222e; font-weight: 700; }
      #fb { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; z-index: 30;
            background: #070b11; text-align: center; }
      /* art 徽标 + 回证表：**只读的诊断件**（收起时只占一行小字） */
      .artb { position: fixed; right: 8px; top: 8px; z-index: 25; max-width: 46vw;
              padding: 5px 8px; border-radius: 10px; background: rgba(7, 11, 17, 0.72);
              font-size: 10.5px; line-height: 1.5; color: #eaf6ff; }
      .artb__h { font-weight: 700; color: #79d9ff; cursor: pointer; }
      .artb__b { display: none; margin-top: 4px; }
      .artb.is-open .artb__b { display: block; }
      .artb__row { white-space: nowrap; }
      .artb__ok { color: #7ee787; }
      .artb__bad { color: #ff7b72; }
      /* 🏢 形体徽标 + 🎮 观感徽标（`?bld=2` / `?look=2` 的回证）：**竖排叠在左上**
         （右上被 art 徽标占了）。原来是各自 `position:fixed; left:8px; top:8px` ⇒ 两个会重叠，
         所以套一个 flex 容器，徽标自己改成 `static`。 */
      .badgesL { position: fixed; left: 8px; top: 8px; z-index: 25; max-width: 62vw;
                 display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
      .bldb { position: static; left: auto; right: auto; max-width: 62vw; }
      .bldb .artb__h { color: #ffd479; }
      #lookb .artb__h { color: #9ef7c4; }
      /* 🛰 LOD 徽标（`?lod=1`）：颜色与另外两枚区分开，点开是逐项回证 */
      #lodb .artb__h { color: #8fd3ff; }
      .artb__skip { color: #d0b6ff; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- 🎨 art 变体徽标 + **回证表**（机主第一反馈"这变了个啥"⇒ 先证明补丁真的生效） -->
    <div id="artb" class="artb">
      <div id="artb-head" class="artb__h">art=1（基准）</div>
      <div id="artb-body" class="artb__b"></div>
    </div>
    <!-- 🏢 形体徽标（`?bld=2`）：逐项回证"各细节生成了多少" + 当前档位。
         🔴 计数口径（三态）：正数=真的生成了这么多 · `0（已量）`=确实量到 0 · `数不出来`=没拿到统计。
         **绝不裸写 0** —— 免得"没数"和"数出来是 0"混在一起（点标题展开逐项）。 -->
    <div class="badgesL">
      <div id="bldb" class="artb bldb">
        <div id="bldb-head" class="artb__h">🏢 形体 —</div>
        <div id="bldb-body" class="artb__b"></div>
      </div>
      <!-- 🎮 观感回证（`?look=2`）：逐项列"改了什么"，命中 ✅ / 未命中 ❌ / **跳过 ⏭**（跳过 = 如实记没做的项，
           不是失败）；下面还带**对比度数值**（楼/地、描边/地）—— 低于阈值整行标红。 -->
      <div id="lookb" class="artb bldb">
        <div id="lookb-head" class="artb__h">🎮 观感 —</div>
        <div id="lookb-body" class="artb__b"></div>
      </div>
      <!-- 🛰 LOD 回证（`?lod=1`）：当前走哪条路（预渲染/过渡/实时）+ 瓦片命中/缺图 + 实时层要素数。
           计数口径是**三态**：正数 / `0（已量）` / `数不出来`（取不到就写"数不出来"+原因，**绝不裸写 0**）。 -->
      <div id="lodb" class="artb bldb">
        <div id="lodb-head" class="artb__h">🛰 LOD —</div>
        <div id="lodb-body" class="artb__b"></div>
      </div>
    </div>
    <div class="hud">
      <span><b id="m-n">0</b> 栋</span>
      <!-- 🛣 路网**独立一格**：交通设施那行会覆盖 m-msg ⇒ 路数必须有自己的位置（否则"看不见路"没人知道是没插还是没数） -->
      <span id="m-roads" class="w">路网 —</span>
      <span>真高 <b id="m-h">0</b></span>
      <span>层数 <b id="m-l">0</b></span>
      <span class="w">按类型估 <b id="m-e">0</b></span>
      <span><b id="m-r">-</b> m</span>
      <span><b id="m-z">-</b> 级</span>
      <span><b id="m-fps">-</b> fps</span>
      <!-- 🏢 形体的**一行回证**：`?bld=2` 时写清"各细节生成了多少 + 当前档位"（截图里就能读到）。
           三态判词：正数 / `0（已量）` / `数不出来` —— 绝不裸写 0。 -->
      <span class="w" id="m-bld">形体 —</span>
      <!-- 🛰 LOD 的**一行回证**（`?lod=1` 时写：走哪条路 / 瓦片命中 / 缺图 / 实时层要素数）。
           三态判词：正数 / `0（已量）` / `数不出来` —— 取不到就如实写，**绝不裸写 0**。 -->
      <span class="w" id="m-lod">🛰 LOD —</span>
      <!-- 🛰 署名（**ODbL 要求可见**；MapLibre 的 attributionControl 是关的 ⇒ 这一行就是等价方案）。
           文案**来自清单** `manifest.attribution`（生成管线写的那句，与 overture_api.py 同一份），
           页面**不抄第二份**；清单没取到就如实写「数不出来」，不许静默不显示。 -->
      <span id="m-attr" style="opacity:.85"></span>
      <span class="w" id="m-msg"></span>
      <span id="m-build" style="opacity:.55"></span>
    </div>
    <div class="ops">
      <button id="b-sat" title="切换 z16 以上的底：卫星影像 / 暗色底放大">星</button>
      <button id="b-far" title="远景（看整片）">远</button>
      <button id="b-near" title="近景（看楼体）">近</button>
      <button id="b-spin" title="转个角度">转</button>
    </div>
    <div id="fb"></div>

    <script type="module">
      /* 真机上看效果用的调参台。所有数字都在这里，改完刷一下页面就见效。 */
      const API = "http://127.0.0.1:8791";
      /**
       * 🔴 **版本戳**（2026-09-20 加的，血的教训）：
       * 机主点了一次代拍，回来的三张**是修复之前那一版**拍的 —— 因为浏览器把
       * `public/` 下的 `ws3dshow.html` 缓存住了（它**没有内容哈希**，不像 `assets/*.js`）。
       * 于是我在这边看服务端文件是新的、就以为他跑的是新的，白等一轮。
       * ⇒ 诊断图里带上版本戳，一眼分辨"跑的是哪一版"；请机主打开时在 URL 后面加
       *   一个 `&v=数字`（或先刷新清缓存），把旧缓存顶掉。
       */
      /* v12（2026-09-24 晚）：🎮 `?look=2`「游戏过场」观感（派生主题 + 接触阴影 + 霓虹路 + 暗角 + 回证徽标）。
         ⚠️ `VENDOR_VER` 取的就是这个戳 ⇒ **换版必换模块 URL**，不会再撞 immutable 缓存。 */
      /* v13（2026-09-24 深夜）：🛰 **LOD 第 1 步**（`?lod=1`：远处预渲染瓦片 / 近处实时矢量 / 中间交叉过渡 + 回证）。
         ⚠️ `VENDOR_VER` 取的就是这个戳 ⇒ **换版必换模块 URL**，不会再撞 immutable 缓存。 */
      /* v14（2026-09-25）：🎮 `?look=2` **返工 —— 结构留、配色回 BA**（机主 2026-09-24 原话：
         「代拍页的地图底都看不清了，还有就是配色为什么把 BA 风格改喵了！」）。
         只留结构（接触阴影 / cel 三档硬边 / 路 casing 加粗 / 弱暗角 0.18）；地面/底色/描边/路色**逐字段回基准**；
         红线"派生地面明度不许低于基准"写进自检。⚠️ 同版含 **LOD 第 1 步**（`?lod=1`）的页面 hunk（另一代理）。 */
      /* v15（2026-09-25）：🛰 **治「远端预渲染层加载不出来」的真因** —— 机主截图实证：
         `aedf87a` 给 `wsScene` 加了 3 个 LOD 导出但**没换戳**，`?v14` 的 vendor URL 被浏览器
         immutable 缓存占住 ⇒ LOD ❌0/✗2「模块里没有 lodPlan（重取后仍旧）」。
         本版：① 换戳；② `ensureVendor()` 加**一次性 token 强取**兜底（见下面那段注释）。 */
      const BUILD = "ws3dshow-2026-09-25-v15";
      try { document.getElementById("m-build").textContent = BUILD; } catch { /* 元素不在就算了 */ }

      /* 默认落点：**渝中区驻地**（后端 `/api/geo_json?ad=500103` 的 properties.center）。
         为什么是它：IP 定位（`/api/location?fast=1`）当前解析出来的就是渝中区，
         这一带 OSM 楼房密（实测 800m 内 232 栋）——"成片"要看得出效果就得在这种地方。 */
      const SPOT = { lng: 106.56288, lat: 29.556742, name: "重庆·渝中区" };

      const KIND_H = {
        /* OSM 建筑类型 → 合理层高（米）。**这张表是"估算"，HUD 里单独计数，不混进真数据。**
           依据：中国城区最常见的形态（6~7 层住宅 ≈ 18~21m、临街商业 4~5 层 ≈ 15m、
           写字楼/酒店 20 层起 ≈ 60m）。宁可保守，也别把老城区画成曼哈顿。
           🔧 2026-09-24 机主拍板：**裸 `building=yes`（说不清是什么楼的）12m → 15~18m**。
           ⇒ 估算档位的**单一真源在 `wsBuildingLook.ts`**（`KIND_HEIGHT_M` + `UNKNOWN_KIND_BAND_M`）：
             模块加载后 `renderHeight()` 直接走模块（见下面那个函数），这份小表只在**模块还没到**时兜底
             （`yes` 取区间中点 16.5，与模块一致）—— 免得两处各写一份、慢慢漂。 */
        house: 7, detached: 7, semidetached_house: 7, bungalow: 4, hut: 3, shed: 3, garage: 3, garages: 3, roof: 3, carport: 3,
        residential: 18, dormitory: 15, apartments: 21, terrace: 9, commercial: 15, retail: 12,
        office: 45, hotel: 40, tower: 90, hospital: 24, school: 12, university: 15, kindergarten: 9,
        industrial: 10, warehouse: 9, factory: 10, church: 18, temple: 10, mosque: 15, museum: 18,
        construction: 12, yes: 16.5,
      };

      /** 稳定的字符串哈希（同一条 id 永远同一个数）—— 用来给"估算高度"加一点确定性抖动。
       *  为什么要抖：一整片 `building=yes` 如果全给 12m，就是一张**平顶地毯**，
       *  看着比没有还假。±15% 的确定性抖动让人眼读到"这是一片高低不齐的楼"，
       *  而且同一个楼每次刷新都一样（不是随机闪烁）。 */
      function hash32(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return (h >>> 0);
      }

      /** 渲染用高度：真高 → 层数×3（后端已折好）→ 按 OSM 类型估。返回 [米, 来源]
       *  🔧 **估算档位的单一真源在 `wsBuildingLook.ts`**（`KIND_HEIGHT_M` + `UNKNOWN_KIND_BAND_M`，
       *  机主 2026-09-24 把裸 `building=yes` 从 12m 提到 15~18m）：模块到了就走模块的 `renderHeight()`，
       *  没到才退回本页那份同值小表。**真高/层数两档不受影响**（它们本来就优先）。 */
      function renderHeight(p) {
        const TFk = window.__TF__;
        if (TFk && typeof TFk.renderHeight === "function") {
          const r = TFk.renderHeight(p);
          return [r.h, r.from];
        }
        const h = Number(p.height);
        if (p.height_src === "height" && h > 0) return [h, "real"];
        if (p.height_src === "levels" && h > 0) return [h, "levels"];
        const base = KIND_H[String(p.kind || "yes").toLowerCase()] ?? KIND_H.yes;
        const jitter = 0.85 + (hash32(String(p.osm_id || "")) % 31) / 100; // 0.85 ~ 1.15
        return [Math.max(3, Math.round(base * jitter * 10) / 10), "kind"];
      }

      /* ══ 🎮 「游戏过场」观感 `?look=2`（机主 2026-09-24：「**这个好难看，去网上学**」）════════
         当时的样子：**整屏近白 + 楼像薄板 + 只有细描边** ⇒ 像石膏模型/蓝图，没有游戏感。

         🔴 这一页**不自己写第二套配色**（与 `?art=` 那条同样的纪律）：
         新观感 = `wsMapTheme.wsGameLook()` **派生**出来的一整套主题，由
         `world_map/ws_map_theme_selftest.mjs --write-theme-json` 落进 `/wstheme.json` 的
         `looks.game.<主题 id>`（和 `themes.<id>` **逐字段同构**）⇒ 页面只是**换一个对象**读。
         页面自己只做**结构性**的三件事（颜色全从 `THEME.look` 取）：接触阴影两层、霓虹路两层、暗角一层。

         🔴 **v13 返工（机主真机看过第一版之后的原话）**：「**代拍页的地图底都看不清了，还有就是
         配色为什么把 BA 风格改喵了！**」⇒ 他拍板 **保留结构、配色拉回 BA**：地面恢复亮底，
         只留**接触阴影 / cel 三档硬边 / 路 casing 加粗 / 弱暗角（0.18）**。
         派生件不许多覆盖任何颜色类字段（`wsGameLook` 现在只覆盖 `label`/`hud`/`ramp`/`look`），
         且**派生地面明度不许低于基准**（`metrics.groundEps` 是那根尺子，徽标里会算给你看）。
         撤掉的项（压暗地面 / 霓虹辉光 / 远景淡出 / 竖向渐变）逐条写在 `look.reverted` 里，徽标用 ⏪ 列出来。

         A/B（**不加参数 = 这一页原来的行为，一字不改**）：
           · （无参数）基准版：BA 亮底 + 8 档平滑色阶 + 深藏青细描边；
           · `?look=2`：**同一套 BA 配色** + 楼体 3 档 cel（档位色取自 BA 色阶）+ 接触阴影 + 路加粗 + 弱暗角；
           · 可与 `?bld=2` / `?wstheme=night` 叠加（观感是**主题的**属性，形体是**几何的**属性，两者独立）。
         ⚠️ 快照里没有 `looks.game`（老 `/wstheme.json` 被缓存 / 没重新生成）⇒ **如实回退基准主题**
         并把原因写进徽标 —— 不许"开了却什么都没变"。 */
      const LOOK = (function () { try { return /[?&]look=2\b/.test(location.search) ? 2 : 1; } catch (e) { return 1; } })();
      /** 观感 id（`look=1` 时为 null = 用基准主题；不做第三套观感） */
      const LOOK_ID = LOOK === 2 ? "game" : null;
      /** 观感**有没有真的生效**（三态：未开 / 已用派生主题 / 回退：原因）—— 徽标与 probe 都读它 */
      let lookState = LOOK === 2 ? "待载入主题" : "未开（要 ?look=2）";

      const $ = (id) => document.getElementById(id);
      const errs = [];
      let maplibregl = null;
      let map = null;
      let fcCache = null;
      const stats = { n: 0, real: 0, levels: 0, kind: 0, r: 0, parts: 0 };

      function fail(why) {
        const el = $("fb"); el.style.display = "grid";
        el.textContent = "3D 调参台起不来：" + why + "（本机无头看不到 WebGL 是已知的，真机才有）";
        window.__w3d = { ok: false, why, errs: errs.slice(0, 5) };
      }

      /* ── 🎨 主题（2026-09-20）────────────────────────────────────────────────
         机主原话：「这个地图太暗了喵，还有就是我想给整体地图改成二次元式的那种风格喵」。

         🔴 这一页**不自己写一套配色** —— 它从 `/wstheme.json` 读**同一份主题**。
         为什么：这一页是"观感调参台"，产品配方在 `WsDistrictMapLibre.vue` 里。
         两边各自维护一份颜色，就一定会漂（这一页原来就是手抄的）。
         那份 JSON 由 `world_map/ws_map_theme_selftest.mjs` **从 `wsMapTheme.ts` 生成**，
         而且自检每次都会断言"committed 的 JSON == 现在生成的"⇒ 想漂都漂不了。

         A/B：`?wstheme=night` 回暗色、`?wstheme=anime` 二次元（不给就用默认=二次元）。
         取不到 JSON 时**退回本页原来那套暗色配方**（页脚会如实写"主题未加载"）。 */
      let THEME = null;
      /** 基准主题（**永远是 `themes.<id>` 那一份**）。`?look=2` 时 `THEME` 是派生版，
       *  回证/对比度要拿它当参照 ⇒ 两份都留着（"改了什么"才有得比）。 */
      let THEME_BASE = null;
      let THEME_ID = "anime";
      try {
        const q = new URLSearchParams(location.search).get("wstheme");
        if (q === "night" || q === "anime") THEME_ID = q;
      } catch { /* 参数坏了就用默认，不因为一个开关把页面搞崩 */ }

      async function loadTheme() {
        try {
          const r = await fetch("/wstheme.json", { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const j = await r.json();
          const t = j?.themes?.[THEME_ID];
          if (!t) throw new Error("快照里没有主题 " + THEME_ID);
          /* 🎮 观感：`?look=2` 时**换成派生主题**（同一份快照、同一个形状）。
             拿不到就**如实回退基准**（回退 == 静默失效，这项目反复踩过）并把原因写进徽标。 */
          const g = LOOK === 2 ? j?.looks?.[LOOK_ID]?.[THEME_ID] : null;
          if (LOOK === 2) {
            lookState = g
              ? "已用派生主题（looks." + LOOK_ID + "." + THEME_ID + "）"
              : "回退：快照里没有 looks." + LOOK_ID + "." + THEME_ID +
                "（多半是 /wstheme.json 是旧的 ⇒ 跑 node ws_map_theme_selftest.mjs --write-theme-json，或强刷）";
          }
          THEME = g || t;
          THEME_BASE = t; // 基准那一份永远留着（回证要能对比"改了什么"）
          window.__LOOK_DEBUG__ = { look: LOOK, id: LOOK_ID, themeKeys: Object.keys(THEME || {}), lookKeys: Object.keys((THEME && THEME.look) || {}), outline: (THEME && THEME.outline) || null, isGame: !!g };
          /* 版本戳带上主题名 —— 代拍回来的图一眼能看出"跑的是哪一套"（缓存坑踩过） */
          try { document.getElementById("m-build").textContent = BUILD + " · " + t.label + " · " + artHud() + " · " + lookHud(); } catch {}
        } catch (e) {
          THEME = null;
          if (LOOK === 2) lookState = "回退：主题快照没取到（" + String(e).slice(0, 32) + "）";
          try { document.getElementById("m-build").textContent = BUILD + " · 主题未加载(" + String(e).slice(0, 24) + ") · " + lookHud(); } catch {}
        }
      }

      /* ── 样式：底图 + 楼房挤出 ───────────────────────────────────────────── */
      function makeStyle() {
        /* 有主题快照就照它建（底半部分与产品组件**逐字段同源**） */
        if (THEME) {
          const st = { version: 8, name: "ws-3d-show-" + THEME.id, sources: THEME.sources, layers: THEME.layers };
          /* ⚠️ 用条件赋值而不是 `sky: undefined` —— 后者会被当成"写了这个键"，
             样式校验会报错，而 `load` 永不触发、画布全透明（这页的文件头记着这条）。 */
          if (THEME.sky) st.sky = THEME.sky;
          /* 🎨 `?art=2` 的变体在这里落地（art=1 时 `applyArt` 原样返回 ⇒ 旧版零改动） */
          try {
            const r = applyArt(st);
            window.__ART_CHANGED__ = r.changed;
          } catch (e) {
            window.__ART_CHANGED__ = -1; // 变体出错 ⇒ HUD 如实报，不影响旧版
          }
          return st;
        }
        return makeStyleFallback();
      }

      /** 取不到 `/wstheme.json` 时的兜底：本页原来那套暗色配方（一字不改，保证页面还能跑） */
      function makeStyleFallback() {
        return {
          version: 8,
          name: "ws-3d-show",
          /* 大气透视：远处的楼往天色里化开。本 vendored 构建（v6.10.0）**不支持** `light`
             与 fill-extrusion-ambient-occlusion，所以"光照"只能靠"高度色阶 + 竖向渐变 + 雾"凑。 */
          sky: {
            "sky-color": "#0a1119", "horizon-color": "#1b2a3a", "fog-color": "#0d1620",
            "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.4, "atmosphere-blend": 0.7,
          },
          sources: {
            /* Esri 免 key。⚠️ 路径是 {z}/{y}/{x}（y 在前）—— 写错**不报错**，地图会跑到别处。 */
            base: {
              /* ⚠️ 暗色 Canvas 系列**最高只到 z16**（z17+ 是「Map data not yet available」占位图），
                 所以限 16，让 MapLibre 放大复用；z16 以上由 `hi`（卫星）接手。 */
              type: "raster", tileSize: 256, maxzoom: 16,
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
              attribution: "Sources: Esri, HERE, Garmin, © OpenStreetMap contributors",
              /* 🔴 不写这行 ⇒ 跨域瓦片**污染画布** ⇒ toDataURL 抛 SecurityError ⇒ 代拍全废
                 （而画面上一切正常，只有取图那一步失败，极其难查）。Esri 实测回 ACAO:* 。 */
              crossOrigin: "anonymous",
            },
            /* 🛰 高分层（z16 以上）。机主 2026-09-20：「**地图太糊了**（放太大直接变成灰蒙蒙的）」
               —— 根因是暗色 Canvas 系列**最高只到 z16**，z17~18 等于把 z16 放大 2~4 倍。
               实测（逐块下载比对）：`Canvas/World_Dark_Gray_Base` z17 与 `World_Topo_Map` z16
               的瓦片 **md5 完全相同**（都是 2521B 的「Map data not yet available」占位图）
               ⇒ **Topo 在这片也是死路**；只有 `World_Imagery` z16/17/18 逐级有真细节
               （15556/13291/9993B）。所以高分层用卫星影像，并**压进暗部**（白天亮照片
               直接铺会白得刺眼、而且比楼还亮 ⇒ 3D 楼会消失在背景里）。 */
            hi: {
              type: "raster", tileSize: 256, maxzoom: 19, crossOrigin: "anonymous",
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
              attribution: "Sources: Esri, Maxar, Earthstar Geographics",
            },
            /* 注记层（街名/地名）：暗色底图 Base 是**不带字**的，只铺它看不出"这是哪条街"。 */
            ref: {
              type: "raster", tileSize: 256, maxzoom: 19, crossOrigin: "anonymous",
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"],
            },
          },
          layers: [
            { id: "bg", type: "background", paint: { "background-color": "#0a1017" } },
            /* 地面：压暗 + 去饱和，把"主角位"让给楼体（不压的话楼和地一个亮度，糊成一片） */
            {
              id: "base", type: "raster", source: "base",
              /* z14.5 起往 0 淡出，把"地面"交给高分层（交叉过渡，不"咔"一下换底） */
              paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 14.5, 0.92, 16.2, 0], "raster-saturation": -0.25, "raster-contrast": 0.04, "raster-brightness-max": 0.74 },
            },
            {
              id: "hi", type: "raster", source: "hi", minzoom: 14.5,
              paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 14.5, 0, 16.2, 0.95], "raster-saturation": -0.4, "raster-contrast": 0.12, "raster-brightness-min": 0.0, "raster-brightness-max": 0.34 },
            },
            /* 注记压在楼之上（和地图 App 一个口径：街名不该被楼挡住）。
               楼房图层由 `addBldLayers()` 在**数据到了之后**插到它前面。 */
            { id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.9 } },
          ],
        };
      }

      /**
       * 楼房图层规格（**不能写进 `makeStyle()` 的 layers 里**！）。
       *
       * 🔴 2026-09-19 血案（代价 = 机主白点一次代拍）：
       * 我一开始把 `bld-ext` / `bld-line` 直接写在样式的 `layers` 数组里，而它们引用的
       * `bld` 源要等数据到了才 `addSource` ⇒ 样式校验直接失败：
       *   `layers[2]: source "bld" not found`
       * ⇒ `map.on("load")` **永远不触发** ⇒ 底图不画、楼不画、连瓦片都不请求，
       *   画布**全透明**（`toDataURL` 出来 RGBA 全是 0），而**页面零报错**
       *   （错误只在 `map.on("error")` 里，我们没显示）。
       * 代拍回来的三张"纯白"就是它 —— 白 = 全透明 α=0，看图器铺白底。
       *
       * 规矩：**样式里只写"一开始就存在的东西"**；随数据来的图层一律 `addLayer` 后加。
       */
      /**
       * 🎮 楼体色阶表达式。
       * · 基准版 = 平滑插值（`interpolate`，8 档）；
       * · `?look=2` = **硬边 `step`（cel 分档）** —— 抄 cel shading 的"三档之间是硬边"。
       *
       * ⚠️ **停靠点与颜色都来自主题**（`THEME.ramp`），这里只决定"**插值形式**"
       * ⇒ 换观感换的是关系，不是又一份配色（页面里没有一个楼体色号）。
       */
      function rampExpr(stops, ramp) {
        if (LOOK === 2 && ramp && ramp.length >= 2) {
          const out = ["step", ["get", "h3d"], ramp[0][1]];
          for (let i = 1; i < ramp.length; i++) out.push(ramp[i][0], ramp[i][1]);
          return out;
        }
        return ["interpolate", ["linear"], ["get", "h3d"], ...stops];
      }

      /**
       * 🎮 **接触阴影**（`?look=2`）：把同一份楼脚印再画两遍，压在楼体**之下**。
       *
       * 为什么要这样：MapLibre 的 `fill-extrusion` **不投阴影**（没有 shadow map，
       * 也没有 `fill-extrusion-ambient-occlusion-*` —— 那是 Mapbox 的字段，我们的 spec 里没有）。
       * ⇒ 用"楼脚印的深色薄层"近似落地感：一层带像素偏移的**面**（太阳在左上 ⇒ 影子往右下）
       *   + 一层贴边的**模糊线**（接触阴影，让楼像"坐"在地上而不是飘着）。
       * 颜色/偏移/模糊**全部取自 `THEME.look.shadow`**（页面不写第二套数字）。
       * 低档（`?low=1`）**不画**（两条全屏要素层，帧率优先）。
       */
      function bldShadowLayers() {
        const s = THEME && THEME.look && THEME.look.shadow;
        if (LOOK !== 2 || !s || BLD_LOW) return [];
        return [
          {
            id: "bld-shadow", type: "fill", source: "bld",
            paint: {
              "fill-color": s.color,
              "fill-opacity": s.opacity,
              /* 屏幕空间偏移（不随 zoom 变 —— 太阳的位置不该因为放大而变） */
              "fill-translate": [s.dx, s.dy],
            },
          },
          {
            id: "bld-ao", type: "line", source: "bld",
            paint: {
              "line-color": s.color,
              "line-opacity": Math.min(1, s.opacity + 0.15),
              "line-width": s.width,
              /* 模糊 = "接触阴影"那种软边（硬边会像描边，不是影子） */
              "line-blur": s.blur,
            },
          },
        ];
      }

      function bldLayerSpecs() {
        /* 色阶/描边/平涂开关**全部跟着主题走**（和产品组件同源，见 `wsMapTheme.ts`）。
           兜底值 = 本页原来那套暗色配方（与「一页一主题」原则一致：只在 `FALLBACK_RAMP` 写一份）。 */
        const ramp = artRamp(THEME?.ramp || FALLBACK_RAMP); // 🎨 art=2 把高段推到近白（`artRamp` 在 art=1 时**原样返回**）
        const outline = THEME?.outline || { color: "rgba(190,235,255,0.22)", width: 0.5 };
        /* 平涂（二次元）= 关掉竖向渐变；写实（暗色）= 开着。 */
        const vgrad = THEME ? THEME.verticalGradient : true;
        const opacity = THEME?.extrudOpacity || 0.97;
        const stops = [];
        for (const [h, c] of ramp) stops.push(h, c);
        /* 🏢 `?bld=2` 走"拆件"那套图层（颜色读要素自带的 `color3d`、底座读 `h_base`） */
        if (BLD === 2) return bldShadowLayers().concat(bldLayerSpecsDetail(outline, vgrad, opacity, stops, ramp));
        return bldShadowLayers().concat([
          {
            id: "bld-ext", type: "fill-extrusion", source: "bld",
            paint: {
              /* 按**渲染高度**上色：矮的沉下去、高的亮起来 ⇒ 一眼看出天际线的高低起伏。
                 （按"数据来源"上色就会是一整片平色 —— 数据口径不该当美术用。）
                 🎮 `?look=2`：同一张色阶，但换成**硬边分档**（cel）。 */
              "fill-extrusion-color": rampExpr(stops, ramp),
              "fill-extrusion-height": ["get", "h3d"],
              "fill-extrusion-base": ["coalesce", ["get", "min_height"], 0],
              "fill-extrusion-opacity": opacity,
              /* 墙面竖向渐变：楼顶比楼底亮一点，体块才有"立起来"的感觉；
                 二次元的**平涂**要关掉它（楼是一块纯色板才"动画"）。
                 🎮 `?look=2` 把主题的 `verticalGradient` 打开了（受光面/背光面 + 落地感）。 */
              "fill-extrusion-vertical-gradient": vgrad,
            },
          },
          {
            /* 轮廓线。暗色里它只是淡淡一圈；**二次元里它是主角** ——
               BA 风的地面(0.919)和矮楼(0.87)亮度几乎一样，全靠这条深藏青细线把楼"勾"出来。
               🎮 `?look=2` 地面压暗之后，这条线**翻成亮线**（深底亮线），颜色同样来自主题。 */
            id: "bld-line", type: "line", source: "bld",
            paint: {
              "line-color": outline.color,
              /* 🎨 art=2：描边**随 zoom 变细/变粗**（近粗 ⇒ 动画感；远细 ⇒ 不糊成一片）。
                 art=1 保持主题给的固定宽度（旧版逐字节不变）。停靠点只有一份（`OUTLINE_STOPS`）。 */
              "line-width": ART >= 2 ? outlineWidthExpr() : outline.width,
            },
          },
        ]);
      }

      /** 描边层（两种形体档**共用同一份规格**：A/B 时"只有形体不同"，别把描边也换了） */
      function bldLineLayer(outline) {
        return {
          id: "bld-line", type: "line", source: "bld",
          paint: {
            "line-color": outline.color,
            "line-width": ART >= 2 ? outlineWidthExpr() : outline.width,
          },
        };
      }

      /**
       * 🏢 `?bld=2` 的楼房图层：**色彩层 + （可选）窗格层 + 描边层**。
       *
       * 为什么窗格要单开一层：`fill-extrusion-color` 带 `requires: 非 pattern`
       * ⇒ **同一个图层里 pattern 与 color 互斥**（写了 pattern 再写 color，样式校验会失败、
       *  图层不画，而这个项目为"图层静默不画"付过代价）。所以两层，filter **互补**：
       *  · `bld-win`：`win == 1`（纯函数里算好的"够高的墙面"）→ 铺图案；
       *  · `bld-ext`：`win != 1` → 走色阶（与基准版同一张色阶，逐要素取 `color3d`）。
       * 互补由**要素上的 0/1 标记**保证（不是在图层的 filter 里拼表达式 —— 表达式报错是静默的）。
       */
      function bldLayerSpecsDetail(outline, vgrad, opacity, stops, ramp) {
        const paintCommon = {
          "fill-extrusion-height": ["get", "h3d"],
          /* ⚠️ 拆件的体块**没有 `min_height`** ⇒ 必须先读 `h_base`（裙楼/塔楼/退台各自落在不同高度） */
          "fill-extrusion-base": ["coalesce", ["get", "h_base"], ["coalesce", ["get", "min_height"], 0]],
          "fill-extrusion-opacity": opacity,
          "fill-extrusion-vertical-gradient": vgrad,
        };
        const colorLayer = {
          id: "bld-ext", type: "fill-extrusion", source: "bld",
          paint: {
            ...paintCommon,
            /* 颜色读要素自带的 `color3d`（同一张高度色阶 + 按部位调明暗：女儿墙偏亮、设备箱偏深）。
               🎮 `?look=2` 时兜底那条换成硬边分档（`color3d` 缺席的要素才走它）。 */
            "fill-extrusion-color": ["coalesce", ["get", "color3d"], rampExpr(stops, ramp)],
          },
        };
        if (WINS) colorLayer.filter = ["!=", ["get", "win"], 1]; // 与窗格层互补
        const winLayer = {
          id: "bld-win", type: "fill-extrusion", source: "bld",
          filter: ["==", ["get", "win"], 1],
          paint: { ...paintCommon, "fill-extrusion-pattern": WIN_IMAGE_ID },
        };
        return WINS ? [colorLayer, winLayer, bldLineLayer(outline)] : [colorLayer, bldLineLayer(outline)];
      }

      /* ══ 🎨 美术变体 `?art=2`（机主 2026-09-21：先在**代拍页**做一版，别碰 App 与角色）════
         规矩：**只在这一页做**、**不动 `ANIME` 基准值**、**只改"图层里已经存在的 paint 键"**
         （`patchPaint()` 会跳过不存在的键 —— 我们被"往 style 塞未知键 ⇒ 整份校验失败 ⇒ load 永不触发"坑过）。
         参考：`~/rikka/Dsh-SYuki/world_map/ART-STUDY.md`（高调平涂 / 描边随距离 / 基沃托斯的天）。 */
      const ART = (function () {
        try {
          if (/[?&]art=3\b/.test(location.search)) return 3;
          if (/[?&]art=2\b/.test(location.search)) return 2;
          return 1;
        } catch (e) { return 1; }
      })();
      /** art=3 才有的东西（云/山影/raster 调色）；art=2 及以上都走"高调"那套补丁 */
      const ART3 = ART === 3;

      /* ══ 🏢 楼房**形体细化** `?bld=2`（机主 2026-09-24：「能优化一下楼房模吗啊喵」）════════
         做法：几何**全在纯函数里**（`wsBuildingLook.ts` 第四步 → 经 `/vendor/wsScene.mjs` 进来），
         页面只干两件事：① 把生成好的要素喂给地图；② 把"生成了多少"写进 HUD/徽标（回证）。
         这一页**不抄第二份几何/计数逻辑** —— 抄一份就一定会和 App 侧漂。

         A/B（**不加参数 = 这一页原来的行为，一字不改**）：
           · （无参数）基准版：一栋楼一个挤出体（只有 h3d 上色）；
           · `?bld=2`：裙楼+塔楼 / 退台 / 女儿墙 / 设备箱 / 天线（拆成多块要素）；
           · `?bld=2&win=1`：再加**窗格贴图**层（`pattern` 与 `color` 互斥 ⇒ 同一 source 开两层）；
           · `?bld=2&low=1`（或 `__PERF_LOW__`）：低档 —— 只画主体 + 描边。
         ⚠️ 模块没加载/没有 `decorateBuildings` 时**如实回退**到基准版，并把原因写进徽标
         （回退 == 静默失效，是这个项目反复踩过的坑）。 */
      const BLD = (function () { try { return /[?&]bld=2\b/.test(location.search) ? 2 : 1; } catch (e) { return 1; } })();
      let WINS = BLD === 2 && (function () { try { return /[?&]win=1\b/.test(location.search); } catch (e) { return false; } })();
      const BLD_LOW = (function () { try { return !!(window.__PERF_LOW__ || /[?&]low=1\b/.test(location.search)); } catch (e) { return false; } })();
      /** 窗格层的状态（**三态判词**：未开 / 已开 / 失败：原因）—— 徽标如实显示，别让人以为是开了 */
      let winState = WINS ? "待建图" : "未开（要 ?win=1）";

      /* ══ 🛰 LOD 第 1 步（机主 2026-09-24：「采用近距离渲染，远距离预渲染的方式加载全国楼房数据和道路喵！」）══
         本页只做**切换骨架**：远处（z≤12）铺**预渲染瓦片**、近处（z≥14）走**实时矢量**，中间按 zoom 交叉过渡；

          if (m[1] === "casing" && glow && glow.ranks.indexOf(rank) >= 0) {
            out.push({
              id: "road-glow-" + rank, type: "line", source: "roads",
              minzoom: l.minzoom, filter: l.filter, layout: l.layout,
              paint: {
                /* 辉光用**路芯的亮色**（用 casing 的暗色 = 一条看不见的黑晕） */
                "line-color": (THEME.road && THEME.road.rankColors && THEME.road.rankColors[rank]) || paint["line-color"],
                "line-width": +(w * glow.widthScale).toFixed(2),
                "line-blur": glow.blur,
                "line-opacity": glow.opacity,
              },
            });
          }
          out.push(Object.assign({}, l, { paint: paint }));
        }
        return { specs: out, changed: changed };
      }

      async function applyRoads() {
        const TF2 = window.__TF__;
        if (!TF2) { $("m-msg").textContent = "路网：生成物未加载（/vendor/wsScene.mjs）"; return; }
        let roads = { features: [] };
        try { roads = await fetchRoads(stats.r || 600); } catch (e) { errs.push("roads " + e); }
        const feats = (roads && roads.features) || [];
        roadN = TF2.visibleRoadCount({ features: feats }, map.getZoom());
        if (!feats.length) {
          /* 空结果**必须说出来**（同 App 的纪律：静默 = 让人以为"这里没路"） */
          const el = document.getElementById("m-roads");
          if (el) el.textContent = `🛣 0 条 · 这一带没有路网数据（${stats.r || 600}m）`;
          return;
        }
        const data = { type: "FeatureCollection", features: feats };
        try {
          if (map.getSource("roads")) map.getSource("roads").setData(data);
          else map.addSource("roads", { type: "geojson", data });
          const specs = TF2.roadLayerSpecs((THEME && THEME.road) || undefined);
          /* 🎮 `?look=2`：在**建层之前**就把宽度改好 + 插入辉光层（事后 setPaintProperty 也行，
             但那会多一条"改没改到"的疑问；建层用同一份规格 = 屏幕上和回证里是同一份数据）。 */
          const lk = lookRoadSpecs(specs);
          window.__LOOK_ROAD_CHANGED__ = lk.changed;
          /* 🎬 before 来自**计划**（`wsScene.sceneLayerPlan()`）；拿不到才退回本地判断 */
          const before = planBefore("roads") !== undefined
            ? planBefore("roads")
            : (map.getLayer("bld-ext") ? "bld-ext" : (map.getLayer("ref") ? "ref" : undefined));
          for (const l of lk.specs) if (!map.getLayer(l.id)) map.addLayer(l, before);
        } catch (e) { errs.push("roadLayers " + e); }
        const stat = (roads && roads.stats) || null;
        window.__ROAD_N__ = roadN;
        window.__ROAD_STAT__ = stat ? TF2.roadStatsLine(stat) : null;
        /* 🛣 路数走**独立 HUD 格**（`m-msg` 会被交通设施那行覆盖 —— 那就是"看不见路"的来源之一） */
        renderRoadHud();
        window.__ROAD_AUDIT__ = roadAudit();
      }

      /**
       * 🛣 **路网自证**（2026-09-22：机主两张图对比发现"`?tf=1` 时路网不见了"——
       * 本机无头无 WebGL，我复现不了 ⇒ 按主会话要求**把断言与证据放进页面**，
       * 让下一次刷新直接告诉我们：source 在不在、图层在不在、可见几条、有什么错。
       */
      function roadAudit() {
        const out = { hasSource: false, layerIds: [], visible: null, errs: [] };
        try { out.hasSource = !!map.getSource("roads"); } catch (e) { out.errs.push("getSource " + e); }
        try {
          out.layerIds = (map.getStyle().layers || []).map(function (l) { return l.id; })
            .filter(function (id) { return /^road-(casing|line)-/.test(id); });
        } catch (e) { out.errs.push("layers " + e); }
        try {
          const src = map.getSource("roads");
          const data = src && src._data ? src._data : null; // MapLibre 内部字段：**只读诊断**用
          out.visible = data ? window.__TF__.visibleRoadCount(data, map.getZoom()) : null;
        } catch (e) { out.errs.push("count " + e); }
        return out;
      }
      /** 🛣 层序**事后断言**：缺就补、被压在上面就 `moveLayer()`，并计数（HUD 报"自愈 N 次"） */
      let roadHeals = 0;
      function ensureRoadOrder() {
        const TF2 = window.__TF__;
        if (!TF2 || !TF2.planEnsureRoadOrder) return;
        const fake = {
          hasSource: function (id) { return !!map.getSource(id); },
          hasLayer: function (id) { return !!map.getLayer(id); },
          layerIds: function () { return (map.getStyle().layers || []).map(function (l) { return l.id; }); },
        };
        let ops = [];
        try { ops = TF2.planEnsureRoadOrder(fake); } catch (e) { errs.push("planOrder " + e); return; }
        for (const o of ops) {
          try {
            if (o.op === "add-roads") { void applyRoads(); }
            else if (o.op === "move" && o.id && map.getLayer(o.id)) map.moveLayer(o.id, o.before);
            roadHeals++;
            errs.push("roadHeal: " + o.why);
          } catch (e) { errs.push("roadHeal fail " + e); }
        }
        if (ops.length) { try { renderRoadHud(); } catch (e) { /* 忽略 */ } }
      }

      function renderRoadHud() {
        try {
          const TF2 = window.__TF__;
          const el = document.getElementById("m-roads");
          if (!el || !TF2 || !TF2.roadCountVerdict) return;
          const a = roadAudit();
          const lineIds = a.layerIds.filter(function (id) { return id.indexOf("road-line-") === 0; });
          /* ① 直接证据：**屏幕上可见**的路网要素 */
          let rendered = null, source = null, tilesLoaded = null;
          try {
            if (lineIds.length) rendered = map.queryRenderedFeatures({ layers: lineIds }).length;
          } catch (e) { errs.push("qRendered " + e); }
          /* ② 退路：数据源要素（⚠️ 瓦片没加载完时会是 0 ⇒ 不能当"没有"） */
          try {
            if (rendered === null || rendered === 0) source = map.querySourceFeatures("roads").length;
          } catch (e) { errs.push("qSource " + e); }
          try { if (map.areTilesLoaded) tilesLoaded = !!map.areTilesLoaded(); } catch (e) { tilesLoaded = null; }
          const v = TF2.roadCountVerdict({
            hasSource: a.hasSource, layerCount: a.layerIds.length,
            rendered: rendered, source: source, tilesLoaded: tilesLoaded,
          });
          el.textContent = TF2.roadCountHud(v, a.layerIds.length, roadHeals) + (v.state === "unknown" ? " · " + v.why : "");
          window.__ROAD_VERDICT__ = v;
        } catch (e) { /* HUD 失败不影响地图 */ }
      }

      /* ══ 🛰 LOD 第 1 步：预渲染瓦片层（`?lod=1`）═══════════════════════════════════════
         目标（机主原话）：「**近距离渲染，远距离预渲染**」。本页只做**切换骨架**：
           · `z ≤ Z_FAR`(12) → 预渲染瓦片独占；`z ≥ Z_NEAR`(14) → 实时矢量独占；中间按 zoom 交叉过渡；
           · 过渡**复用**既有那套机制（照片底图 `base` 的 `raster-opacity` 随 zoom 淡出，见 `wsMapTheme.baseFade`）
             —— 预渲染层用**同一个形状**的表达式，铺在矢量层**之上**淡出，不新造一套动画；
           · 阈值/层 id/表达式/瓦片键算法**全部取自 `wsScene`**（`/vendor/wsScene.mjs`）；
           · 颜色在**瓦片像素**里，取自 `wsMapTheme.wsPrerenderPalette()`（生成脚本 + 清单指纹兜漂移）。

         🔴 回证（**三态判词**）：当前档位 / 瓦片命中·失败·清单缺 / 实时层要素数；
            「数不出来」一律带原因，**绝不裸写 0**（`AUDIT-STINK.md` 的判词纪律）。
         🔴 **默认不启用**：`?lod` 不写 = 一个源一个图层都不建（现有观感逐字节不变）。 */

      /** 取"能用的" LOD 计划；模块缺符号 ⇒ **如实回退**并把原因写进 `lodState` */
      function lodPlanOf() {
        if (lodPlanCache) return lodPlanCache;
        const TFx = window.__TF__;
        if (!TFx || typeof TFx.lodPlan !== "function") {
          lodState = "失败：模块里没有 lodPlan（" + tfState + "）—— 多半是浏览器缓存了旧的 /vendor/wsScene.mjs（强刷或让主会话重建预览包）";
          return null;
        }
        try {
          lodPlanCache = TFx.lodPlan();
          return lodPlanCache;
        } catch (e) {
          lodState = "失败：lodPlan() 抛错 " + String(e).slice(0, 60);
          return null;
        }
      }

      /** 判定一次并把结论写进 HUD/徽标（**纯函数在模块里，页面只喂证据**） */
      function updateLodHud() {
        const el = $("m-lod");
        if (!el) return;
        if (!LOD_ON) {
          el.textContent = "🛰 LOD 未启用（URL 加 `?lod=1`；当前未建预渲染层）";
          lodVerdict = null;
          lodLive = null;
          renderLodBadge();
          renderLodAttribution();
          return;
        }
        const TFx = window.__TF__;
        if (!TFx || typeof TFx.lodTileVerdict !== "function" || typeof TFx.lodHudLine !== "function") {
          el.textContent = "🛰 LOD 数不出来：" + lodState;
          renderLodBadge();
          return;
        }
        let view = null;
        try { view = TFx.lodViewTiles(map.getBounds(), map.getZoom(), (lodPlanCache && lodPlanCache.tileMaxzoom) || 13); } catch (e) { view = null; }
        /* 🧩 证据的**读取**也在单一真源里（`wsScene.lodTileStatesOf` / `lodLiveVerdictOf`）——
           页面只负责"调它 + 把结论写到 DOM"。App 接 LOD 时也是这两行，不需要第二份实现
           （PR 标准①：运行期逻辑只在共享真源，页面只是试验台）。 */
        const states = TFx.lodTileStatesOf ? TFx.lodTileStatesOf(map) : null;
        lodLive = TFx.lodLiveVerdictOf ? TFx.lodLiveVerdictOf(map) : null;
        lodVerdict = TFx.lodTileVerdict({
          enabled: true,
          view: view,
          /* 清单**整份**传进去（键 → 记录）⇒ 判词能分出"真 / 占位 / 缺"（只传键就分不出来） */
          inventory: lodManifest && lodManifest.tiles ? lodManifest.tiles : null,
          /* 事件口径（可能一张都没到：那时是空数组 = **真的量到 0**，与"拿不到坐标"不同） */
          loaded: lodNoKey && !lodLoadedKeys.size ? null : Array.from(lodLoadedKeys),
          failed: lodFailedKeys.size ? Array.from(lodFailedKeys) : (lodNoKey ? null : []),
          /* 只读诊断口径（**最硬**的证据：瓦片状态 loaded/errored）——拿不到就是 null ⇒ 判"数不出来" */
          states: states,
        });
        el.textContent = TFx.lodHudLine({ enabled: true, zoom: map.getZoom(), tiles: lodVerdict, live: lodLive }) +
          (lodState.indexOf("失败") === 0 ? " · " + lodState : "") +
          (lodManifestErr ? " · 清单没取到：" + lodManifestErr : "");
        window.__LOD_VERDICT__ = lodVerdict;
        window.__LOD_LIVE__ = lodLive;
        window.__LOD_TILE_STATES__ = states;
        renderLodBadge();
        renderLodAttribution();
      }
      let lodHudTimer = null;
      function scheduleLodHud() {
        if (!LOD_ON || lodHudTimer) return;
        try {
          lodHudTimer = setTimeout(function () { lodHudTimer = null; try { updateLodHud(); } catch (e) { /* 忽略 */ } }, 250);
        } catch (e) { lodHudTimer = null; }
      }

      /** 逐项回证表（徽标用）—— 三态：✅命中 / ❌未命中 / ⏭跳过（跳过 = 如实记"没做/做不了"） */
      function lodReadback() {
        if (!LOD_ON) return null;
        const TFx = window.__TF__;
        const rows = [];
        const on = function (id, key, now, want, why) {
          const hit = want === null ? null : JSON.stringify(now) === JSON.stringify(want);
          rows.push({ id: id, key: key, now: now, want: want, hit: hit, why: why });
        };
        const plan = lodPlanCache;
        on("开关", "?lod", LOD_ON ? "1（已开）" : "未开", 1, "`?lod=0` 显式关 / 不写 = 关（默认不改现有观感）");
        on("图层", "prerender 在", map.getLayer("prerender") ? "在" : "**不在**", "在", "由 lodPlan() 建；缺了就是没建成（看 errs/lodState）");
        on("数据源", "prerender 源在", map.getSource("prerender") ? "在" : "**不在**", "在", "我们**自己的**瓦片源（`" + ((plan && plan.tilePath) || "?") + "`），不是 Esri");
        /* 层序：预渲染层必须在矢量层**之上**（远景要盖住实时层），否则过渡一淡就露出实时层 */
        const order = (map.getStyle().layers || []).map(function (l) { return l.id; });
        const iPre = order.indexOf("prerender");
        const above = ["bld-ext", "road-line-0", "tf-bus"].every(function (id) {
          const i = order.indexOf(id);
          return i < 0 || (iPre >= 0 && iPre > i);
        });
        rows.push({ id: "层序", key: "预渲染层在矢量层之上", now: iPre < 0 ? "层不在" : (above ? "是（" + order.slice(Math.max(0, iPre - 2), iPre + 1).join("<") + "）" : "**否**"), want: "是", hit: iPre < 0 ? "no-layer" : above, why: "远景靠它盖住实时层；反过来放就得给每条路/楼写一份淡入（= 新造一套机制）" });
        const op = (function () { try { return map.getPaintProperty("prerender", "raster-opacity"); } catch (e) { return "(取值抛错)"; } })();
        const isExpr = Array.isArray(op);
        rows.push({ id: "不透明度", key: "raster-opacity", now: isExpr ? ("zoom 表达式 " + JSON.stringify(op)) : String(op), want: "zoom 表达式", hit: isExpr, why: "与照片底图淡出**同一形状**（`[\"interpolate\",[\"linear\"],[\"zoom\"], 12,1, 14,0]`）⇒ 复用同一机制" });
        const v = lodVerdict;
        const num = function (n, zero) { return n === null || n === undefined ? "数不出来" : n === 0 ? (zero || "0（已量）") : String(n); };
        rows.push({ id: "瓦片", key: "命中（已载入）", now: num(v ? v.hit : null), want: null, hit: null, why: "口径：瓦片状态=loaded 的个数（MapLibre 内部只读诊断）；拿不到就写「数不出来」" });
        rows.push({ id: "瓦片", key: "加载失败", now: num(v ? v.fail : null), want: null, hit: null, why: "口径：瓦片状态=errored（含 404 —— `_loadTile` 的 catch 里先置状态）⇒ 这一格能数出**真缺图**；⚠️ 而 `map.on(\"error\")` **收不到 404**（读 vendored 源码确认），所以别只信事件" });
        rows.push({ id: "瓦片", key: "清单缺（视野内）", now: num(v ? v.absent : null), want: null, hit: null, why: "视野需要的键里、`/prerender/manifest.json` **没有**的那些 ⇒ 必然会取不到（确定性证据，不依赖事件）" });
        rows.push({ id: "瓦片", key: "本区应有", now: v && v.capped ? "被上限截断（数不全）" : num(v ? v.view : null), want: null, hit: null, why: "视野 + 当前 zoom 夹到瓦片层算出来的键数" });
        rows.push({ id: "清单", key: "manifest", now: lodManifest ? (lodManifest.tileCount + " 张 · 主题 " + lodManifest.themeId + " · 指纹 " + String(lodManifest.themeFingerprint).slice(0, 12) + "…") : ("数不出来：" + (lodManifestErr || "还没取")), want: null, hit: null, why: "生成物清单；**指纹**由 ws_lod_selftest 对拍 wsMapTheme（改了主题没重跑生成脚本 ⇒ 那边会红）" });
        rows.push({ id: "实时层", key: "要素数", now: lodLive ? (lodLive.state === "missing" ? "0（已量：图层没建）" : num(lodLive.n)) : "数不出来（还没查）", want: null, hit: null, why: lodLive ? lodLive.why : "还没查（移动地图后刷新）" });
        rows.push({ id: "档位", key: "当前 zoom", now: map.getZoom().toFixed(2) + " ⇒ " + (TFx && TFx.lodTierLabel ? TFx.lodTierLabel(TFx.lodTierOf(map.getZoom())) : "数不出来"), want: null, hit: null, why: "预渲染 / 过渡中 / 实时矢量（阈值与标签都来自 wsScene）" });
        rows.push({
          id: "瓦片来源", key: "示意 / 真数据",
          now: lodDataKindText(), want: null, hit: null,
          why: "`manifest.dataKind`：`placeholder` = 骨架阶段的**示意**花纹（远景像瓷砖是它，不是 bug）；`real` = 离线管线用**真楼脚印+道路**画的",
        });
        rows.push({
          id: "署名", key: "ODbL 可见署名",
          now: lodManifest && lodManifest.attribution ? String(lodManifest.attribution) : ("数不出来：" + (lodManifestErr || "清单还没取到")),
          want: null, hit: null,
          why: "**PR 阻断项**：Overture 派生瓦片按 ODbL 要求可见署名；MapLibre 的 attributionControl 关着 ⇒ HUD 那一行就是等价方案（文案取自清单，不抄第二份）",
        });
        rows.push({ id: "跳过", key: "真数据（重庆全市）", now: window.__LOD_REAL__ ? "是（管线瓦片）" : "未确认（清单里没有 data.buildings）", want: null, hit: null, skip: true, why: "全量全市真楼脚印**没做**（公网 S3 实测 4km 盘 224s ⇒ 全市是天级）；试点的真瓦片见 manifest.data.buildings" });
        rows.push({ id: "跳过", key: "真机画面 / 帧率", now: "未验", want: null, hit: null, skip: true, why: "本机无头**没有 WebGL** ⇒ 「远处清不清楚、过渡跳不跳」只能机主真机看，我不下结论" });
        return rows;
      }

      /**
       * 🛰 **署名**（PR 阻断项）：我们渲染的是 Overture（**ODbL 1.0**）派生瓦片 ⇒ 许可要求**可见署名**。
       * MapLibre 的 `attributionControl` 是关的 ⇒ 这一行就是"等价可见方案"（面板/HUD 一行小字）。
       * 文案**只从清单里读**（生成管线写的那句，与 `overture_api.py.ATTRIBUTION` 同一份）——
       * 页面不抄第二份，清单没取到就写「数不出来」+ 原因（**不许静默不显示**）。
       */
      function renderLodAttribution() {
        try {
          const el = $("m-attr");
          if (!el) return;
          if (!LOD_ON) { el.textContent = ""; return; }
          const at = lodManifest && lodManifest.attribution;
          if (at) { el.textContent = String(at); return; } // **逐字显示**清单里那句（不自己加前缀/改写）
          /* 三态：清单没取到 / 取到了但**没有** attribution 字段（骨架阶段的示意瓦片就是这样）——
             两种都**可见地写出来**，不许静默不显示（署名是 ODbL 的硬要求）。 */
          el.textContent = lodManifest
            ? "© 数据署名 数不出来：清单里没有 attribution 字段（骨架阶段的示意瓦片没有署名；真瓦片由 prerender_pipeline.py 写）"
            : "© 数据署名 数不出来：" + (lodManifestErr || "清单还没取到");
        } catch (e) { /* 署名失败不影响地图 */ }
      }

      /** 这批瓦片是**示意**还是**真数据**（`manifest.dataKind`；缺失就如实说"标不出来"） */
      function lodDataKindText() {
        if (!lodManifest) return "数不出来（清单没取到）";
        const n = lodManifest.kinds || null;
        if (n && (n.real || n.placeholder)) return `清单汇总：真 ${n.real || 0} / 占位 ${n.placeholder || 0}`;
        const k = lodManifest.dataKind;
        if (k === "real") return "真数据（管线生成）";
        if (k === "placeholder") return "**示意**（骨架阶段占位花纹，不是真楼房）";
        return "标不出来（清单里既没有 kinds 也没有 dataKind）";
      }

      function renderLodBadge() {
        try {
          const head = $("lodb-head");
          const body = $("lodb-body");
          const box = $("lodb");
          if (!head || !body || !box) return;
          const rows = lodReadback();
          head.onclick = function () { box.classList.toggle("is-open"); };
          if (!rows) {
            head.textContent = "🛰 LOD 未启用（?lod=1）";
            body.innerHTML = '<div class="artb__row">· 开法：URL 加 <b>?lod=1</b>（远处铺预渲染瓦片、近处走实时矢量、中间交叉过渡）</div>' +
              '<div class="artb__row">· 不加参数 = **现有观感一字不改**（一个源/图层都不建）</div>' +
              '<div class="artb__row">· 骨架阶段的瓦片是**示意**瓦片（假几何）；真数据管线是第 2 步</div>';
            return;
          }
          const hitN = rows.filter(function (r) { return r.hit === true; }).length;
          const missN = rows.filter(function (r) { return r.hit === false || r.hit === "no-layer"; }).length;
          const skipN = rows.filter(function (r) { return r.skip; }).length;
          const badKeys = rows.filter(function (r) { return r.hit === false || r.hit === "no-layer"; })
            .map(function (r) { return r.id + "." + r.key; });
          head.textContent = (missN ? "⚠️ " : "") + "🛰 LOD ✅" + hitN + " ❌" + missN + (badKeys.length ? "（" + badKeys.join("；") + "）" : "") +
            " ⏭" + skipN + " · " + lodState;
          body.innerHTML = rows.map(function (r) {
            const mark = r.skip ? '<span class="artb__skip">⏭</span>'
              : r.hit === true ? '<span class="artb__ok">✅</span>'
                : (r.hit === false || r.hit === "no-layer") ? '<span class="artb__bad">❌</span>' : '<span>·</span>';
            return "<div class=\"artb__row\">" + mark + " " + r.id + "." + r.key + " = " + String(r.now) +
              (r.hit === false || r.hit === "no-layer" ? (" 期望 " + String(r.want)) : "") +
              " <i>" + r.why + "</i></div>";
          }).join("");
        } catch (e) { /* 徽标画不出来不影响地图 */ }
      }

      /**
       * 建层：源 + 图层（**spec 全部来自 `wsScene.lodPlan()`**，页面只负责"插在哪里"）。
       * 插在 `ref`（注记）之前 ⇒ 在楼体/路网**之上**、注记之下；`ref` 不在才退回最上。
       * 清单（`/prerender/manifest.json`）在这里取：拿不到就**如实记原因**，相关数字判"数不出来"。
       */
      async function applyLod() {
        if (!LOD_ON) { updateLodHud(); return; }
        const plan = lodPlanOf();
        if (!plan) { updateLodHud(); return; }
        /* 清单：**只用于回证**（哪些键真的存在）—— 取不到不影响地图，但 HUD 会写清"清单没取到" */
        try {
          const r = await fetch(plan.manifestPath, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          lodManifest = await r.json();
          lodManifestErr = "";
        } catch (e) {
          lodManifest = null;
          lodManifestErr = String(e).slice(0, 60) + "（跑 node world_map/make_prerender_tiles.mjs 生成）";
        }
        try {
          if (!map.getSource(plan.sourceId)) map.addSource(plan.sourceId, plan.source);
          const before = plan.beforeId && map.getLayer(plan.beforeId) ? plan.beforeId : undefined;
          if (!map.getLayer(plan.layerId)) map.addLayer(plan.layer, before);
          lodState = "已建层（" + plan.layerId + " @ " + (before || "最上") + " · z≤" + plan.far + " 瓦片 / z≥" + plan.near + " 矢量）";
          /* 🔎 事后断言：层序对不对（`wsScene` 那份规则，页面不自己判一套） */
          const TFx = window.__TF__;
          if (TFx && TFx.sceneOrderViolations) {
            const vio = TFx.sceneOrderViolations((map.getStyle().layers || []).map(function (l) { return l.id; }));
            window.__LOD_ORDER_VIOLATIONS__ = vio;
            if (vio.length) errs.push("lodOrder: " + vio.join("；"));
          }
        } catch (e) {
          lodState = "失败：建层抛错 " + String(e).slice(0, 60);
          errs.push("lodLayer " + e);
        }
        updateLodHud();
      }

      /** 生成 + 画（**路网之上、楼体之下**：`before="bld-ext"`） */
      async function applyTransport(fc) {
        const TF = window.__TF__;
        if (!TF) { $("m-msg").textContent = "交通设施：生成物未加载（/vendor/wsTransport.mjs）"; return; }
        let roads = { features: [] };
        try { roads = await fetchRoads(stats.r || 600); } catch (e) { errs.push("roads " + e); }
        const toRoad = (f) => ({ pts: (f.geometry && f.geometry.coordinates) || [], cls: f.properties && f.properties.class, name: f.properties && f.properties.name });
        const toBld = (f) => {
          const g = f.geometry || {};
          const ring = g.type === "Polygon" ? (g.coordinates || [])[0] : [];
          return { ring: ring || [], kind: (f.properties || {}).building || (f.properties || {}).kind || "" };
        };
        const c = map.getCenter();
        const res = TF.buildTransport(
          (roads.features || []).map(toRoad).filter(function (r) { return r.pts.length >= 2; }),
          (fc.features || []).map(toBld).filter(function (b) { return b.ring.length >= 3; }),
          [c.lng, c.lat],
          !!(window.__PERF_LOW__ || /[?&]low=1\b/.test(location.search))
        );
        /* 按类别画：每类一个图层（顺序按规则文件；`before="bld-ext"` ⇒ 在楼体之下） */
        for (const kind of ["crosswalk", "driveway", "parking", "bus", "signal"]) {
          const feats = res.features.filter(function (f) { return f.kind === kind; });
          const id = TF.TF_LAYER_IDS[kind];
          try { if (map.getLayer(id)) map.removeLayer(id); } catch (e) { /* 没有就算了 */ }
          try { if (map.getSource(id)) map.removeSource(id); } catch (e) { /* 同上 */ }
          if (!feats.length) continue;
          const style = TF.TF_LAYER_STYLE[kind];
          const gj = {
            type: "FeatureCollection",
            features: feats.map(function (f) {
              return f.to
                ? { type: "Feature", geometry: { type: "LineString", coordinates: [f.at, f.to] }, properties: { why: f.why } }
                : { type: "Feature", geometry: { type: "Point", coordinates: f.at }, properties: { why: f.why, name: f.name || "", n: f.count || 0 } };
            }),
          };
          map.addSource(id, { type: "geojson", data: gj });
          const tfBefore = planBefore("transport") !== undefined
            ? planBefore("transport")
            : (map.getLayer("bld-ext") ? "bld-ext" : undefined);
          map.addLayer({ id: id, type: style.type, source: id, paint: style.paint }, tfBefore);
        }
        /* HUD：**必须**带「示意，非事实」；并回证各计数与裁掉数 */
        $("m-msg").textContent = TF.transportHudLine(res);
        window.__TF_RES__ = res;
        tfDone = true;
      }

      /** 把回证表画到徽标里（点击徽标展开/收起） */

              rows.push({ id: "对比度", key: "描边/地面", now: rep.outlineGroundRatio + ":1", want: "≥4.5:1", hit: rep.outlineGroundRatio >= 4.5, why: "平涂主题靠描边撑对比" });

               " · 🎬" + ((window.__TF__ && window.__TF__.WS_SCENE_SOURCE) ? (window.__SCENE_CONSUMED__ ? "wsScene ✓" : "页面自带（未换源）") : "未加载"))
            : "🎨 art=1（基准版）";

            return '<div class="artb__row">' + mark + " " + r.id + "." + r.key +
              " = " + JSON.stringify(r.now) +
              (r.hit === false ? (" 期望 " + JSON.stringify(r.want)) : "") +

          }).join("");
        } catch (e) { /* 徽标画不出来不影响页面 */ }
      }

      /**
       * 🏢 **形体回证徽标**（`?bld=2`）：把"各细节生成了多少 + 当前档位"写到页面与 HUD 上。
       *
       * 🔴 **三态判词纪律**（`shapeCountsLine()` / `shapeCountRows()` 在纯函数里实现，
       *    页面不再自己拼字符串 —— 免得两处口径不一致）：
       *    · 正数        = 真的生成了这么多；
       *    · `0（已量）` = 确实量到 0；
       *    · `数不出来`  = 没拿到统计（模块没加载 / 生成抛错 / 字段不是有限数）。
       *    **绝不裸写 0** —— "没数"和"数出来是 0"混在一起，回证就废了。
       */
      function renderBldBadge() {
        try {
          const head = $("bldb-head");
          const body = $("bldb-body");
          const box = $("bldb");
          if (!head || !body || !box) return;

          const hud = $("m-bld");
