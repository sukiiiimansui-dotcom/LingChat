          const rows = BLD !== 2
            ? [
                { k: "档位", v: "基准版（bld=1）", why: "这一页原来的行为，**一字不改**" },
                { k: "新形体", v: "未开", why: "URL 加 `?bld=2`（裙楼/塔楼/退台/女儿墙/设备箱）；再加 `&win=1` 开窗格" },
              ]
            : (TFb && TFb.shapeCountRows ? TFb.shapeCountRows(count) : [{ k: "统计", v: "数不出来", why: "模块里没有 shapeCountRows" }]);
          rows.push({ k: "窗格层", v: winState, why: "pattern 与 color 互斥 ⇒ 同一 source 两层；图案由纯函数现产（不引 sprite 服务器）" });
          /* 🔴 2026-09-24：真机那次"`?bld=2` 什么都没变"就是**模块被缓存成旧副本** ⇒ 这两行让下次一眼可判 */
          rows.push({
            k: "模块符号",
            v: TF_NEEDED.map(function (k) { return k + (typeof (TFb || {})[k] === "function" ? "✓" : "✗"); }).join(" "),
            why: "打叉的就是缺的 ⇒ `?bld=2` 会退化；多半是浏览器缓存了旧的 /vendor/wsScene.mjs（服务端 immutable、URL 无内容哈希）⇒ 强刷/清缓存，或让主会话重建预览包",
          });
          rows.push({ k: "vendor", v: tfState + (window.__TF_FRESH__ ? "（重取版本 " + window.__TF_FRESH__ + "）" : ""), why: "静态 import 的模块可能与页面不同版；这条是自愈记录（「缺符号」不等于「产物里没有」）" });
          /* 🔧 估算档位（**估算值，非事实**）：机主 2026-09-24 把裸 building=yes 从 12m 提到 15~18m */
          const band = TFb && TFb.UNKNOWN_KIND_BAND_M ? TFb.UNKNOWN_KIND_BAND_M : null;
          rows.push({
            k: "估算档",
            v: band ? (band[0] + "~" + band[1] + "m（building=yes / 未登记类型）") : "数不出来",
            why: "**估算值，非事实**：没有高度数据时的兜底（HUD 单列「按类型估」，绝不并进「真高」）；真高与层数两档一律优先",
          });
          if (window.__BLD_FALLBACK__) rows.push({ k: "回退", v: String(window.__BLD_FALLBACK__), why: "取不到形体生成 ⇒ 如实退回基准版（回退必须有回执）" });
          rows.push({ k: "未验", v: "真机观感", why: "本机无头无 WebGL ⇒ 这里只能回证「生成了什么、多少」；像不像真楼要机主真机刷新看" });
          const bad = BLD === 2 && (!count || winState.indexOf("失败") === 0 || tfMissing(window.__TF__).length > 0);
          head.textContent = (bad ? "⚠️ " : "") + "🏢 " + (BLD === 2 ? "bld=2 · 档位=" + tier : "bld=1（基准版）");
          head.onclick = function () { box.classList.toggle("is-open"); };
          body.innerHTML = rows.map(function (r) {
            return '<div class="artb__row"><span>·</span> ' + r.k + " = " + String(r.v) + " <i>" + r.why + "</i></div>";
          }).join("");
        } catch (e) { /* 徽标画不出来不影响页面 */ }
      }

      /* ══ 🎮 观感 `?look=2`：暗角（DOM 叠加）+ 逐项回证 ≐════════════════════════════════════
         为什么暗角走 DOM：MapLibre **没有屏幕空间后处理**（style-spec 里没有 vignette 这类字段，
         `fill-extrusion-ambient-occlusion-*` / 根级 `fog` 都是 Mapbox 的，我们的构建不认）
         ⇒ 只能叠一层 CSS 径向渐变。**这是近似，不是渲染管线里的暗角** —— 徽标里如实标。 */
      let vigEl = null;
      /** `#rrggbb` + alpha → `rgba()`（只对**主题给的颜色**做换算，不是第二套配色） */
      function hexA(hex, a) {
        const m = /^#?([0-9a-fA-F]{6})$/.exec(String(hex || ""));
        if (!m) return String(hex || "transparent"); // 认不出就原样用（不抛）
        const n = parseInt(m[1], 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + Math.max(0, Math.min(1, a)) + ")";
      }
      function applyLookVignette() {
        try {
          const v = THEME && THEME.look && THEME.look.vignette;
          if (LOOK !== 2 || !v) { if (vigEl) vigEl.style.display = "none"; return; }
          if (!vigEl) {
            vigEl = document.createElement("div");
            vigEl.id = "look-vig";
            vigEl.setAttribute("aria-hidden", "true");
            /* 只在地图之上、**不接手势**（pointer-events:none）—— 否则又把拖动吃掉了（老坑） */
            vigEl.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:2;";
            document.body.appendChild(vigEl);
          }
          const c = hexA(v.color, v.opacity);
          vigEl.style.background =
            "radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) " + v.inner + "%, " + c + " " + v.outer + "%)";
          vigEl.style.display = "block";
          window.__LOOK_VIG__ = { color: v.color, opacity: v.opacity, inner: v.inner, outer: v.outer };
        } catch (e) { /* 暗角画不出来不影响地图 */ }
      }

      /** HUD 上的一句"这一版观感是什么"（**自证**，别让人猜）。
       *  🔴 口径 = 机主 2026-09-24 返工后定的三件：**地面 Δ（不许变暗）/ cel 档数 / 暗角强度**。 */
      function lookHud() {
        if (LOOK !== 2) return "look=1（基准）";
        const m = THEME && THEME.metrics;
        const b = THEME_BASE && THEME_BASE.metrics;
        if (!m) return "look=2（无数）";
        const d = b ? (m.groundLuma - b.groundLuma) : null;
        return "look=2 地面" + (d === null ? "?" : (d >= 0 ? "+" : "") + d.toFixed(4)) +
          " · cel " + (THEME.ramp || []).length + " 档 · 描边/地 " + m.outlineGroundRatio + ":1" +
          " · 暗角 " + m.vignetteOpacity;
      }

      /**
       * 🎮 **观感回证表**：逐项读**地图上真实的** paint 值（不是读我自己的变量）与主题期望值对照。
       * 命中 ✅ / 未命中 ❌ / **跳过 ⏭**（跳过 = 如实记"没做/做不了"，不是失败）+ **对比度数值**。
       * 低于阈值的那一行**标红**（`artb__bad`）—— 机主一眼能看出"是不是又看不清了"。
       */
      function lookReadback() {
        try { return lookReadbackInner(); }
        catch (e) { return [{ id: "回证", key: "取值抛错", now: String(e).slice(0, 90), want: null, hit: false, why: "回证表本身出错 ⇒ 如实报出来（不许把页面/probe 一起弄崩）" }]; }
      }
      function lookReadbackInner() {
        if (LOOK !== 2) return null;
        const look = THEME && THEME.look;
        const rows = [];
        const J = (v) => JSON.stringify(v);
        const live = function (id, key) {
          try { return { has: !!(map && map.getLayer && map.getLayer(id)), v: map && map.getPaintProperty ? map.getPaintProperty(id, key) : null }; }
          catch (e) { return { has: false, v: "(取值抛错)" }; }
        };
        /** 一行：把"地图上的实际值"和"主题里期望的值"对上（缺图层 ⇒ `no-layer`，别当成"值不对"） */
        const row = function (id, key, want, why) {
          const g = live(id, key);
          rows.push({
            id: id, key: key, now: g.v, want: want,
            hit: !g.has ? "no-layer" : J(g.v) === J(want), why: why,
          });
        };
        /* ⚠️ 两个命名空间别混：`THEME.*` = 整套主题（ramp/outline/verticalGradient/extrudOpacity），
           `look.*` = **观感专有的**那几个结构性旋钮（shadow/vignette/road/skipped）。混了就是静默读 undefined。 */
        if (!look) {
          rows.push({ id: "look", key: "派生主题", now: "没拿到", want: "looks.game." + THEME_ID, hit: false, why: lookState });
          return rows;
        }
        /* ① 尺寸/结构：三层新图层在不在（阴影/接触阴影/暗角） */
        row("bld-shadow", "fill-color", look.shadow.color, "楼脚印的深色薄层（近似阴影；MapLibre 不投阴影）");
        row("bld-shadow", "fill-translate", [look.shadow.dx, look.shadow.dy], "影子往右下偏（太阳在左上）");
        row("bld-ao", "line-blur", look.shadow.blur, "贴边模糊线 = 接触阴影（硬边会像描边）");
        const order = (map.getStyle().layers || []).map(function (l) { return l.id; });
        const below = order.indexOf("bld-shadow") >= 0 && order.indexOf("bld-ext") >= 0 && order.indexOf("bld-shadow") < order.indexOf("bld-ext");
        rows.push({ id: "层序", key: "bld-shadow 在 bld-ext 之下", now: below ? "是" : "否（或层不在）", want: "是", hit: below, why: "影子和地面同层，必须在楼体之下" });
        rows.push({ id: "暗角", key: "DOM 叠加层", now: window.__LOOK_VIG__ ? "已画" : "未画", want: "已画", hit: !!window.__LOOK_VIG__, why: "MapLibre 无屏幕空间后处理 ⇒ CSS 径向渐变近似（不是渲染管线里的暗角）" });
        /* ② 主题层面：地面/描边/色阶/渐变 —— 全从**地图上的实时 paint** 读。
           地面/底色/底图这三条的**期望值也从主题的样式层**里取（`THEME.layers`，和喂给地图的是同一份对象）
           —— 快照里没有第二份 `tint`/`bg`/`raster` 字段可抄，也就抄不出错。 */
        const lay = function (id, key) {
          const l = (THEME.layers || []).filter(function (x) { return x.id === id; })[0];
          return l && l.paint ? l.paint[key] : undefined;
        };
        row("tint", "background-color", lay("tint", "background-color"), "地面色罩 = 派生主题的地面色（整屏近白就是这一条在治）");
        row("bg", "background-color", lay("bg", "background-color"), "底色（天空之外那圈）");
        row("base", "raster-brightness-max", lay("base", "raster-brightness-max"), "底图压暗（不压 ⇒ 地面比楼亮，楼会消失）");
        row("bld-ext", "fill-extrusion-vertical-gradient", THEME.verticalGradient, "BA 的**平涂**（机主拍板的美术方向）⇒ 渐变保持关；受光/背光改由 cel 分档表达");
        row("bld-ext", "fill-extrusion-opacity", THEME.extrudOpacity, "远景淡出**已撤回基准值**（亮底上把远景调透明 = 楼化进地面，与「底要看得清」相反）");
        row("bld-line", "line-color", THEME.outline.color, "描边 = BA 的深藏青（**没有翻成亮线** —— 那是第一版改错的，已撤）");
        const cel = (function () { const p = live("bld-ext", "fill-extrusion-color"); return p.v; })();
        const isCel = Array.isArray(cel) && cel[0] === "step";
        rows.push({
          id: "bld-ext", key: "fill-extrusion-color", now: isCel ? ("step（" + THEME.ramp.length + " 档）") : (Array.isArray(cel) ? cel[0] : cel),
          want: "step（" + THEME.ramp.length + " 档）", hit: isCel, why: "cel 分档：硬边三档（受光/中间/背光），基准版是 8 档平滑插值",
        });
        /* ③ 路网：casing/fill 加粗 + 霓虹辉光 */
        const lr = look.road;
        const rs = (map.getStyle().layers || []).map(function (l) { return l.id; }).filter(function (id) { return /^road-(casing|line|glow)-/.test(id); });
        const glowIds = rs.filter(function (id) { return id.indexOf("road-glow-") === 0; });
        const w0 = (function () { try { return map.getPaintProperty("road-casing-0", "line-width"); } catch (e) { return null; } })();
        row("road-casing-0", "line-width", (function () { const T2 = window.__TF__; return T2 && T2.roadStyleOf ? +(T2.roadStyleOf(0).w + lr.casingAdd).toFixed(2) : null; })(), "casing 与路芯一起加粗（只加一层 = 边比路粗）");
        rows.push({
          id: "霓虹辉光", key: "road-glow-*", now: glowIds.length ? (glowIds.join(",")) : "没建（road-glow-* 一个都没有）",
          want: "0 层（**已撤**）", hit: null, reverted: true,
          why: "**撤了**：亮底上白色辉光与地面**同明度** ⇒ 既看不见又把路缘糊掉（降低可读性）；" +
               "机制仍在数据里（`look.road.glow=null` = 不建层，改数据即可开），有自检守着这条数据",
        });
        /* ④ 🔴 **对比度 / 明度**（**低于阈值标红**）—— 口径按机主 2026-09-24 返工后的裁定改：
              第一版那行「楼/地 1.88 ≥ 1.35」在 BA 亮底下**本来就不成立**（BA 是 楼/地 0.877、
              描边/地 10.61:1，靠**深藏青描边**把楼勾出来）⇒ 那行是"自己给自己定的指标"，
              已删。现在的硬指标是：**派生地面明度不许低于基准**。
              数值由模块算好放进快照（`metrics`），页面**不再自己算第二遍**
              （两把尺子的老坑：`gammaLuma` 与 `relativeLuminance` 不是一回事）。 */
        const m = THEME.metrics;
        const bm = THEME_BASE && THEME_BASE.metrics;
        if (m) {
          if (bm) {
            const d = +(m.groundLuma - bm.groundLuma).toFixed(6);
            const eps = typeof m.groundEps === "number" ? m.groundEps : 0.02;
            rows.push({
              id: "地面明度", key: "派生 − 基准（🔴 不许为负）",
              now: (d >= 0 ? "+" : "") + d + "（" + m.groundHex + " " + m.groundLuma + " vs 基准 " + bm.groundHex + " " + bm.groundLuma + "）",
              want: "≥ 0 且 |Δ| ≤ " + eps, hit: d >= 0 && Math.abs(d) <= eps, red: d < 0,
              why: "**派生观感只能加结构，不许改机主拍板的美术方向** —— 地面被压暗就是这条红了（第一版 -0.563 就是这么来的）",
            });
          }
          rows.push({
            id: "对比度", key: "描边/地（WCAG）", now: m.outlineGroundRatio + ":1",
            want: "≥ 4.5:1", hit: m.outlineGroundRatio >= 4.5, red: m.outlineGroundRatio < 4.5,
            why: "非文字图形的 WCAG AA —— **BA 靠这条描边把楼从亮底上勾出来**（这才是它的分隔手段）",
          });
          if (bm) rows.push({
            id: "对比度", key: "楼/地（BA 口径，不判失败）", now: m.bldGroundRatio,
            want: null, hit: null,
            why: "BA 的地本来就比矮楼亮（基准 " + bm.bldGroundRatio + "）⇒ 这条**不是**阈值，只是如实报数（分隔靠描边）",
          });
          const celRow = rows.filter(function (r) { return r.key === "fill-extrusion-color"; })[0];
          if (celRow) celRow.why = "cel 分档：硬边三档，档位色**取自 BA 色阶**（基准版是 8 档平滑插值）";
          rows.push({
            id: "暗角", key: "强度 opacity",
            now: m.vignetteOpacity === null ? "数不出来（不是基准主题）" : m.vignetteOpacity,
            want: "0 < opacity ≤ 0.25", hit: m.vignetteOpacity !== null && m.vignetteOpacity > 0 && m.vignetteOpacity <= 0.25,
            red: m.vignetteOpacity !== null && m.vignetteOpacity > 0.25,
            why: "**弱**暗角：第一版 0.5 被机主判「底都看不清了」⇒ 现在只压边角（阈值 0.25 写死在自检里）",
          });
        } else {
          rows.push({ id: "对比度", key: "—", now: "数不出来（快照里没有 metrics）", want: null, hit: null, why: "老 /wstheme.json 没有这一块 ⇒ 重新生成即可" });
        }
        /* ⑤ ⏭ 如实跳过（**不是失败**）：没做/做不了的项，逐条列出来 */
        for (const s of look.skipped || []) rows.push({ id: "跳过", key: s.k, now: "未做", want: null, hit: null, skip: true, why: s.why });
        /* ⑥ ⏪ **如实记"做过又撤"**：撤掉必须留痕，否则下一个人还会照同一个方向再试一遍 */
        for (const r of look.reverted || []) rows.push({ id: "撤回", key: r.k, now: "已撤", want: null, hit: null, reverted: true, why: r.why });
        return rows;
      }

      /** 把观感回证画到徽标里（点击展开/收起）—— 三种标记：✅ 命中 / ❌ 未命中 / ⏭ 跳过 */
      function renderLookBadge() {
        try {
          const head = $("lookb-head");
          const body = $("lookb-body");
          const box = $("lookb");
          if (!head || !body || !box) return;
          const rows = lookReadback();
          if (!rows) {
            head.textContent = "🎮 观感 look=1（基准）";
            body.innerHTML = '<div class="artb__row">· 想看新观感：URL 加 <b>?look=2</b>（**同一套 BA 配色** + cel 三档硬边 + 接触阴影 + 路加粗 + 弱暗角）</div>' +
              '<div class="artb__row">· 与 ?bld=2、?wstheme=night 可叠加（观感属于主题，形体属于几何）</div>';
            head.onclick = function () { box.classList.toggle("is-open"); };
            return;
          }
          const hitN = rows.filter(function (r) { return r.hit === true; }).length;
          const missN = rows.filter(function (r) { return r.hit === false || r.hit === "no-layer"; }).length;
          const skipN = rows.filter(function (r) { return r.skip; }).length;
          const revN = rows.filter(function (r) { return r.reverted; }).length;
          const redN = rows.filter(function (r) { return r.red; }).length;
          head.textContent = (missN || redN ? "⚠️ " : "") + "🎮 look=2（结构留·配色回 BA） ✅" + hitN + " ❌" + missN +
            " ⏭" + skipN + " ⏪" + revN + (redN ? (" 🔴红线 " + redN + " 条") : "") +
            (lookState.indexOf("回退") === 0 ? (" · " + lookState) : "");
          head.onclick = function () { box.classList.toggle("is-open"); };
          body.innerHTML = rows.map(function (r) {
            const mark = r.reverted ? '<span class="artb__skip">⏪</span>'
              : r.skip ? '<span class="artb__skip">⏭</span>'
                : r.hit === true ? '<span class="artb__ok">✅</span>'
                  : (r.hit === false || r.hit === "no-layer") ? '<span class="artb__bad">❌</span>' : '<span>·</span>';
            return "<div class=\"artb__row\"" + (r.red ? ' style="color:#ff7b72"' : "") + ">" + mark + " " + r.id + "." + r.key +
              " = " + String(r.now) +
              (r.hit === false || r.hit === "no-layer" ? (" 期望 " + String(r.want)) : "") +
              " <i>" + r.why + "</i></div>";
          }).join("");
        } catch (e) { /* 徽标画不出来不影响页面 */ }
      }


      /**
       * 🔴 侧视角（近地平线）**倍率爆炸**的护栏（机主 2026-09-21：「一下划不见」）。
       *
       * 根因：pitch 越大，地面与视线越接近平行 ⇒ 同样的手指位移对应**巨大的地面距离**。
       * 做法：① **`maxPitch` 85 → 70**（能给天空，但到不了"只剩一条线"）；
       *      ② pitch > 55 之后**按比例降拖动速度**（`dragPan.enable({maxSpeed})`，MapLibre 的公开口子）；
       *      ③ HUD 显示当前 pitch 与阻尼系数（**自证**：机主能看出护栏在不在工作）。
       * ⚠️ 触屏的"捏合缩放"没有 rate 口子（`touchZoomRotate` 不暴露）⇒ 那一项**没做**，如实记。
       */
      const PITCH_SOFT = 55;
      function panDamping(pitch) {
        return pitch <= PITCH_SOFT ? 1 : 1 / (1 + (pitch - PITCH_SOFT) / 25);
      }
      function applyPitchGuard() {
        try {
          const p = map && map.getPitch ? map.getPitch() : 0;
          const k = panDamping(p);
          if (map && map.dragPan && map.dragPan.enable) {
            map.dragPan.enable({ maxSpeed: Math.round(1400 * k) });
          }
          if (map && map.scrollZoom && map.scrollZoom.setWheelZoomRate) {
            map.scrollZoom.setWheelZoomRate((1 / 450) * k);
          }
          const el = document.getElementById("m-msg");
          if (el && ART === 2) el.textContent = "pitch=" + Math.round(p) + "° 拖动阻尼×" + k.toFixed(2);
        } catch (e) { /* 护栏失败不影响地图 */ }
      }

      /* ══ ☁️ art=3：云带 + 远景山影 + 雾带（**独立 canvas 叠加层，不碰 style 白名单**）══════
         几何来自纯函数 `wsArtSky.buildSkyGeometry()`（确定性 ⇒ 拖动不会乱跳）；
         低档（`?low=1` / `__PERF_LOW__`）与 art<3 时**整块不画**。 */
      let skyCv = null, skyCtx = null;
      function ensureSkyCanvas() {
        if (skyCv) return skyCv;
        skyCv = document.createElement("canvas");
        skyCv.className = "ws-sky";
        skyCv.setAttribute("aria-hidden", "true");
        /* 只在地图上、**不接手势**（否则又把拖动吃掉了） */
        skyCv.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:1;";
        document.body.appendChild(skyCv);
        skyCtx = skyCv.getContext("2d");
        return skyCv;
      }
      function drawSky() {
        const TF2 = window.__TF__;
        if (!TF2 || !TF2.buildSkyGeometry) return;
        const low = !!(window.__PERF_LOW__ || /[?&]low=1\b/.test(location.search));
        if (ART < 3 || low) { if (skyCv) skyCv.style.display = "none"; return; }
        const cv = ensureSkyCanvas();
        const w = window.innerWidth, h = window.innerHeight;
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        cv.style.display = "block";
        const g = skyCtx;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);
        const pitch = map.getPitch ? map.getPitch() : 38;
        const zoom = map.getZoom ? map.getZoom() : 16;
        const horizonY = TF2.horizonYOf(h, pitch);
        const geo = TF2.buildSkyGeometry(w, h, horizonY, pitch, zoom, false);
        /* ① 远景山影（远→近；越近越实） */
        for (const r of geo.ridges) {
          g.beginPath();
          r.pts.forEach(function (pt, i) { i ? g.lineTo(pt[0], pt[1]) : g.moveTo(pt[0], pt[1]); });
          g.closePath();
          g.fillStyle = "rgba(150,190,215," + r.alpha.toFixed(3) + ")";
          g.fill();
        }
        /* ② 地平线雾带（渐变，**只在地平线上下一条**） */
        const fy = geo.fog.y;
        const grd = g.createLinearGradient(0, fy - geo.fog.h, 0, fy + geo.fog.h * 0.5);
        grd.addColorStop(0, "rgba(255,255,255,0)");
        grd.addColorStop(0.55, "rgba(255,255,255," + geo.fog.alpha + ")");
        grd.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = grd;
        g.fillRect(0, fy - geo.fog.h, w, geo.fog.h * 1.5);
        /* ③ 云（软边白椭圆；**只在地平线以上**，低 alpha ⇒ 不遮地图） */
        g.save();
        for (const c of geo.clouds) {
          const rg = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, Math.max(c.rx, c.ry));
          rg.addColorStop(0, "rgba(255,255,255," + c.a.toFixed(3) + ")");
          rg.addColorStop(0.6, "rgba(255,255,255," + (c.a * 0.55).toFixed(3) + ")");
          rg.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = rg;
          g.beginPath();
          g.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
          g.fill();
        }
        g.restore();
        window.__SKY_GEO__ = { clouds: geo.clouds.length, ridges: geo.ridges.length, horizonY: geo.fog.y };
      }

      function hasWebGL() {
        try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
        catch { return false; }
      }

      /** 视野 → 取楼半径：**按屏幕真正看得见的范围**要数据，而不是拍脑袋跟 zoom 挂钩。
       *  为什么：zoom 15.2 在手机横屏上其实能看到 4km 宽，"取 400m"必然大半屏是空的
       *  —— 这正是 HUD 常显示"🏢 0"的成因之一。 */
      function radiusForView() {
        const b = map.getBounds();
        const c = map.getCenter();
        const dLng = Math.abs(b.getEast() - b.getWest()) / 2;
        const dLat = Math.abs(b.getNorth() - b.getSouth()) / 2;
        const mx = dLng * 111320 * Math.cos((c.lat * Math.PI) / 180);
        const my = dLat * 110540;
        /* 起点半径按视野算，**上限放到 2000**：稀疏地段（涪陵）只有放大半径才取得到楼，
           而密集地段（渝中）在第一级就够 25 栋停下了，走不到上限 ⇒ 只帮稀疏区。 */
        return Math.max(350, Math.min(2000, Math.round(Math.hypot(mx, my) * 0.95 / 50) * 50));
      }

      async function fetchBuildings(r) {
        const c = map.getCenter();
        const url = `${API}/api/buildings?lat=${c.lat.toFixed(5)}&lng=${c.lng.toFixed(5)}&r=${r}`;
        const res = await fetch(url);
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || "ok=false");
        return body.geojson;
      }

      /** 取楼：数据太少就**自动放大**再取，命中即停（涪陵那种地方 400m 是 0 栋，不放大学不到东西）。
       *  ⚠️ 上限 2000m（2026-09-20 从 1200 放宽）：实测涪陵驻地 1000m→21 栋、1400m→29 栋，
       *     再大（2500m）会整条查询失败；而密集区（渝中）**早就在第一级就够 25 栋停下**，
       *     根本走不到这一级 ⇒ 放宽上限是**只帮稀疏区、不伤密集区**的改法。 */
      const R_MAX = 2000;
      async function loadForView() {
        const r0 = radiusForView();
        const ladder = [r0];
        while (ladder[ladder.length - 1] < R_MAX) ladder.push(Math.min(R_MAX, ladder[ladder.length - 1] * 2));
        let best = { fc: { features: [] }, r: 0 };
        for (const r of ladder) {
          $("m-msg").textContent = `取楼中… ${r}m`;
          try {
            const fc = await fetchBuildings(r);
            if ((fc.features || []).length > (best.fc.features || []).length) best = { fc, r };
            if ((fc.features || []).length >= 25) break; // 够看了，别再花时间
          } catch { /* 这一级失败就试下一级，不因为一次失败放弃整屏 */ }
        }
        return best;
      }

      /**
       * 等**楼真的到齐**再按快门。
       *
       * 🔴 2026-09-20 机主那三张真机图就是这么废掉的：底图、路名、江面都在，
       * **一栋楼都没有** —— 因为快门在开图约 4 秒后就按了，
       * 而 `/api/buildings` 是**现问 Overpass**的（冷查询二十几秒起，最慢见过 91.7s）。
       * ⇒ 拍出来的永远是"楼还没到"的那一帧，而这个现象**看起来像"这一带没有楼"**，
       *   会把"还没到"误判成"没有数据"，白跑一轮。
       */
      function waitForBuildings(maxMs) {
        return new Promise((res) => {
          const t0 = Date.now();
          const iv = setInterval(() => {
            const waited = Math.round((Date.now() - t0) / 1000);
            $("m-msg").textContent = `等楼栋到齐… 已等 ${waited}s（现在 ${stats.n} 栋 / ${stats.r}m）`;
            if (stats.n > 0 || Date.now() - t0 > maxMs) {
              clearInterval(iv);
              res(stats.n);
            }
          }, 500);
        });
      }

      async function applyBuildings(fc, r) {
        /* 🏢 `?bld=2`：形体（裙楼/塔楼/退台/女儿墙/设备箱/天线）由**纯函数**生成 ——
           同一份代码将来 App 侧也要用，页面这边**只调用、不重写**。
           取不到就**如实回退**到基准版（回退没有回执 = 静默失效，这项目反复踩过）。
           ⚠️ 先 `await ensureVendor()`：2026-09-24 真机那次就是**模块被浏览器缓存成旧副本** ⇒
           缺符号 ⇒ 静默退回基准版（画面"什么都没变"）。现在会带版本号重取一次。 */
        let feats = null;
        let bldCount = null;
        let bldWhy = "";
        if (BLD === 2) {
          const TFb = await ensureVendor();
          if (TFb && typeof TFb.decorateBuildings === "function") {
            try {
              const dec = TFb.decorateBuildings(fc, artRamp((THEME && THEME.ramp) || FALLBACK_RAMP), { mode: "detail", low: BLD_LOW });
              feats = dec.features;
              bldCount = dec.count;
            } catch (e) {
              bldWhy = "形体生成抛错：" + String(e).slice(0, 60);
            }
          } else {
            bldWhy = "数不出来：模块里没有 decorateBuildings（" + tfState + "）—— 若产物里明明有，多半是**浏览器缓存了旧的 /vendor/wsScene.mjs**（服务端 immutable、URL 无内容哈希）：强刷/清缓存，或让主会话重建预览包";
          }
        }
        if (!feats) feats = (fc.features || []).map((f) => {
          const [h, src] = renderHeight(f.properties || {});
          return { ...f, properties: { ...f.properties, h3d: h, h_from: src } };
        });
        window.__BLD_COUNT__ = bldCount || null;
        window.__BLD_FALLBACK__ = bldWhy || null;
        window.__LASTFC__ = fc; // 🚌 `?tf=1` 要用楼栋轮廓（停车场/出入口按脚印算）
        /* ⚠️ `stats.n` **永远是楼栋数**（拆件之后要素会变多，HUD 的「N 栋」不能变成要素数） */
        stats.n = bldCount ? bldCount.n : feats.length;
        stats.parts = feats.length;
        stats.r = r;
        stats.real = bldCount ? bldCount.real : feats.filter((f) => f.properties.h_from === "real").length;
        stats.levels = bldCount ? bldCount.levels : feats.filter((f) => f.properties.h_from === "levels").length;
        stats.kind = bldCount ? bldCount.kind : feats.filter((f) => f.properties.h_from === "kind").length;
        $("m-n").textContent = String(stats.n);
        $("m-h").textContent = String(stats.real);
        $("m-l").textContent = String(stats.levels);
        $("m-e").textContent = String(stats.kind);
        $("m-r").textContent = String(r);
        $("m-msg").textContent = stats.n ? "" : "这一带 OSM 没登记楼房";
        const data = { type: "FeatureCollection", features: feats };
        fcCache = data;
        if (map.getSource("bld")) map.getSource("bld").setData(data);
        else { map.addSource("bld", { type: "geojson", data }); addBldLayers(); }
        renderBldBadge(); // 🏢 回证（各细节生成了多少 + 档位）随每次取楼刷新
      }

      /**
       * 🏢 现产窗格贴图（`?win=1`）。**不引 sprite 服务器**：图案是纯函数产出的 32×32 RGBA，
       * 直接交给 `map.addImage()`（本构建接受 `{width,height,data}`）。
       * 失败 ⇒ 关掉窗格层并把原因写进 `winState`（**绝不让"没开成"看起来像"开了"**）。
       */
      function ensureWinImage() {
        try {
          const TFb = window.__TF__;
          if (!TFb || typeof TFb.windowPatternSpec !== "function") throw new Error("模块里没有 windowPatternSpec");
          const ramp = artRamp((THEME && THEME.ramp) || FALLBACK_RAMP);
          /* 配色**从主题色阶派生**（不写第二套配色）：墙面取高段色，窗格 = 墙面压暗 18% */
          const wall = TFb.rampColorOf ? TFb.rampColorOf(60, ramp) : "#F2FAFF";
          const pane = TFb.shade ? TFb.shade(wall, 0.82) : "#C9DDEA";
          const spec = TFb.windowPatternSpec(wall, pane);
          if (!map.hasImage(WIN_IMAGE_ID)) map.addImage(WIN_IMAGE_ID, { width: spec.size, height: spec.size, data: new Uint8Array(spec.data) });
          winState = "已开（墙 " + wall + " / 窗 " + pane + " · " + spec.size + "×" + spec.size + "）";
        } catch (e) {
          winState = "失败：" + String(e).slice(0, 60);
          WINS = false; // 建不了图就不开那层（否则 win=1 的那半边楼会两层都不画 ⇒ 楼缺一块）
        }
      }

      /** 窗格层没加成 ⇒ 把色彩层的 filter 去掉（不然 `win=1` 的墙面两边都不画） */
      function healColorLayer(before) {
        try {
          if (map.getLayer("bld-ext")) map.removeLayer("bld-ext");
          const c = bldLayerSpecs().filter((l) => l.id === "bld-ext")[0];
          if (c && !map.getLayer("bld-ext")) map.addLayer(c, before);
        } catch (e) { errs.push("healColorLayer " + e); }
      }

      function addBldLayers() {
        /* 插在注记层之前 ⇒ 街名压在楼上面 */
        const before = map.getLayer("ref") ? "ref" : undefined;
        if (WINS) ensureWinImage(); // 图必须在 addLayer 之前进 images
        for (const l of bldLayerSpecs()) {
          if (map.getLayer(l.id)) continue;
          try { map.addLayer(l, before); }
          catch (e) {
            errs.push("addLayer " + l.id + " " + e);
            if (l.id === "bld-win") { winState = "失败：" + String(e).slice(0, 50); WINS = false; healColorLayer(before); }
          }
        }
      }

      void (async () => {
        try { const mod = await import(/* @vite-ignore */ "/vendor/maplibre/maplibre-gl.mjs"); maplibregl = mod?.default || mod; }
        catch (e) { errs.push("模块加载失败 " + e); return fail("地图库加载失败"); }
        if (!maplibregl?.Map) return fail("地图库形状不对");
        if (!hasWebGL()) return fail("这台设备没有 WebGL");
        /* 主题必须在**建图之前**拿到 —— style 是一次性传进去的（换主题要重建 sources/layers） */
        await loadTheme();

        map = new maplibregl.Map({
          container: "map", style: makeStyle(),
          center: [SPOT.lng, SPOT.lat],
          /* 🎨 2026-09-20 机主要"**看得见天空（基沃托斯的天空）**"：
             58° 是俯视看楼的角度，天际线以上全在画面外 ⇒ 降到 38° 把地平线和天空收进来。
             `maxPitch: 85` 必须显式写：MapLibre 默认上限只有 **60°**，不放开就抬不起头。 */
          /* 🎬 相机默认值取自**公共模块** `wsScene.cameraDefaults()`（唯一真源；页面不许再写字面量）。
             模块还没加载（module 是 defer）时用同一份数值兜底 —— 但那样 `__SCENE_SRC__` 会标成"页面自带"。 */
          ...(() => {
            const cam = (window.__TF__ && window.__TF__.cameraDefaults) ? window.__TF__.cameraDefaults() : null;
            window.__SCENE_CONSUMED__ = !!cam;      // 相机取自公共模块
          window.__SCENE_LAYER_CONSUMED__ = false; // 层序换用时由 planBefore() 置真
            const c = cam || { zoom: 16.4, pitch: 38, bearing: -18, maxPitch: 70, minZoom: 3, maxZoom: 19 };
            return { zoom: c.zoom, pitch: c.pitch, bearing: c.bearing, maxPitch: c.maxPitch, minZoom: c.minZoom, maxZoom: c.maxZoom };
          })(),
          attributionControl: false, fadeDuration: 120,
          preserveDrawingBuffer: true, // 截图用（无头/代拍都要它）
        });
        window.__w3d = { ok: true, map, stats, probe: () => probe(), spot: SPOT };
        map.on("error", (e) => {
          /* 🛰 预渲染瓦片的加载失败**单独计数**（HUD 的回证要它），同时保留一条到 errs（可见性优先）。
             ⚠️ 读 vendored 源码确认：**404 不抛 error 事件**（TileManager `_loadTile` 里 404 只 update）
             ⇒ 真缺图靠清单对拍（`lodTileVerdict` 的 `absent`），不指望这里。 */
          try {
            if (LOD_ON && e && e.sourceId === (lodPlanCache && lodPlanCache.sourceId)) {
              const k = (window.__TF__ && window.__TF__.lodEventTileKey) ? window.__TF__.lodEventTileKey(e) : null;
              if (k) lodFailedKeys.add(k); else lodNoKey++;
              scheduleLodHud();
              return; // 瓦片级失败不进 errs（否则一屏缺图会把 errs 淹掉）
            }
          } catch (err) { /* 计数失败不该影响地图 */ }
          errs.push(String(e?.error?.message || e));
        });
        /* 🛰 瓦片陆续到达 ⇒ 计数 + 刷新回证（节流 250ms）。
           ⚠️ 判据是"**有没有坐标**"（`tile` 或 `coord` 任一），不是"有没有 tile" ——
           读 vendored 源码：瓦片事件带 `{tile, coord}` 两个，但换个形状（将来升级/别的构建）
           可能只带一个；两种都认，就少一处"静默不计数"（那会让命中数永远是 0 = 误报）。 */
        map.on("sourcedata", (e) => {
          if (!LOD_ON) return;
          try {
            const plan = lodPlanCache;
            if (!plan || !e || e.sourceId !== plan.sourceId || (!e.tile && !e.coord)) return;
            const k = (window.__TF__ && window.__TF__.lodEventTileKey) ? window.__TF__.lodEventTileKey(e) : null;
            if (k) lodLoadedKeys.add(k); else lodNoKey++;
            scheduleLodHud();
          } catch (err) { /* 忽略 */ }
        });

        let busy = false;
        map.on("load", async () => {
          await refresh();
          /* 🎨 回证表要在**楼体图层加完之后**读（`bld-line` 是 addLayer 加的）⇒ 放在 refresh 之后 */
          renderArtBadge();
          /* 🏢 形体回证（`?bld=2` 时最有信息量；bld=1 时如实写"未开"） */
          renderBldBadge();
          /* 🛣 路网先画（**在最下**），交通设施后画（**贴在路之上**） */
          if (ROADSON) { try { await applyRoads(); } catch (e) { errs.push("applyRoads " + e); } }
          /* 🎮 观感回证放在**路网之后**（`road-casing-*` 是 applyRoads 建的，早了读不到它）：
             暗角叠加 + 逐项回证（含对比度数值，低于阈值标红） */
          applyLookVignette();
          renderLookBadge();
          /* 🚌 `?tf=1`：楼到齐之后再摆交通设施（要用到楼栋轮廓） */
          if (TFON) { try { await applyTransport(window.__LASTFC__ || { features: [] }); } catch (e) { errs.push("transport " + e); } }
          /* 🔴 顺序**以事后断言为准**（机主真机回归：?tf=1 时路网不见了 ⇒ 不靠"先插的那一次"） */
          ensureRoadOrder();
          window.__ROAD_HEALS__ = roadHeals;
          /* 🛰 LOD：预渲染层**最后插**（要在楼体/路网之上、注记之下 ⇒ 此刻矢量层都已就位）。
             没开 `?lod` 时它只写一行 HUD 文案，**一个源/图层都不建**（默认观感逐字节不变）。 */
          try { await applyLod(); } catch (e) { errs.push("applyLod " + e); }
          /* ☁️ 天空叠加放在最后（它在最上层，但低 alpha 且只在地平线以上） */
          try { drawSky(); } catch (e) { errs.push("sky " + e); }
          window.__w3d.ready = true;
        });
        map.on("moveend", () => { if (window.__w3d.ready) void refresh(); });
        /* 🛰 LOD 回证随视野更新（换档 / 换瓦片 ⇒ HUD 那一行与徽标要跟着变） */
        map.on("moveend", () => { try { scheduleLodHud(); } catch (e) { /* 忽略 */ } });
        /* ☁️ art=3：天空叠加重画（moveend 时重画一次即可 —— 几何是确定性的，不会抖） */
        map.on("moveend", () => { try { drawSky(); } catch (e) { errs.push("sky " + e); } });
        map.on("pitch", () => { try { drawSky(); } catch (e) { errs.push("sky " + e); } });
        /* 🔴 侧视角护栏：pitch 一变就重算阻尼（拖动速度/滚轮速率），并刷新 HUD 上的自证数字 */
        try {
          map.on("pitch", applyPitchGuard);
          applyPitchGuard();
          applyPitchGuard(); // 再调一次：第一次可能在样式就绪前（`dragPan` 还没挂）
        } catch (e) { errs.push("pitchGuard " + e); }

        async function refresh() {
          if (busy) return; busy = true;
          const z = map.getZoom();
          $("m-z").textContent = z.toFixed(1);
          try {
            if (z < 12.5) { $("m-msg").textContent = "太远了不取楼（放大到街区）"; }
            else { const { fc, r } = await loadForView(); await applyBuildings(fc, r); }
          } catch (e) { errs.push("buildings " + e); $("m-msg").textContent = "取楼失败：" + String(e).slice(0, 40); }
          busy = false;
        }

        /* FPS（滚动 1 秒窗口，与项目其它地方同口径） */
        let last = performance.now(), frames = 0, win = 0;
        (function tick(now) {
          const dt = now - last; last = now; frames++; win += dt;
          if (win >= 1000) { $("m-fps").textContent = String(Math.round((frames * 1000) / win)); frames = 0; win = 0; }
          requestAnimationFrame(tick);
        })(performance.now());

        /* 两个档位就是"一近一远"两张证据图的机位 */
        $("b-near").onclick = () => { map.easeTo({ zoom: 17.4, pitch: 50, duration: 600 }); };
        /* 「远」= 看天空/地平线的机位（和代拍第二张同角度，手点/代拍可比对）。
           🛰 `?lod=1` 时**再退一档到预渲染区**（`LOD_FAR_ZOOM - 1`）—— 否则这一页根本看不到远处那条路
           （原来的 14.6 已经进了"实时矢量"区）。阈值取自 `wsScene`，页面不写字面量。 */
        $("b-far").onclick = () => {
          const TFx = window.__TF__;
          const z = LOD_ON && TFx && TFx.lodPlan ? TFx.lodPlan().far - 1 : 14.6;
          map.easeTo({ zoom: z, pitch: 26, duration: 600 });
          if (LOD_ON) { try { $("b-far").title = "远景（预渲染瓦片区 z" + z + "）"; } catch (e) { /* 忽略 */ } }
        };
        $("b-spin").onclick = () => { map.easeTo({ bearing: map.getBearing() - 45, duration: 600 }); };
        /* 「星」：z16 以上到底用卫星影像还是把暗色底放大。
           留这个按钮是因为"哪个更好看"**只能看真机图**决定 ——
           而卫星是白天的亮照片，压暗过头会太黑、压不够会比楼还亮（楼就"消失"了）。 */
        let satOn = true;
        /* 🛰 「星」按钮只管**卫星高分层**。⚠️ 二次元主题**根本没有 hi 层**
           （卫星=写实，与平涂冲突，见 `wsMapTheme.ts`）⇒ 这个按钮在二次元下应当
           **如实禁用**，而不是"点了没反应"（点了没反应最容易被当成 bug 反复点）。 */
        const hasHi = !!map.getLayer("hi");
        /* 🏢 开局就把 vendor 体检一次（`?bld=2` 时会重取；bld=1 时只记账）⇒ 徽标第一帧就是真话 */
        void ensureVendor().then(function () { try { renderBldBadge(); } catch (e) { /* 徽标失败不影响地图 */ } });
        const applySat = () => {
          try { map.setLayoutProperty("hi", "visibility", satOn ? "visible" : "none"); } catch { /* 图层还没建好 */ }
          const b = $("b-sat");
          if (b) {
            b.classList.toggle("on", satOn && hasHi);
            b.disabled = !hasHi;
            b.title = hasHi
              ? "切换 z16 以上的底：卫星影像 / 暗色底放大"
              : "二次元主题没有卫星层（卫星=写实，和「平涂」冲突）";
          }
        };
        $("b-sat").onclick = () => { satOn = !satOn; applySat(); };
        applySat();

        /* ── 代拍：`?autoshot=1` 时页面**自己**拍三张回传 ────────────────────────
           为什么由页面拍：agent 侧看不到 WebGL，机主又禁了 ADB 截屏（会看到整屏隐私）。
           收图服务：`~/chk/shotd.py`（127.0.0.1:8789），落盘 `~/chk/live/*.png`。
           三张 = 一近（看楼体）/ 一远（看整片）/ 一侧（看高低起伏）。

           🔴 2026-09-19：这一版加了**空白自检**。上一版拍了三张**纯白**图回去
           （实际是 alpha=0 全透明：样式校验失败 ⇒ `load` 从没触发 ⇒ 一帧都没画，
           而 `toDataURL` 和 POST **全部成功**）。⇒ 空白必须自己判出来，并回传**诊断图**。 */
        async function settle() {
          await new Promise((res) => {
            let d = false;
            const fin = () => { if (!d) { d = true; res(); } };
            try { map.once("idle", fin); } catch { /* 没有 idle 就直接走 */ }
            setTimeout(fin, 5000);
          });
          // WebGL 双缓冲：只等 idle 可能拿到还没提交的那一帧 ⇒ 再等两帧 rAF
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
          await new Promise((r) => setTimeout(r, 700));
        }

        /** 画布空白判定（缩到 8×8 采样：全透明 / 近乎单色 = 没内容） */
        function blankReason(cv) {
          const s = 8, t = document.createElement("canvas");
          t.width = s; t.height = s;
          const g = t.getContext("2d");
          if (!g) return null;
          g.drawImage(cv, 0, 0, s, s);
          const d = g.getImageData(0, 0, s, s).data;
          let mn = 255, mx = 0, aMax = 0;
          for (let i = 0; i < d.length; i += 4) {
            aMax = Math.max(aMax, d[i + 3]);;
            for (let k = 0; k < 3; k++) { mn = Math.min(mn, d[i + k]); mx = Math.max(mx, d[i + k]); }
          }
          if (aMax === 0) return "整张画布 alpha=0（一帧都没渲染过）";
          if (mx - mn < 4) return `近乎单色（RGB 极差 ${mx - mn}，最大 alpha ${aMax}）⇒ 疑似空白/纯色`;
          return null;
        }

        /** 空白时把状态画成一张图回传 —— 让 agent 一眼看出卡在哪一步 */
        function diagPng(lines) {
          const w = 900, h = Math.max(200, 46 + lines.length * 30);
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const g = c.getContext("2d");
          g.fillStyle = "#0b1017"; g.fillRect(0, 0, w, h);
          g.fillStyle = "#79d9ff"; g.font = "bold 22px monospace";
          g.fillText("代拍空白 · 诊断", 18, 34);
          g.font = "17px monospace";
          lines.forEach((s, i) => { g.fillStyle = i === 0 ? "#ffcf8a" : "#eaf6ff"; g.fillText(String(s).slice(0, 78), 18, 68 + i * 30); });
          return c.toDataURL("image/png");
        }

        /**
         * 在**渲染完成的那一刻**抓帧。
         * 为什么：Android 上 WebGL 画布在 `idle` + 两帧 rAF + 700ms 之后，缓冲区
         * 往往已经被清空/未提交 ⇒ `toDataURL` 拿到全透明（而尺寸完全正常，极难发现）。
         * 做法：先 `triggerRepaint()`，然后在 `render` 回调里**立刻**抓；连抓两帧取"非空"的那张。
         */
        function captureOnRender() {
          return new Promise((res) => {
            let done = false;
            const fin = (v) => { if (!done) { done = true; try { map.off("render", onR); } catch { /* 忽略 */ } res(v); } };
            const onR = () => {
              try {
                const url = map.getCanvas().toDataURL("image/png");
                fin(url);
              } catch (e) { fin(null); }
            };
            try { map.on("render", onR); } catch { /* 没有 render 就直接退 */ }
            try { map.triggerRepaint(); } catch { /* 忽略 */ }
            setTimeout(() => fin(null), 5000);
          });
        }

        /**
         * 对**抓到的这张 PNG 本身**判空白（解码回来缩到 8×8 采样）。
         *
         * 为什么不用 `blankReason(canvas)` 那一版：它采样的是**活的画布**，
         * 而"画布上有内容"和"`toDataURL` 导出的是什么"**可能不是同一帧** ——
         * 机主 2026-09-20 那次就是活画布看着正常、导出的 PNG 全透明，自检漏判、
         * 三张白图照发。判据要落在**真正要发出去的那串字节**上。
         *
         * 覆盖三种空白：全透明（alpha=0）／不透明纯色／近乎单色。
         */
        function blankOfPng(dataUrl) {
          return new Promise((res) => {
            if (!dataUrl || !dataUrl.startsWith("data:image/png")) return res("抓帧失败（没拿到 PNG）");
            const img = new Image();
            img.onerror = () => res("抓到的数据不是能解码的 PNG");
            img.onload = () => {
              try {
                const s = 8, t = document.createElement("canvas");
                t.width = s; t.height = s;
                const g = t.getContext("2d");
                if (!g) return res(null);
                g.drawImage(img, 0, 0, s, s);
                const d = g.getImageData(0, 0, s, s).data;
                let mn = 255, mx = 0, aMax = 0, aMin = 255;
                for (let i = 0; i < d.length; i += 4) {
                  aMax = Math.max(aMax, d[i + 3]); aMin = Math.min(aMin, d[i + 3]);
                  for (let k = 0; k < 3; k++) { mn = Math.min(mn, d[i + k]); mx = Math.max(mx, d[i + k]); }
                }
                if (aMax === 0) return res("整张 alpha=0（一帧都没渲染过）");
                if (mx - mn < 4 && aMax - aMin < 4) {
                  const hex = "#" + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
                  return res(`近乎单色 ${hex}（RGB 极差 ${mx - mn}，alpha ${aMin}~${aMax}）`);
                }
                return res(null);
              } catch (e) {
                return res(`解码/采样失败：${e?.name || e}`);
              }
            };
            img.src = dataUrl;
          });
        }

        async function post(dataUrl, name) {
          const blob = await (await fetch(dataUrl)).blob();
          const r = await fetch(`http://127.0.0.1:8789/shot?name=${encodeURIComponent(name)}`, {
            method: "POST", headers: { "content-type": "image/png" }, body: blob,
          });
          return r.ok;
        }

        async function autoshot() {
          const snap = async (name) => {
            const cv = map.getCanvas();
            /* ① **先抓帧**：在 `render` 的那一刻抓 —— Android 上 `idle`+两帧 rAF 之后
               WebGL 缓冲区常常已经被清空/未提交，那时再 `toDataURL` 只会拿到全透明。
               抓不到就退回直接 `toDataURL`（两条都失败 ⇒ 交给你下面当空白处理）。 */
            let shot = await captureOnRender();
            if (!shot) {
              try { shot = cv.toDataURL("image/png"); } catch { shot = ""; }
            }
            /* ② **拿抓到的这张图本身**判空白 —— 不是去采样"活的画布"。
               为什么（2026-09-20 机主那次白拍的教训）：活画布和 `toDataURL` 的结果
               **可能不是同一帧** ⇒ 采样活画布说"有内容"、导出来却是全透明，自检直接漏判。 */
            const why = await blankOfPng(shot);
            if (why) {
              /* 绝**不**把空白当成功 —— 回传诊断图，让 agent 知道卡在哪、**是哪一版代码在跑** */
              await post(diagPng([
                `构建=${BUILD} 空白=${why}`,
                `样式已加载=${map.isStyleLoaded()} 地图loaded=${map.loaded()}`,
                `画布=${cv.width}x${cv.height} zoom=${map.getZoom().toFixed(2)} pitch=${Math.round(map.getPitch())}`,
                `图层=${(map.getStyle()?.layers || []).map((l) => l.id).join(",") || "(空!)"}`,
                `取楼=${stats.n} 栋 半径=${stats.r}m errs=${errs.slice(0, 1).join("") || "无"}`,
              ]), name + "-DIAG");
              $("m-msg").textContent = `代拍空白：${why}（已回传诊断图）`;
              return false;
            }
            const ok = await post(shot, name);
            $("m-msg").textContent = `代拍 ${name}：${ok ? "已回传" : "HTTP 失败"}`;
            return ok;
          };
          /* 🔴 **等楼到齐再按快门**（见 `waitForBuildings` 的说明）：
             以前 4 秒后就拍，而 Overpass 冷查询二十几秒 ⇒ 三张图全是"楼还没到"，
             看起来像"这一带没有楼"，白跑一轮。等不到（>100s）也照拍，
             但诊断/HUD 里会写明"0 栋"，不会假装成功。 */
          const n0 = await waitForBuildings(100000);
          $("m-msg").textContent = n0 > 0 ? `楼已到齐：${n0} 栋（${stats.r}m）⇒ 开始拍` : "等了 100s 仍是 0 栋 ⇒ 照拍（如实记录）";
          await settle();
          let ok = await snap("show-near");
          map.easeTo({ zoom: 15.0, pitch: 48, duration: 900 }); await settle();
          ok = (await snap("show-far")) || ok;
          map.easeTo({ zoom: 17.0, pitch: 62, bearing: -38, duration: 900 }); await settle();
          ok = (await snap("show-side")) || ok;
          /* 🔎 **同机位再拍一张"不用卫星"的**：机主 2026-09-20 的抱怨是"放大后糊+灰"，
             而"卫星压暗 vs 暗色底放大"哪个更好看**只能看图判断**。
             多拍这一张，机主点一次就能拿到 A/B 对比，不用来回两轮。 */
          map.easeTo({ zoom: 17.0, pitch: 62, bearing: -38, duration: 0 });
          satOn = false; applySat();
          await settle();
          ok = (await snap("show-side-nosat")) || ok;
          satOn = true; applySat();
          $("m-msg").textContent = ok ? "代拍完成：4 张已回传 ~/chk/live/" : $("m-msg").textContent;
          try { localStorage.removeItem("wsm:v1:autoshot"); } catch {}
        }
        try {
          if (/[?&]autoshot=1\b/.test(location.search)) localStorage.setItem("wsm:v1:autoshot", String(Date.now()));
          if (localStorage.getItem("wsm:v1:autoshot")) void autoshot();
        } catch { /* 隐私模式读不到 localStorage 就不代拍，页面照常用 */ }
      })();

      function probe() {
        const ls = (map?.getStyle()?.layers || []).map((l) => l.id);
        return {
          ok: !!map, zoom: +(map?.getZoom() || 0).toFixed(2), pitch: Math.round(map?.getPitch() || 0),
          center: [+(map?.getCenter().lng || 0).toFixed(4), +(map?.getCenter().lat || 0).toFixed(4)],
          layers: ls, ...stats, fps: Number($("m-fps").textContent) || null,
          /* 🎨 art 变体自证：档位 + 回证表（"改了到底生效没有"由它回答） */
          art: ART, artPatch: window.__ART_CHANGED__, artReadback: artReadback(),
          /* 🏢 形体自证（`?bld=2`）：档位 + 各细节计数 + 窗格层状态 + 回退原因。
             `count: null` ⇒ 判词是"数不出来"，**不是 0**（三态纪律）。 */
          bld: {
            mode: BLD, tier: BLD_LOW ? "low" : "normal", winOn: WINS, win: winState,
            count: window.__BLD_COUNT__ || null,
            line: (window.__TF__ && window.__TF__.shapeCountsLine ? window.__TF__.shapeCountsLine(window.__BLD_COUNT__ || null) : null),
            fallback: window.__BLD_FALLBACK__ || null,
            parts: stats.parts,
            layers: (map.getStyle().layers || []).filter(function (l) { return /^bld-/.test(l.id); }).map(function (l) { return l.id; }),
            hasWinImage: (function () { try { return !!map.hasImage(WIN_IMAGE_ID); } catch (e) { return null; } })(),
            /* 🔴 2026-09-24：模块是否"旧副本"及其自愈结果（真机那次 `?bld=2` 什么都没变就是它） */
            vendor: { url: VENDOR_URL, ver: VENDOR_VER, state: tfState, refetched: window.__TF_FRESH__ || null, missing: tfMissing(window.__TF__) },
          },
          sky: window.__SKY_GEO__ || null,
          contrast: window.__CONTRAST__ || null,
          /* 🎮 观感自证（`?look=2`）：档位 + 用的是哪一份主题 + 逐项回证 + 对比度数值。
             三态：`rows:null` ⇒ look=1（**未开**，不是失败）；`state` 里写清"已用派生主题"还是"回退：原因"。 */
          look: {
            mode: LOOK, id: LOOK_ID, state: lookState,
            theme: THEME ? THEME.label : null,
            themeBase: THEME_BASE ? THEME_BASE.label : null,
            metrics: (THEME && THEME.metrics) || null,
            metricsBase: (THEME_BASE && THEME_BASE.metrics) || null,
            roadChanged: typeof window.__LOOK_ROAD_CHANGED__ === "number" ? window.__LOOK_ROAD_CHANGED__ : null,
            vignette: window.__LOOK_VIG__ || null,
            layers: (map.getStyle().layers || []).filter(function (l) { return /^(bld-(shadow|ao)|road-glow-)/.test(l.id); }).map(function (l) { return l.id; }),
            rows: lookReadback(),
          },
          /* 🎬 场景装配自证（主会话要求：等于公共模块 ⇒ ✅；页面自带 ⇒ 判"判不了"并写明还没换源） */
          scene: (function () {
            const TFx = window.__TF__;
            if (!TFx || !TFx.sceneSelfReport) return null;
            const r = TFx.sceneSelfReport(!!window.__SCENE_CONSUMED__ && !!window.__SCENE_LAYER_CONSUMED__);
            return { ...r, plan: (TFx.sceneLayerPlan ? TFx.sceneLayerPlan().map(function (e) { return e.group; }) : []),
                     violations: (TFx.sceneOrderViolations ? TFx.sceneOrderViolations((map.getStyle().layers || []).map(function (l) { return l.id; })) : []) };
          })(),
          /* 🛣 路网计数（与 App 的 `🛣 N` 同一算法 `visibleRoadCount`）+ 交通设施回证 */
          roads: (typeof window.__ROAD_N__ === "number" ? window.__ROAD_N__ : null),
          roadAudit: window.__ROAD_AUDIT__ || null,
          roadHeals: (typeof window.__ROAD_HEALS__ === "number" ? window.__ROAD_HEALS__ : null),
          roadStat: window.__ROAD_STAT__ || null,
          tf: window.__TF_RES__ ? { n: (window.__TF_RES__.features || []).length, counts: window.__TF_RES__.counts, notes: window.__TF_RES__.notes, hud: (window.__TF && window.__TF.transportHudLine ? window.__TF.transportHudLine(window.__TF_RES__) : null) } : null,
          /* 🛰 LOD 自证（`?lod=1`）：状态 + 档位 + 瓦片命中/缺图（三态）+ 实时层要素数 + 层序违规。
             `lod: null` ⇒ **未启用**（不是失败）；`tiles.hit: null` ⇒ **数不出来**（不许读成 0）。 */
          lod: LOD_ON ? {
            param: LOD_PARAM, on: LOD_ON, state: lodState,
            tier: (window.__TF__ && window.__TF__.lodTierOf ? window.__TF__.lodTierOf(map.getZoom()) : null),
            tierLabel: (window.__TF__ && window.__TF__.lodTierLabel ? window.__TF__.lodTierLabel(window.__TF__.lodTierOf(map.getZoom())) : null),
            opacityExpr: (function () { try { return map.getPaintProperty("prerender", "raster-opacity"); } catch (e) { return "(取值抛错)"; } })(),
            layer: !!map.getLayer("prerender"), source: !!map.getSource("prerender"),
            before: (lodPlanCache && lodPlanCache.beforeId) || null,
            layerIds: (map.getStyle().layers || []).map(function (l) { return l.id; }).filter(function (id) { return id.indexOf("prerender") === 0; }),
            orderViolations: window.__LOD_ORDER_VIOLATIONS__ || null,
            tiles: lodVerdict,
            tileStates: window.__LOD_TILE_STATES__ || null,
            loadedKeys: lodLoadedKeys.size, failedKeys: lodFailedKeys.size, noKey: lodNoKey,
            manifest: lodManifest ? { tileCount: lodManifest.tileCount, themeId: lodManifest.themeId, fingerprint: lodManifest.themeFingerprint, zoomRange: lodManifest.zoomRange, palette: lodManifest.palette, attribution: lodManifest.attribution || null, dataKind: lodManifest.dataKind || null } : null,
            manifestErr: lodManifestErr || null,
            live: lodLive,
            hud: (function () { try { return $("m-lod").textContent; } catch (e) { return null; } })(),
          } : { on: false, param: LOD_PARAM, state: lodState, hud: (function () { try { return $("m-lod").textContent; } catch (e) { return null; } })() },
          bins: window.__w3d?.ready ? "ready" : "loading", errs: errs.slice(0, 3),
        };
      }
    </script>
    <!-- 🚌 交通设施 v0 的生成物（`scripts/build-ws-vendor.sh` 产出、**提交进仓库**、自检兜漂移）。
         静态页引不到 TS ⇒ 走"生成物"这条路（与 `wtheme.json` 同款）。`?tf=1` 才用它。 -->
    <script type="module">
      import * as TF from "/vendor/wsScene.mjs";
      window.__TF__ = TF;
    </script>
  </body>
