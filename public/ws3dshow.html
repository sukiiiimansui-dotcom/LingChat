<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小区级 3D 楼房 · 观感调参台（真机看效果用）</title>
    <!--
      ws3dshow.html —— **观感调参台**，不是产品页。

      ## 为什么单独开一页（2026-09-19）
      机主原话：「这个 ai 2d 小区好丑，直接试一下 3d 路线我看看效果」。
      本机无头浏览器**看不到 WebGL**（GPU 上下文首帧后必丢，6 种图形栈实测过），
      所以"好不好看"这件事**只能在真机上调**。而真机上走 App 到小区级要点好几下、
      还要等 AI 精绘 ⇒ 一轮迭代几分钟。
      这一页把"调观感"需要的三件事压到一屏：**真底图 + 真楼房挤出 + 一组能点的档位**。

      ## 它和产品代码的关系
      这里调出来的配方（底图、高度取值、配色、光照）会**原样搬进**
      `src/components/views/worldsim/WsDistrictMapLibre.vue`。所以这一页的表达式
      故意写成可以直接复制粘贴的形状 —— 别在这里发明只此一处的新写法。

      ## 三条踩过的坑（都在这一页里守住了）
      ① 样式对象里**绝不能写 `glyphs: undefined`** → 样式校验失败 → `load` 永不触发，
         而页面**零报错**（第一次就是这么被骗的）。
      ② canvas 必须 `preserveDrawingBuffer: true`，否则截图拍到空白。
      ③ Esri 瓦片路径是 `{z}/{y}/{x}`（**y 在前**）—— 写成 `{z}/{x}/{y}` 不报错但地图会跑到别处。
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #070b11; }
      body { font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eaf6ff; }
      #map { position: fixed; inset: 0; }
      .hud {
        position: fixed; left: 8px; bottom: 8px; z-index: 20;
        display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 62vw;
        padding: 5px 9px; border-radius: 10px;
        background: rgba(7, 11, 17, 0.62);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        font-size: 11px; line-height: 1.7;
      }
      .hud b { color: #79d9ff; font-weight: 600; }
      .hud .w { color: #ffcf8a; }
      .ops {
        position: fixed; right: 8px; bottom: 8px; z-index: 20;
        display: flex; flex-direction: column; gap: 6px;
      }
      .ops button {
        width: 46px; height: 42px; border: none; border-radius: 12px;
        background: rgba(7, 11, 17, 0.66); color: #eaf6ff; font-size: 12px;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .ops button.on { background: #79d9ff; color: #06222e; font-weight: 700; }
      #fb { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; z-index: 30;
            background: #070b11; text-align: center; }
      /* art 徽标 + 回证表：**只读的诊断件**（收起时只占一行小字） */
      .artb { position: fixed; right: 8px; top: 8px; z-index: 25; max-width: 46vw;
              padding: 5px 8px; border-radius: 10px; background: rgba(7, 11, 17, 0.72);
              font-size: 10.5px; line-height: 1.5; color: #eaf6ff; }
      .artb__h { font-weight: 700; color: #79d9ff; cursor: pointer; }
      .artb__b { display: none; margin-top: 4px; }
      .artb.is-open .artb__b { display: block; }
      .artb__row { white-space: nowrap; }
      .artb__ok { color: #7ee787; }
      .artb__bad { color: #ff7b72; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- 🎨 art 变体徽标 + **回证表**（机主第一反馈"这变了个啥"⇒ 先证明补丁真的生效） -->
    <div id="artb" class="artb">
      <div id="artb-head" class="artb__h">art=1（基准）</div>
      <div id="artb-body" class="artb__b"></div>
    </div>
    <div class="hud">
      <span><b id="m-n">0</b> 栋</span>
      <!-- 🛣 路网**独立一格**：交通设施那行会覆盖 m-msg ⇒ 路数必须有自己的位置（否则"看不见路"没人知道是没插还是没数） -->
      <span id="m-roads" class="w">路网 —</span>
      <span>真高 <b id="m-h">0</b></span>
      <span>层数 <b id="m-l">0</b></span>
      <span class="w">按类型估 <b id="m-e">0</b></span>
      <span><b id="m-r">-</b> m</span>
      <span><b id="m-z">-</b> 级</span>
      <span><b id="m-fps">-</b> fps</span>
      <span class="w" id="m-msg"></span>
      <span id="m-build" style="opacity:.55"></span>
    </div>
    <div class="ops">
      <button id="b-sat" title="切换 z16 以上的底：卫星影像 / 暗色底放大">星</button>
      <button id="b-far" title="远景（看整片）">远</button>
      <button id="b-near" title="近景（看楼体）">近</button>
      <button id="b-spin" title="转个角度">转</button>
    </div>
    <div id="fb"></div>

    <script type="module">
      /* 真机上看效果用的调参台。所有数字都在这里，改完刷一下页面就见效。 */
      const API = "http://127.0.0.1:8791";
      /**
       * 🔴 **版本戳**（2026-09-20 加的，血的教训）：
       * 机主点了一次代拍，回来的三张**是修复之前那一版**拍的 —— 因为浏览器把
       * `public/` 下的 `ws3dshow.html` 缓存住了（它**没有内容哈希**，不像 `assets/*.js`）。
       * 于是我在这边看服务端文件是新的、就以为他跑的是新的，白等一轮。
       * ⇒ 诊断图里带上版本戳，一眼分辨"跑的是哪一版"；请机主打开时在 URL 后面加
       *   一个 `&v=数字`（或先刷新清缓存），把旧缓存顶掉。
       */
      const BUILD = "ws3dshow-2026-09-20-v8";
      try { document.getElementById("m-build").textContent = BUILD; } catch { /* 元素不在就算了 */ }

      /* 默认落点：**渝中区驻地**（后端 `/api/geo_json?ad=500103` 的 properties.center）。
         为什么是它：IP 定位（`/api/location?fast=1`）当前解析出来的就是渝中区，
         这一带 OSM 楼房密（实测 800m 内 232 栋）——"成片"要看得出效果就得在这种地方。 */
      const SPOT = { lng: 106.56288, lat: 29.556742, name: "重庆·渝中区" };

      const KIND_H = {
        /* OSM 建筑类型 → 合理层高（米）。**这张表是"估算"，HUD 里单独计数，不混进真数据。**
           依据：中国城区最常见的形态（6~7 层住宅 ≈ 18~21m、临街商业 4~5 层 ≈ 15m、
           写字楼/酒店 20 层起 ≈ 60m）。宁可保守，也别把老城区画成曼哈顿。 */
        house: 7, detached: 7, semidetached_house: 7, bungalow: 4, hut: 3, shed: 3, garage: 3, garages: 3, roof: 3, carport: 3,
        residential: 18, dormitory: 15, apartments: 21, terrace: 9, commercial: 15, retail: 12,
        office: 45, hotel: 40, tower: 90, hospital: 24, school: 12, university: 15, kindergarten: 9,
        industrial: 10, warehouse: 9, factory: 10, church: 18, temple: 10, mosque: 15, museum: 18,
        construction: 12, yes: 12,
      };

      /** 稳定的字符串哈希（同一条 id 永远同一个数）—— 用来给"估算高度"加一点确定性抖动。
       *  为什么要抖：一整片 `building=yes` 如果全给 12m，就是一张**平顶地毯**，
       *  看着比没有还假。±15% 的确定性抖动让人眼读到"这是一片高低不齐的楼"，
       *  而且同一个楼每次刷新都一样（不是随机闪烁）。 */
      function hash32(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return (h >>> 0);
      }

      /** 渲染用高度：真高 → 层数×3（后端已折好）→ 按 OSM 类型估。返回 [米, 来源] */
      function renderHeight(p) {
        const h = Number(p.height);
        if (p.height_src === "height" && h > 0) return [h, "real"];
        if (p.height_src === "levels" && h > 0) return [h, "levels"];
        const base = KIND_H[String(p.kind || "yes").toLowerCase()] ?? KIND_H.yes;
        const jitter = 0.85 + (hash32(String(p.osm_id || "")) % 31) / 100; // 0.85 ~ 1.15
        return [Math.max(3, Math.round(base * jitter * 10) / 10), "kind"];
      }

      const $ = (id) => document.getElementById(id);
      const errs = [];
      let maplibregl = null;
      let map = null;
      let fcCache = null;
      const stats = { n: 0, real: 0, levels: 0, kind: 0, r: 0 };

      function fail(why) {
        const el = $("fb"); el.style.display = "grid";
        el.textContent = "3D 调参台起不来：" + why + "（本机无头看不到 WebGL 是已知的，真机才有）";
        window.__w3d = { ok: false, why, errs: errs.slice(0, 5) };
      }

      /* ── 🎨 主题（2026-09-20）────────────────────────────────────────────────
         机主原话：「这个地图太暗了喵，还有就是我想给整体地图改成二次元式的那种风格喵」。

         🔴 这一页**不自己写一套配色** —— 它从 `/wstheme.json` 读**同一份主题**。
         为什么：这一页是"观感调参台"，产品配方在 `WsDistrictMapLibre.vue` 里。
         两边各自维护一份颜色，就一定会漂（这一页原来就是手抄的）。
         那份 JSON 由 `world_map/ws_map_theme_selftest.mjs` **从 `wsMapTheme.ts` 生成**，
         而且自检每次都会断言"committed 的 JSON == 现在生成的"⇒ 想漂都漂不了。

         A/B：`?wstheme=night` 回暗色、`?wstheme=anime` 二次元（不给就用默认=二次元）。
         取不到 JSON 时**退回本页原来那套暗色配方**（页脚会如实写"主题未加载"）。 */
      let THEME = null;
      let THEME_ID = "anime";
      try {
        const q = new URLSearchParams(location.search).get("wstheme");
        if (q === "night" || q === "anime") THEME_ID = q;
      } catch { /* 参数坏了就用默认，不因为一个开关把页面搞崩 */ }

      async function loadTheme() {
        try {
          const r = await fetch("/wstheme.json", { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const j = await r.json();
          const t = j?.themes?.[THEME_ID];
          if (!t) throw new Error("快照里没有主题 " + THEME_ID);
          THEME = t;
          /* 版本戳带上主题名 —— 代拍回来的图一眼能看出"跑的是哪一套"（缓存坑踩过） */
          try { document.getElementById("m-build").textContent = BUILD + " · " + t.label + " · " + artHud(); } catch {}
        } catch (e) {
          THEME = null;
          try { document.getElementById("m-build").textContent = BUILD + " · 主题未加载(" + String(e).slice(0, 24) + ")"; } catch {}
        }
      }

      /* ── 样式：底图 + 楼房挤出 ───────────────────────────────────────────── */
      function makeStyle() {
        /* 有主题快照就照它建（底半部分与产品组件**逐字段同源**） */
        if (THEME) {
          const st = { version: 8, name: "ws-3d-show-" + THEME.id, sources: THEME.sources, layers: THEME.layers };
          /* ⚠️ 用条件赋值而不是 `sky: undefined` —— 后者会被当成"写了这个键"，
             样式校验会报错，而 `load` 永不触发、画布全透明（这页的文件头记着这条）。 */
          if (THEME.sky) st.sky = THEME.sky;
          /* 🎨 `?art=2` 的变体在这里落地（art=1 时 `applyArt` 原样返回 ⇒ 旧版零改动） */
          try {
            const r = applyArt(st);
            window.__ART_CHANGED__ = r.changed;
          } catch (e) {
            window.__ART_CHANGED__ = -1; // 变体出错 ⇒ HUD 如实报，不影响旧版
          }
          return st;
        }
        return makeStyleFallback();
      }

      /** 取不到 `/wstheme.json` 时的兜底：本页原来那套暗色配方（一字不改，保证页面还能跑） */
      function makeStyleFallback() {
        return {
          version: 8,
          name: "ws-3d-show",
          /* 大气透视：远处的楼往天色里化开。本 vendored 构建（v6.10.0）**不支持** `light`
             与 fill-extrusion-ambient-occlusion，所以"光照"只能靠"高度色阶 + 竖向渐变 + 雾"凑。 */
          sky: {
            "sky-color": "#0a1119", "horizon-color": "#1b2a3a", "fog-color": "#0d1620",
            "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.4, "atmosphere-blend": 0.7,
          },
          sources: {
            /* Esri 免 key。⚠️ 路径是 {z}/{y}/{x}（y 在前）—— 写错**不报错**，地图会跑到别处。 */
            base: {
              /* ⚠️ 暗色 Canvas 系列**最高只到 z16**（z17+ 是「Map data not yet available」占位图），
                 所以限 16，让 MapLibre 放大复用；z16 以上由 `hi`（卫星）接手。 */
              type: "raster", tileSize: 256, maxzoom: 16,
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
              attribution: "Sources: Esri, HERE, Garmin, © OpenStreetMap contributors",
              /* 🔴 不写这行 ⇒ 跨域瓦片**污染画布** ⇒ toDataURL 抛 SecurityError ⇒ 代拍全废
                 （而画面上一切正常，只有取图那一步失败，极其难查）。Esri 实测回 ACAO:* 。 */
              crossOrigin: "anonymous",
            },
            /* 🛰 高分层（z16 以上）。机主 2026-09-20：「**地图太糊了**（放太大直接变成灰蒙蒙的）」
               —— 根因是暗色 Canvas 系列**最高只到 z16**，z17~18 等于把 z16 放大 2~4 倍。
               实测（逐块下载比对）：`Canvas/World_Dark_Gray_Base` z17 与 `World_Topo_Map` z16
               的瓦片 **md5 完全相同**（都是 2521B 的「Map data not yet available」占位图）
               ⇒ **Topo 在这片也是死路**；只有 `World_Imagery` z16/17/18 逐级有真细节
               （15556/13291/9993B）。所以高分层用卫星影像，并**压进暗部**（白天亮照片
               直接铺会白得刺眼、而且比楼还亮 ⇒ 3D 楼会消失在背景里）。 */
            hi: {
              type: "raster", tileSize: 256, maxzoom: 19, crossOrigin: "anonymous",
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
              attribution: "Sources: Esri, Maxar, Earthstar Geographics",
            },
            /* 注记层（街名/地名）：暗色底图 Base 是**不带字**的，只铺它看不出"这是哪条街"。 */
            ref: {
              type: "raster", tileSize: 256, maxzoom: 19, crossOrigin: "anonymous",
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"],
            },
          },
          layers: [
            { id: "bg", type: "background", paint: { "background-color": "#0a1017" } },
            /* 地面：压暗 + 去饱和，把"主角位"让给楼体（不压的话楼和地一个亮度，糊成一片） */
            {
              id: "base", type: "raster", source: "base",
              /* z14.5 起往 0 淡出，把"地面"交给高分层（交叉过渡，不"咔"一下换底） */
              paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 14.5, 0.92, 16.2, 0], "raster-saturation": -0.25, "raster-contrast": 0.04, "raster-brightness-max": 0.74 },
            },
            {
              id: "hi", type: "raster", source: "hi", minzoom: 14.5,
              paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 14.5, 0, 16.2, 0.95], "raster-saturation": -0.4, "raster-contrast": 0.12, "raster-brightness-min": 0.0, "raster-brightness-max": 0.34 },
            },
            /* 注记压在楼之上（和地图 App 一个口径：街名不该被楼挡住）。
               楼房图层由 `addBldLayers()` 在**数据到了之后**插到它前面。 */
            { id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.9 } },
          ],
        };
      }

      /**
       * 楼房图层规格（**不能写进 `makeStyle()` 的 layers 里**！）。
       *
       * 🔴 2026-09-19 血案（代价 = 机主白点一次代拍）：
       * 我一开始把 `bld-ext` / `bld-line` 直接写在样式的 `layers` 数组里，而它们引用的
       * `bld` 源要等数据到了才 `addSource` ⇒ 样式校验直接失败：
       *   `layers[2]: source "bld" not found`
       * ⇒ `map.on("load")` **永远不触发** ⇒ 底图不画、楼不画、连瓦片都不请求，
       *   画布**全透明**（`toDataURL` 出来 RGBA 全是 0），而**页面零报错**
       *   （错误只在 `map.on("error")` 里，我们没显示）。
       * 代拍回来的三张"纯白"就是它 —— 白 = 全透明 α=0，看图器铺白底。
       *
       * 规矩：**样式里只写"一开始就存在的东西"**；随数据来的图层一律 `addLayer` 后加。
       */
      function bldLayerSpecs() {
        /* 色阶/描边/平涂开关**全部跟着主题走**（和产品组件同源，见 `wsMapTheme.ts`）。
           兜底值 = 本页原来那套暗色配方。 */
        const ramp = artRamp(
          THEME?.ramp || [
            [3, "#23323e"], [8, "#2d4356"], [16, "#3a586f"], [30, "#4a7290"],
            [60, "#5f93b0"], [110, "#7fbcd4"], [200, "#b6e2f2"], [320, "#e8f7ff"],
          ]
        ); // 🎨 art=2 把高段推到近白（`artRamp` 在 art=1 时**原样返回**）
        const outline = THEME?.outline || { color: "rgba(190,235,255,0.22)", width: 0.5 };
        /* 平涂（二次元）= 关掉竖向渐变；写实（暗色）= 开着。 */
        const vgrad = THEME ? THEME.verticalGradient : true;
        const opacity = THEME?.extrudOpacity || 0.97;
        const stops = [];
        for (const [h, c] of ramp) stops.push(h, c);
        void 0; // （`artRamp` 在 art=1 时原样返回 ⇒ 旧版色阶逐字节不变）
        return [
          {
            id: "bld-ext", type: "fill-extrusion", source: "bld",
            paint: {
              /* 按**渲染高度**上色：矮的沉下去、高的亮起来 ⇒ 一眼看出天际线的高低起伏。
                 （按"数据来源"上色就会是一整片平色 —— 数据口径不该当美术用。） */
              "fill-extrusion-color": ["interpolate", ["linear"], ["get", "h3d"], ...stops],
              "fill-extrusion-height": ["get", "h3d"],
              "fill-extrusion-base": ["coalesce", ["get", "min_height"], 0],
              "fill-extrusion-opacity": opacity,
              /* 墙面竖向渐变：楼顶比楼底亮一点，体块才有"立起来"的感觉；
                 二次元的**平涂**要关掉它（楼是一块纯色板才"动画"）。 */
              "fill-extrusion-vertical-gradient": vgrad,
            },
          },
          {
            /* 轮廓线。暗色里它只是淡淡一圈；**二次元里它是主角** ——
               BA 风的地面(0.919)和矮楼(0.87)亮度几乎一样，全靠这条深藏青细线把楼"勾"出来。 */
            id: "bld-line", type: "line", source: "bld",
            paint: {
              "line-color": outline.color,
              /* 🎨 art=2：描边**随 zoom 变细/变粗**（近粗 ⇒ 动画感；远细 ⇒ 不糊成一片）。
                 art=1 保持主题给的固定宽度（旧版逐字节不变）。停靠点只有一份（`OUTLINE_STOPS`）。 */
              "line-width": ART === 2 ? outlineWidthExpr() : outline.width,
            },
          },
        ];
      }

      /* ══ 🎨 美术变体 `?art=2`（机主 2026-09-21：先在**代拍页**做一版，别碰 App 与角色）════
         规矩：**只在这一页做**、**不动 `ANIME` 基准值**、**只改"图层里已经存在的 paint 键"**
         （`patchPaint()` 会跳过不存在的键 —— 我们被"往 style 塞未知键 ⇒ 整份校验失败 ⇒ load 永不触发"坑过）。
         参考：`~/rikka/Dsh-SYuki/world_map/ART-STUDY.md`（高调平涂 / 描边随距离 / 基沃托斯的天）。 */
      const ART = (function () {
        try { return /[?&]art=2\b/.test(location.search) ? 2 : 1; } catch (e) { return 1; }
      })();

      /** 描边的 zoom→宽度 停靠点（**单一真源**：样式表达式与 HUD 显示都从这一份来，别写两遍） */
      const OUTLINE_STOPS = [
        [13, 0.5], [15, 1.6], [16.5, 3.4], [18, 4.2],
      ]; // 机主反馈"看不出变化" ⇒ 近景放大一档（远景仍保持细）
      /** 按 zoom 求描边宽度（纯函数；用于 HUD 显示"现在多粗"） */
      function outlineWidthAt(z) {
        const st = OUTLINE_STOPS;
        if (z <= st[0][0]) return st[0][1];
        for (let i = 1; i < st.length; i++) {
          if (z <= st[i][0]) {
            const [z0, w0] = st[i - 1], [z1, w1] = st[i];
            return +(w0 + ((w1 - w0) * (z - z0)) / (z1 - z0)).toFixed(2);
          }
        }
        return st[st.length - 1][1];
      }
      /** 由停靠点生成 MapLibre 的 zoom 插值表达式（与 `outlineWidthAt` 同源） */
      function outlineWidthExpr() {
        const out = ["interpolate", ["linear"], ["zoom"]];
        for (const [z, w] of OUTLINE_STOPS) out.push(z, w);
        return out;
      }

      /**
       * 只改**该图层 paint 里已经存在的键**（防"塞未知键 ⇒ 整份 style 校验失败 ⇒ load 永不触发"）。
       * 返回是否真的改了（HUD 会统计改了几处，别让人以为改了其实没改）。
       */
      function patchPaint(style, layerId, key, value) {
        const l = (style.layers || []).filter(function (x) { return x.id === layerId; })[0];
        if (!l || !l.paint || !(key in l.paint)) return false;
        l.paint[key] = value;
        return true;
      }

      /**
       * 🎨 **补丁表（单一真源）**：art=2 要改的"图层 → 键 → 值"。
       * `applyArt()` 按它改样式；`artReadback()` 按它**读回实时值**做回证 —— **同一份表**，
       * 所以"改了但没生效"这种情况一定会在回证表里露出来（机主第一反馈："这变了个啥"）。
       */
      const ART_PATCHES = [
        { id: "tint", key: "background-color", art2: "#EEF9FF", why: "地面色罩更近白" },
        { id: "tint", key: "background-opacity", art2: 0.8, why: "色罩更实（平涂感）" },
        { id: "bg", key: "background-color", art2: "#F7FCFF", why: "底色更亮" },
        { id: "base", key: "raster-opacity", art2: 0.32, why: "照片更淡 ⇒ 少纹理" },
      ];
      /** 楼体色阶要推近白的档数（`artRamp` 用；也进回证表） */
      const ART_RAMP_HI = ["#CFEDFF", "#E2F6FF", "#F2FCFF", "#FFFFFF"];

      /** 造这一版美术（art=2 才动；art=1 原样返回 ⇒ **旧版一个字节都不变**） */
      function applyArt(style) {
        if (ART !== 2) return { style: style, changed: 0 };
        let n = 0;
        const set = function (id, k, v) { if (patchPaint(style, id, k, v)) n++; };
        for (const q of ART_PATCHES) set(q.id, q.key, q.art2);

        /* ① 描边随 zoom 变细（近粗远细）—— 楼层的 `bld-line` 在 addLayer 时加，见 bldLayerSpecs() */
        /* ② 基沃托斯的天：**根级 sky 只动白名单里的键**（sky-color/horizon-color/fog-color 等 7 个） */
        if (style.sky) {
          const sky = Object.assign({}, style.sky);
          if ("horizon-color" in sky) { sky["horizon-color"] = "#FFFFFF"; }      // 地平线近白
          if ("fog-color" in sky) { sky["fog-color"] = "#F4FBFF"; }              // 白雾带
          if ("sky-color" in sky) { sky["sky-color"] = "#6FCBFA"; }              // 天顶更纯的青蓝
          if ("horizon-fog-blend" in sky) { sky["horizon-fog-blend"] = 0.78; }   // 雾带更宽 ⇒ 云带的观感
          if ("sky-horizon-blend" in sky) { sky["sky-horizon-blend"] = 0.55; }
          style.sky = sky;
          n++;
        }
        /* ③ 平涂高调：地面更近白（tint 层是"色罩"，提亮 + 降饱和观感）、照片底图更淡（少纹理） */
        return { style: style, changed: n };
      }

      /** 楼体色阶：art=2 把高段推到近白（**不动 ANIME 基准**，只在这一页换一份 ramp） */
      function artRamp(ramp) {
        if (ART !== 2 || !ramp || !ramp.length) return ramp;
        const r = ramp.map(function (p) { return [p[0], p[1]]; });
        const hi = ART_RAMP_HI;
        for (let i = 0; i < hi.length && i < r.length; i++) r[r.length - 1 - i][1] = hi[hi.length - 1 - i];
        return r;
      }

      /** HUD 上的"这一版是什么"：art 档位 + 描边当前宽度 + 变体生效处数（**自证**，别让人猜） */
      function artHud() {
        try {
          let z = 0;
          try { z = map && map.getZoom ? map.getZoom() : 0; } catch (e) { z = 0; }
          const w = map && map.getPaintProperty ? map.getPaintProperty("bld-line", "line-width") : null;
          const wTxt = w && w.length ? ("zoom插值→" + outlineWidthAt(z)) : String(w);
          const ch = window.__ART_CHANGED__;
          return "art=" + ART + " 描边=" + wTxt + (ch === undefined ? "" : " 变体改=" + ch + "处");
        } catch (e) {
          return "art=" + ART + "（HUD 取不到）";
        }
      }

      /**
       * 🎨 **回证表**：按 `ART_PATCHES` 逐条读**地图上真实的** paint 值，与 art=2 期望值对照。
       * 为什么必须有：上一版我只做了"拿 JSON 空跑"的自验 —— 那**不等于页面上生效**
       * （真页面的图层/键可能与 JSON 不一致）。机主第一句反馈就是"这变了个啥"。
       * 返回 `[{图层, 键, 现在, 期望, 命中}]`，命中/跳过**都列**。
       */
      function artReadback() {
        const rows = [];
        for (const q of ART_PATCHES) {
          let now = null, has = false;
          try {
            has = !!(map && map.getLayer && map.getLayer(q.id));
            now = map && map.getPaintProperty ? map.getPaintProperty(q.id, q.key) : null;
          } catch (e) { now = "(取值抛错)"; }
          rows.push({
            id: q.id, key: q.key, now: now,
            want: ART === 2 ? q.art2 : null,
            /** art=1 时这一行只是"基准值"；art=2 时才判命中 */
            hit: ART !== 2 ? null : (!has ? "no-layer" : JSON.stringify(now) === JSON.stringify(q.art2)),
            why: q.why,
          });
        }
        /* 描边（zoom 插值，特殊一行）：报告"现在这个 zoom 下实际多粗" */
        try {
          const w = map && map.getPaintProperty ? map.getPaintProperty("bld-line", "line-width") : null;
          rows.push({
            id: "bld-line", key: "line-width",
            now: w && w.length ? ("zoom插值→现在 " + outlineWidthAt(map.getZoom())) : w,
            want: ART === 2 ? ("zoom插值→" + JSON.stringify(OUTLINE_STOPS)) : "主题固定值",
            hit: ART !== 2 ? null : (w && w.length ? true : false),
            why: "描边随 zoom（近粗远细）",
          });
        } catch (e) { /* 忽略 */ }
        return rows;
      }

      /* ══ 🚌 交通设施 v0：`?tf=1`（机主 2026-09-21「预设 = 你先画一套」）══════════
         规则/样式/生成逻辑都在 `wsTransportRules.ts` + `wsTransport.ts`（**唯一真源**），
         页面只调**生成物** `/vendor/wsTransport.mjs`（`scripts/build-ws-vendor.sh` 产出）。 */
      const TFON = (function () { try { return /[?&]tf=1\b/.test(location.search); } catch (e) { return false; } })();
      let tfDone = false;

      /** 取路网中心线（与 App 同一个后端口径：`/api/roads?lat&lng&r`） */
      async function fetchRoads(r) {
        const c = map.getCenter();
        const res = await fetch(`${API}/api/roads?lat=${c.lat.toFixed(5)}&lng=${c.lng.toFixed(5)}&r=${r}`);
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || "ok=false");
        return body.geojson;
      }

      /* ══ 🛣 路网（机主 2026-09-21：「也没有路线啊喵，我要看得到喵」）══════════════
         复用 App 那条线：`wsRoads.roadLayerSpecs(THEME.road)`（分级：主干粗亮/支路细淡）
         + `visibleRoadCount()` 计数 —— **不写第二套配色、不写第二套计数**。
         `?roads=0` 可关（A/B 看"有路/无路"差别；默认**开**）。 */
      const ROADSON = (function () { try { return !/[?&]roads=0\b/.test(location.search); } catch (e) { return true; } })();
      let roadN = 0;

      async function applyRoads() {
        const TF2 = window.__TF__;
        if (!TF2) { $("m-msg").textContent = "路网：生成物未加载（/vendor/wsScene.mjs）"; return; }
        let roads = { features: [] };
        try { roads = await fetchRoads(stats.r || 600); } catch (e) { errs.push("roads " + e); }
        const feats = (roads && roads.features) || [];
        roadN = TF2.visibleRoadCount({ features: feats }, map.getZoom());
        if (!feats.length) {
          /* 空结果**必须说出来**（同 App 的纪律：静默 = 让人以为"这里没路"） */
          const el = document.getElementById("m-roads");
          if (el) el.textContent = `🛣 0 条 · 这一带没有路网数据（${stats.r || 600}m）`;
          return;
        }
        const data = { type: "FeatureCollection", features: feats };
        try {
          if (map.getSource("roads")) map.getSource("roads").setData(data);
          else map.addSource("roads", { type: "geojson", data });
          const specs = TF2.roadLayerSpecs((THEME && THEME.road) || undefined);
          /* 插在**楼体之下**（路是地面上的东西；交通设施稍后插 ⇒ 落在路网**之上**） */
          const before = map.getLayer("bld-ext") ? "bld-ext" : (map.getLayer("ref") ? "ref" : undefined);
          for (const l of specs) if (!map.getLayer(l.id)) map.addLayer(l, before);
        } catch (e) { errs.push("roadLayers " + e); }
        const stat = (roads && roads.stats) || null;
        window.__ROAD_N__ = roadN;
        window.__ROAD_STAT__ = stat ? TF2.roadStatsLine(stat) : null;
        /* 🛣 路数走**独立 HUD 格**（`m-msg` 会被交通设施那行覆盖 —— 那就是"看不见路"的来源之一） */
        renderRoadHud();
        window.__ROAD_AUDIT__ = roadAudit();
      }

      /**
       * 🛣 **路网自证**（2026-09-22：机主两张图对比发现"`?tf=1` 时路网不见了"——
       * 本机无头无 WebGL，我复现不了 ⇒ 按主会话要求**把断言与证据放进页面**，
       * 让下一次刷新直接告诉我们：source 在不在、图层在不在、可见几条、有什么错。
       */
      function roadAudit() {
        const out = { hasSource: false, layerIds: [], visible: null, errs: [] };
        try { out.hasSource = !!map.getSource("roads"); } catch (e) { out.errs.push("getSource " + e); }
        try {
          out.layerIds = (map.getStyle().layers || []).map(function (l) { return l.id; })
            .filter(function (id) { return /^road-(casing|line)-/.test(id); });
        } catch (e) { out.errs.push("layers " + e); }
        try {
          const src = map.getSource("roads");
          const data = src && src._data ? src._data : null; // MapLibre 内部字段：**只读诊断**用
          out.visible = data ? window.__TF__.visibleRoadCount(data, map.getZoom()) : null;
        } catch (e) { out.errs.push("count " + e); }
        return out;
      }
      /** 🛣 层序**事后断言**：缺就补、被压在上面就 `moveLayer()`，并计数（HUD 报"自愈 N 次"） */
      let roadHeals = 0;
      function ensureRoadOrder() {
        const TF2 = window.__TF__;
        if (!TF2 || !TF2.planEnsureRoadOrder) return;
        const fake = {
          hasSource: function (id) { return !!map.getSource(id); },
          hasLayer: function (id) { return !!map.getLayer(id); },
          layerIds: function () { return (map.getStyle().layers || []).map(function (l) { return l.id; }); },
        };
        let ops = [];
        try { ops = TF2.planEnsureRoadOrder(fake); } catch (e) { errs.push("planOrder " + e); return; }
        for (const o of ops) {
          try {
            if (o.op === "add-roads") { void applyRoads(); }
            else if (o.op === "move" && o.id && map.getLayer(o.id)) map.moveLayer(o.id, o.before);
            roadHeals++;
            errs.push("roadHeal: " + o.why);
          } catch (e) { errs.push("roadHeal fail " + e); }
        }
        if (ops.length) { try { renderRoadHud(); } catch (e) { /* 忽略 */ } }
      }

      function renderRoadHud() {
        try {
          const a = roadAudit();
          const el = document.getElementById("m-roads");
          if (!el) return;
          const ok = a.layerIds.length > 0 && (a.visible === null || a.visible > 0);
          el.textContent = `🛣 ${a.visible === null ? "?" : a.visible} 条 · 图层 ${a.layerIds.length} 个 · 自愈 ${roadHeals} 次` +
            (a.hasSource ? "" : " · **无 source**") + (ok ? "" : " · **路网没画上（见下）**") +
            (a.errs.length ? " · " + a.errs.join("；") : "");
        } catch (e) { /* HUD 失败不影响地图 */ }
      }

      /** 生成 + 画（**路网之上、楼体之下**：`before="bld-ext"`） */
      async function applyTransport(fc) {
        const TF = window.__TF__;
        if (!TF) { $("m-msg").textContent = "交通设施：生成物未加载（/vendor/wsTransport.mjs）"; return; }
        let roads = { features: [] };
        try { roads = await fetchRoads(stats.r || 600); } catch (e) { errs.push("roads " + e); }
        const toRoad = (f) => ({ pts: (f.geometry && f.geometry.coordinates) || [], cls: f.properties && f.properties.class, name: f.properties && f.properties.name });
        const toBld = (f) => {
          const g = f.geometry || {};
          const ring = g.type === "Polygon" ? (g.coordinates || [])[0] : [];
          return { ring: ring || [], kind: (f.properties || {}).building || (f.properties || {}).kind || "" };
        };
        const c = map.getCenter();
        const res = TF.buildTransport(
          (roads.features || []).map(toRoad).filter(function (r) { return r.pts.length >= 2; }),
          (fc.features || []).map(toBld).filter(function (b) { return b.ring.length >= 3; }),
          [c.lng, c.lat],
          !!(window.__PERF_LOW__ || /[?&]low=1\b/.test(location.search))
        );
        /* 按类别画：每类一个图层（顺序按规则文件；`before="bld-ext"` ⇒ 在楼体之下） */
        for (const kind of ["crosswalk", "driveway", "parking", "bus", "signal"]) {
          const feats = res.features.filter(function (f) { return f.kind === kind; });
          const id = TF.TF_LAYER_IDS[kind];
          try { if (map.getLayer(id)) map.removeLayer(id); } catch (e) { /* 没有就算了 */ }
          try { if (map.getSource(id)) map.removeSource(id); } catch (e) { /* 同上 */ }
          if (!feats.length) continue;
          const style = TF.TF_LAYER_STYLE[kind];
          const gj = {
            type: "FeatureCollection",
            features: feats.map(function (f) {
              return f.to
                ? { type: "Feature", geometry: { type: "LineString", coordinates: [f.at, f.to] }, properties: { why: f.why } }
                : { type: "Feature", geometry: { type: "Point", coordinates: f.at }, properties: { why: f.why, name: f.name || "", n: f.count || 0 } };
            }),
          };
          map.addSource(id, { type: "geojson", data: gj });
          map.addLayer({ id: id, type: style.type, source: id, paint: style.paint }, map.getLayer("bld-ext") ? "bld-ext" : undefined);
        }
        /* HUD：**必须**带「示意，非事实」；并回证各计数与裁掉数 */
        $("m-msg").textContent = TF.transportHudLine(res);
        window.__TF_RES__ = res;
        tfDone = true;
      }

      /** 把回证表画到徽标里（点击徽标展开/收起） */
      function renderArtBadge() {
        try {
          const head = document.getElementById("artb-head");
          const body = document.getElementById("artb-body");
          const box = document.getElementById("artb");
          if (!head || !body || !box) return;
          const rows = artReadback();
          const hitN = rows.filter(function (r) { return r.hit === true; }).length;
          const missN = rows.filter(function (r) { return r.hit === false; }).length;
          head.textContent = ART === 2
            ? ("🎨 art=2 ✓ 命中 " + hitN + "/" + rows.length + (missN ? (" ❌未命中 " + missN) : ""))
            : "🎨 art=1（基准版）";
          head.onclick = function () { box.classList.toggle("is-open"); };
          body.innerHTML = rows.map(function (r) {
            const mark = r.hit === true ? '<span class="artb__ok">✅</span>'
              : r.hit === false ? '<span class="artb__bad">❌</span>' : '<span>·</span>';
            return '<div class="artb__row">' + mark + " " + r.id + "." + r.key +
              " = " + JSON.stringify(r.now) +
              (r.hit === false ? (" 期望 " + JSON.stringify(r.want)) : "") +
              " <i>" + r.why + "</i></div>";
          }).join("");
        } catch (e) { /* 徽标画不出来不影响页面 */ }
      }

      /**
       * 🔴 侧视角（近地平线）**倍率爆炸**的护栏（机主 2026-09-21：「一下划不见」）。
       *
       * 根因：pitch 越大，地面与视线越接近平行 ⇒ 同样的手指位移对应**巨大的地面距离**。
       * 做法：① **`maxPitch` 85 → 70**（能给天空，但到不了"只剩一条线"）；
       *      ② pitch > 55 之后**按比例降拖动速度**（`dragPan.enable({maxSpeed})`，MapLibre 的公开口子）；
       *      ③ HUD 显示当前 pitch 与阻尼系数（**自证**：机主能看出护栏在不在工作）。
       * ⚠️ 触屏的"捏合缩放"没有 rate 口子（`touchZoomRotate` 不暴露）⇒ 那一项**没做**，如实记。
       */
      const PITCH_SOFT = 55;
      function panDamping(pitch) {
        return pitch <= PITCH_SOFT ? 1 : 1 / (1 + (pitch - PITCH_SOFT) / 25);
      }
      function applyPitchGuard() {
        try {
          const p = map && map.getPitch ? map.getPitch() : 0;
          const k = panDamping(p);
          if (map && map.dragPan && map.dragPan.enable) {
            map.dragPan.enable({ maxSpeed: Math.round(1400 * k) });
          }
          if (map && map.scrollZoom && map.scrollZoom.setWheelZoomRate) {
            map.scrollZoom.setWheelZoomRate((1 / 450) * k);
          }
          const el = document.getElementById("m-msg");
          if (el && ART === 2) el.textContent = "pitch=" + Math.round(p) + "° 拖动阻尼×" + k.toFixed(2);
        } catch (e) { /* 护栏失败不影响地图 */ }
      }

      function hasWebGL() {
        try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
        catch { return false; }
      }

      /** 视野 → 取楼半径：**按屏幕真正看得见的范围**要数据，而不是拍脑袋跟 zoom 挂钩。
       *  为什么：zoom 15.2 在手机横屏上其实能看到 4km 宽，"取 400m"必然大半屏是空的
       *  —— 这正是 HUD 常显示"🏢 0"的成因之一。 */
      function radiusForView() {
        const b = map.getBounds();
        const c = map.getCenter();
        const dLng = Math.abs(b.getEast() - b.getWest()) / 2;
        const dLat = Math.abs(b.getNorth() - b.getSouth()) / 2;
        const mx = dLng * 111320 * Math.cos((c.lat * Math.PI) / 180);
        const my = dLat * 110540;
        /* 起点半径按视野算，**上限放到 2000**：稀疏地段（涪陵）只有放大半径才取得到楼，
           而密集地段（渝中）在第一级就够 25 栋停下了，走不到上限 ⇒ 只帮稀疏区。 */
        return Math.max(350, Math.min(2000, Math.round(Math.hypot(mx, my) * 0.95 / 50) * 50));
      }

      async function fetchBuildings(r) {
        const c = map.getCenter();
        const url = `${API}/api/buildings?lat=${c.lat.toFixed(5)}&lng=${c.lng.toFixed(5)}&r=${r}`;
        const res = await fetch(url);
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || "ok=false");
        return body.geojson;
      }

      /** 取楼：数据太少就**自动放大**再取，命中即停（涪陵那种地方 400m 是 0 栋，不放大学不到东西）。
       *  ⚠️ 上限 2000m（2026-09-20 从 1200 放宽）：实测涪陵驻地 1000m→21 栋、1400m→29 栋，
       *     再大（2500m）会整条查询失败；而密集区（渝中）**早就在第一级就够 25 栋停下**，
       *     根本走不到这一级 ⇒ 放宽上限是**只帮稀疏区、不伤密集区**的改法。 */
      const R_MAX = 2000;
      async function loadForView() {
        const r0 = radiusForView();
        const ladder = [r0];
        while (ladder[ladder.length - 1] < R_MAX) ladder.push(Math.min(R_MAX, ladder[ladder.length - 1] * 2));
        let best = { fc: { features: [] }, r: 0 };
        for (const r of ladder) {
          $("m-msg").textContent = `取楼中… ${r}m`;
          try {
            const fc = await fetchBuildings(r);
            if ((fc.features || []).length > (best.fc.features || []).length) best = { fc, r };
            if ((fc.features || []).length >= 25) break; // 够看了，别再花时间
          } catch { /* 这一级失败就试下一级，不因为一次失败放弃整屏 */ }
        }
        return best;
      }

      /**
       * 等**楼真的到齐**再按快门。
       *
       * 🔴 2026-09-20 机主那三张真机图就是这么废掉的：底图、路名、江面都在，
       * **一栋楼都没有** —— 因为快门在开图约 4 秒后就按了，
       * 而 `/api/buildings` 是**现问 Overpass**的（冷查询二十几秒起，最慢见过 91.7s）。
       * ⇒ 拍出来的永远是"楼还没到"的那一帧，而这个现象**看起来像"这一带没有楼"**，
       *   会把"还没到"误判成"没有数据"，白跑一轮。
       */
      function waitForBuildings(maxMs) {
        return new Promise((res) => {
          const t0 = Date.now();
          const iv = setInterval(() => {
            const waited = Math.round((Date.now() - t0) / 1000);
            $("m-msg").textContent = `等楼栋到齐… 已等 ${waited}s（现在 ${stats.n} 栋 / ${stats.r}m）`;
            if (stats.n > 0 || Date.now() - t0 > maxMs) {
              clearInterval(iv);
              res(stats.n);
            }
          }, 500);
        });
      }

      function applyBuildings(fc, r) {
        const feats = (fc.features || []).map((f) => {
          const [h, src] = renderHeight(f.properties || {});
          return { ...f, properties: { ...f.properties, h3d: h, h_from: src } };
        });
        window.__LASTFC__ = fc; // 🚌 `?tf=1` 要用楼栋轮廓（停车场/出入口按脚印算）
        stats.n = feats.length; stats.r = r;
        stats.real = feats.filter((f) => f.properties.h_from === "real").length;
        stats.levels = feats.filter((f) => f.properties.h_from === "levels").length;
        stats.kind = feats.filter((f) => f.properties.h_from === "kind").length;
        $("m-n").textContent = String(stats.n);
        $("m-h").textContent = String(stats.real);
        $("m-l").textContent = String(stats.levels);
        $("m-e").textContent = String(stats.kind);
        $("m-r").textContent = String(r);
        $("m-msg").textContent = stats.n ? "" : "这一带 OSM 没登记楼房";
        const data = { type: "FeatureCollection", features: feats };
        fcCache = data;
        if (map.getSource("bld")) map.getSource("bld").setData(data);
        else { map.addSource("bld", { type: "geojson", data }); addBldLayers(); }
      }

      function addBldLayers() {
        /* 插在注记层之前 ⇒ 街名压在楼上面 */
        const before = map.getLayer("ref") ? "ref" : undefined;
        for (const l of bldLayerSpecs()) if (!map.getLayer(l.id)) map.addLayer(l, before);
      }

      void (async () => {
        try { const mod = await import(/* @vite-ignore */ "/vendor/maplibre/maplibre-gl.mjs"); maplibregl = mod?.default || mod; }
        catch (e) { errs.push("模块加载失败 " + e); return fail("地图库加载失败"); }
        if (!maplibregl?.Map) return fail("地图库形状不对");
        if (!hasWebGL()) return fail("这台设备没有 WebGL");
        /* 主题必须在**建图之前**拿到 —— style 是一次性传进去的（换主题要重建 sources/layers） */
        await loadTheme();

        map = new maplibregl.Map({
          container: "map", style: makeStyle(),
          center: [SPOT.lng, SPOT.lat],
          /* 🎨 2026-09-20 机主要"**看得见天空（基沃托斯的天空）**"：
             58° 是俯视看楼的角度，天际线以上全在画面外 ⇒ 降到 38° 把地平线和天空收进来。
             `maxPitch: 85` 必须显式写：MapLibre 默认上限只有 **60°**，不放开就抬不起头。 */
          zoom: 16.4, pitch: 38, bearing: -18, maxPitch: 70,
          attributionControl: false, fadeDuration: 120,
          preserveDrawingBuffer: true, // 截图用（无头/代拍都要它）
        });
        window.__w3d = { ok: true, map, stats, probe: () => probe(), spot: SPOT };
        map.on("error", (e) => errs.push(String(e?.error?.message || e)));

        let busy = false;
        map.on("load", async () => {
          await refresh();
          /* 🎨 回证表要在**楼体图层加完之后**读（`bld-line` 是 addLayer 加的）⇒ 放在 refresh 之后 */
          renderArtBadge();
          /* 🛣 路网先画（**在最下**），交通设施后画（**贴在路之上**） */
          if (ROADSON) { try { await applyRoads(); } catch (e) { errs.push("applyRoads " + e); } }
          /* 🚌 `?tf=1`：楼到齐之后再摆交通设施（要用到楼栋轮廓） */
          if (TFON) { try { await applyTransport(window.__LASTFC__ || { features: [] }); } catch (e) { errs.push("transport " + e); } }
          /* 🔴 顺序**以事后断言为准**（机主真机回归：?tf=1 时路网不见了 ⇒ 不靠"先插的那一次"） */
          ensureRoadOrder();
          window.__ROAD_HEALS__ = roadHeals;
          window.__w3d.ready = true;
        });
        map.on("moveend", () => { if (window.__w3d.ready) void refresh(); });
        /* 🔴 侧视角护栏：pitch 一变就重算阻尼（拖动速度/滚轮速率），并刷新 HUD 上的自证数字 */
        try {
          map.on("pitch", applyPitchGuard);
          applyPitchGuard();
          applyPitchGuard(); // 再调一次：第一次可能在样式就绪前（`dragPan` 还没挂）
        } catch (e) { errs.push("pitchGuard " + e); }

        async function refresh() {
          if (busy) return; busy = true;
          const z = map.getZoom();
          $("m-z").textContent = z.toFixed(1);
          try {
            if (z < 12.5) { $("m-msg").textContent = "太远了不取楼（放大到街区）"; }
            else { const { fc, r } = await loadForView(); applyBuildings(fc, r); }
          } catch (e) { errs.push("buildings " + e); $("m-msg").textContent = "取楼失败：" + String(e).slice(0, 40); }
          busy = false;
        }

        /* FPS（滚动 1 秒窗口，与项目其它地方同口径） */
        let last = performance.now(), frames = 0, win = 0;
        (function tick(now) {
          const dt = now - last; last = now; frames++; win += dt;
          if (win >= 1000) { $("m-fps").textContent = String(Math.round((frames * 1000) / win)); frames = 0; win = 0; }
          requestAnimationFrame(tick);
        })(performance.now());

        /* 两个档位就是"一近一远"两张证据图的机位 */
        $("b-near").onclick = () => { map.easeTo({ zoom: 17.4, pitch: 50, duration: 600 }); };
        /* 「远」= 看天空/地平线的机位（和代拍第二张同角度，手点/代拍可比对） */
        $("b-far").onclick = () => { map.easeTo({ zoom: 14.6, pitch: 26, duration: 600 }); };
        $("b-spin").onclick = () => { map.easeTo({ bearing: map.getBearing() - 45, duration: 600 }); };
        /* 「星」：z16 以上到底用卫星影像还是把暗色底放大。
           留这个按钮是因为"哪个更好看"**只能看真机图**决定 ——
           而卫星是白天的亮照片，压暗过头会太黑、压不够会比楼还亮（楼就"消失"了）。 */
        let satOn = true;
        /* 🛰 「星」按钮只管**卫星高分层**。⚠️ 二次元主题**根本没有 hi 层**
           （卫星=写实，与平涂冲突，见 `wsMapTheme.ts`）⇒ 这个按钮在二次元下应当
           **如实禁用**，而不是"点了没反应"（点了没反应最容易被当成 bug 反复点）。 */
        const hasHi = !!map.getLayer("hi");
        const applySat = () => {
          try { map.setLayoutProperty("hi", "visibility", satOn ? "visible" : "none"); } catch { /* 图层还没建好 */ }
          const b = $("b-sat");
          if (b) {
            b.classList.toggle("on", satOn && hasHi);
            b.disabled = !hasHi;
            b.title = hasHi
              ? "切换 z16 以上的底：卫星影像 / 暗色底放大"
              : "二次元主题没有卫星层（卫星=写实，和「平涂」冲突）";
          }
        };
        $("b-sat").onclick = () => { satOn = !satOn; applySat(); };
        applySat();

        /* ── 代拍：`?autoshot=1` 时页面**自己**拍三张回传 ────────────────────────
           为什么由页面拍：agent 侧看不到 WebGL，机主又禁了 ADB 截屏（会看到整屏隐私）。
           收图服务：`~/chk/shotd.py`（127.0.0.1:8789），落盘 `~/chk/live/*.png`。
           三张 = 一近（看楼体）/ 一远（看整片）/ 一侧（看高低起伏）。

           🔴 2026-09-19：这一版加了**空白自检**。上一版拍了三张**纯白**图回去
           （实际是 alpha=0 全透明：样式校验失败 ⇒ `load` 从没触发 ⇒ 一帧都没画，
           而 `toDataURL` 和 POST **全部成功**）。⇒ 空白必须自己判出来，并回传**诊断图**。 */
        async function settle() {
          await new Promise((res) => {
            let d = false;
            const fin = () => { if (!d) { d = true; res(); } };
            try { map.once("idle", fin); } catch { /* 没有 idle 就直接走 */ }
            setTimeout(fin, 5000);
          });
          // WebGL 双缓冲：只等 idle 可能拿到还没提交的那一帧 ⇒ 再等两帧 rAF
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
          await new Promise((r) => setTimeout(r, 700));
        }

        /** 画布空白判定（缩到 8×8 采样：全透明 / 近乎单色 = 没内容） */
        function blankReason(cv) {
          const s = 8, t = document.createElement("canvas");
          t.width = s; t.height = s;
          const g = t.getContext("2d");
          if (!g) return null;
          g.drawImage(cv, 0, 0, s, s);
          const d = g.getImageData(0, 0, s, s).data;
          let mn = 255, mx = 0, aMax = 0;
          for (let i = 0; i < d.length; i += 4) {
            aMax = Math.max(aMax, d[i + 3]);;
            for (let k = 0; k < 3; k++) { mn = Math.min(mn, d[i + k]); mx = Math.max(mx, d[i + k]); }
          }
          if (aMax === 0) return "整张画布 alpha=0（一帧都没渲染过）";
          if (mx - mn < 4) return `近乎单色（RGB 极差 ${mx - mn}，最大 alpha ${aMax}）⇒ 疑似空白/纯色`;
          return null;
        }

        /** 空白时把状态画成一张图回传 —— 让 agent 一眼看出卡在哪一步 */
        function diagPng(lines) {
          const w = 900, h = Math.max(200, 46 + lines.length * 30);
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const g = c.getContext("2d");
          g.fillStyle = "#0b1017"; g.fillRect(0, 0, w, h);
          g.fillStyle = "#79d9ff"; g.font = "bold 22px monospace";
          g.fillText("代拍空白 · 诊断", 18, 34);
          g.font = "17px monospace";
          lines.forEach((s, i) => { g.fillStyle = i === 0 ? "#ffcf8a" : "#eaf6ff"; g.fillText(String(s).slice(0, 78), 18, 68 + i * 30); });
          return c.toDataURL("image/png");
        }

        /**
         * 在**渲染完成的那一刻**抓帧。
         * 为什么：Android 上 WebGL 画布在 `idle` + 两帧 rAF + 700ms 之后，缓冲区
         * 往往已经被清空/未提交 ⇒ `toDataURL` 拿到全透明（而尺寸完全正常，极难发现）。
         * 做法：先 `triggerRepaint()`，然后在 `render` 回调里**立刻**抓；连抓两帧取"非空"的那张。
         */
        function captureOnRender() {
          return new Promise((res) => {
            let done = false;
            const fin = (v) => { if (!done) { done = true; try { map.off("render", onR); } catch { /* 忽略 */ } res(v); } };
            const onR = () => {
              try {
                const url = map.getCanvas().toDataURL("image/png");
                fin(url);
              } catch (e) { fin(null); }
            };
            try { map.on("render", onR); } catch { /* 没有 render 就直接退 */ }
            try { map.triggerRepaint(); } catch { /* 忽略 */ }
            setTimeout(() => fin(null), 5000);
          });
        }

        /**
         * 对**抓到的这张 PNG 本身**判空白（解码回来缩到 8×8 采样）。
         *
         * 为什么不用 `blankReason(canvas)` 那一版：它采样的是**活的画布**，
         * 而"画布上有内容"和"`toDataURL` 导出的是什么"**可能不是同一帧** ——
         * 机主 2026-09-20 那次就是活画布看着正常、导出的 PNG 全透明，自检漏判、
         * 三张白图照发。判据要落在**真正要发出去的那串字节**上。
         *
         * 覆盖三种空白：全透明（alpha=0）／不透明纯色／近乎单色。
         */
        function blankOfPng(dataUrl) {
          return new Promise((res) => {
            if (!dataUrl || !dataUrl.startsWith("data:image/png")) return res("抓帧失败（没拿到 PNG）");
            const img = new Image();
            img.onerror = () => res("抓到的数据不是能解码的 PNG");
            img.onload = () => {
              try {
                const s = 8, t = document.createElement("canvas");
                t.width = s; t.height = s;
                const g = t.getContext("2d");
                if (!g) return res(null);
                g.drawImage(img, 0, 0, s, s);
                const d = g.getImageData(0, 0, s, s).data;
                let mn = 255, mx = 0, aMax = 0, aMin = 255;
                for (let i = 0; i < d.length; i += 4) {
                  aMax = Math.max(aMax, d[i + 3]); aMin = Math.min(aMin, d[i + 3]);
                  for (let k = 0; k < 3; k++) { mn = Math.min(mn, d[i + k]); mx = Math.max(mx, d[i + k]); }
                }
                if (aMax === 0) return res("整张 alpha=0（一帧都没渲染过）");
                if (mx - mn < 4 && aMax - aMin < 4) {
                  const hex = "#" + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
                  return res(`近乎单色 ${hex}（RGB 极差 ${mx - mn}，alpha ${aMin}~${aMax}）`);
                }
                return res(null);
              } catch (e) {
                return res(`解码/采样失败：${e?.name || e}`);
              }
            };
            img.src = dataUrl;
          });
        }

        async function post(dataUrl, name) {
          const blob = await (await fetch(dataUrl)).blob();
          const r = await fetch(`http://127.0.0.1:8789/shot?name=${encodeURIComponent(name)}`, {
            method: "POST", headers: { "content-type": "image/png" }, body: blob,
          });
          return r.ok;
        }

        async function autoshot() {
          const snap = async (name) => {
            const cv = map.getCanvas();
            /* ① **先抓帧**：在 `render` 的那一刻抓 —— Android 上 `idle`+两帧 rAF 之后
               WebGL 缓冲区常常已经被清空/未提交，那时再 `toDataURL` 只会拿到全透明。
               抓不到就退回直接 `toDataURL`（两条都失败 ⇒ 交给你下面当空白处理）。 */
            let shot = await captureOnRender();
            if (!shot) {
              try { shot = cv.toDataURL("image/png"); } catch { shot = ""; }
            }
            /* ② **拿抓到的这张图本身**判空白 —— 不是去采样"活的画布"。
               为什么（2026-09-20 机主那次白拍的教训）：活画布和 `toDataURL` 的结果
               **可能不是同一帧** ⇒ 采样活画布说"有内容"、导出来却是全透明，自检直接漏判。 */
            const why = await blankOfPng(shot);
            if (why) {
              /* 绝**不**把空白当成功 —— 回传诊断图，让 agent 知道卡在哪、**是哪一版代码在跑** */
              await post(diagPng([
                `构建=${BUILD} 空白=${why}`,
                `样式已加载=${map.isStyleLoaded()} 地图loaded=${map.loaded()}`,
                `画布=${cv.width}x${cv.height} zoom=${map.getZoom().toFixed(2)} pitch=${Math.round(map.getPitch())}`,
                `图层=${(map.getStyle()?.layers || []).map((l) => l.id).join(",") || "(空!)"}`,
                `取楼=${stats.n} 栋 半径=${stats.r}m errs=${errs.slice(0, 1).join("") || "无"}`,
              ]), name + "-DIAG");
              $("m-msg").textContent = `代拍空白：${why}（已回传诊断图）`;
              return false;
            }
            const ok = await post(shot, name);
            $("m-msg").textContent = `代拍 ${name}：${ok ? "已回传" : "HTTP 失败"}`;
            return ok;
          };
          /* 🔴 **等楼到齐再按快门**（见 `waitForBuildings` 的说明）：
             以前 4 秒后就拍，而 Overpass 冷查询二十几秒 ⇒ 三张图全是"楼还没到"，
             看起来像"这一带没有楼"，白跑一轮。等不到（>100s）也照拍，
             但诊断/HUD 里会写明"0 栋"，不会假装成功。 */
          const n0 = await waitForBuildings(100000);
          $("m-msg").textContent = n0 > 0 ? `楼已到齐：${n0} 栋（${stats.r}m）⇒ 开始拍` : "等了 100s 仍是 0 栋 ⇒ 照拍（如实记录）";
          await settle();
          let ok = await snap("show-near");
          map.easeTo({ zoom: 15.0, pitch: 48, duration: 900 }); await settle();
          ok = (await snap("show-far")) || ok;
          map.easeTo({ zoom: 17.0, pitch: 62, bearing: -38, duration: 900 }); await settle();
          ok = (await snap("show-side")) || ok;
          /* 🔎 **同机位再拍一张"不用卫星"的**：机主 2026-09-20 的抱怨是"放大后糊+灰"，
             而"卫星压暗 vs 暗色底放大"哪个更好看**只能看图判断**。
             多拍这一张，机主点一次就能拿到 A/B 对比，不用来回两轮。 */
          map.easeTo({ zoom: 17.0, pitch: 62, bearing: -38, duration: 0 });
          satOn = false; applySat();
          await settle();
          ok = (await snap("show-side-nosat")) || ok;
          satOn = true; applySat();
          $("m-msg").textContent = ok ? "代拍完成：4 张已回传 ~/chk/live/" : $("m-msg").textContent;
          try { localStorage.removeItem("wsm:v1:autoshot"); } catch {}
        }
        try {
          if (/[?&]autoshot=1\b/.test(location.search)) localStorage.setItem("wsm:v1:autoshot", String(Date.now()));
          if (localStorage.getItem("wsm:v1:autoshot")) void autoshot();
        } catch { /* 隐私模式读不到 localStorage 就不代拍，页面照常用 */ }
      })();

      function probe() {
        const ls = (map?.getStyle()?.layers || []).map((l) => l.id);
        return {
          ok: !!map, zoom: +(map?.getZoom() || 0).toFixed(2), pitch: Math.round(map?.getPitch() || 0),
          center: [+(map?.getCenter().lng || 0).toFixed(4), +(map?.getCenter().lat || 0).toFixed(4)],
          layers: ls, ...stats, fps: Number($("m-fps").textContent) || null,
          /* 🎨 art 变体自证：档位 + 回证表（"改了到底生效没有"由它回答） */
          art: ART, artPatch: window.__ART_CHANGED__, artReadback: artReadback(),
          /* 🛣 路网计数（与 App 的 `🛣 N` 同一算法 `visibleRoadCount`）+ 交通设施回证 */
          roads: (typeof window.__ROAD_N__ === "number" ? window.__ROAD_N__ : null),
          roadAudit: window.__ROAD_AUDIT__ || null,
