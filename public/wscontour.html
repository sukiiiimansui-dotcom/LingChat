<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>世界模拟 · 真等高线（Terrarium DEM）</title>
    <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />
    <style>
      /* 与 LingChat 同一套语言：深色 + 冰蓝单主色 + 无边框玻璃 */
      :root {
        --accent-color: #79d9ff;
        --glass: rgba(10, 16, 24, 0.58);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1017;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        padding: 8px 10px;
        border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 12px;
        line-height: 1.5;
        z-index: 20;
      }
      #hud b {
        color: var(--accent-color);
        font-weight: 600;
      }
      #dock {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        display: flex;
        gap: 6px;
        z-index: 20;
      }
      #dock button {
        min-height: 44px;
        padding: 0 14px;
        border: none;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      #dock button.on {
        background: var(--accent-color);
        color: #06222e;
        font-weight: 600;
      }
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b1017;
        z-index: 40;
        text-align: center;
        line-height: 1.9;
        font-size: 14px;
      }
      #fallback.on {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="hud">
      <span>等高线 <b id="h-int">20</b> m</span>
      <span>高程 <b id="h-ele">—</b></span>
      <span>线段 <b id="h-feats">—</b></span>
      <span>DEM <b id="h-tile">—</b></span>
      <span>耗时 <b id="h-ms">—</b></span>
      <span id="h-note" style="opacity: 0.7"></span>
    </div>

    <div id="dock">
      <button type="button" data-int="10">10m</button>
      <button type="button" data-int="20" class="on">20m</button>
      <button type="button" data-int="50">50m</button>
      <button type="button" id="re">重画</button>
    </div>

    <div id="fallback">
      <div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 6px">等高线不可用</div>
        <div id="fb-why" style="opacity: 0.75">—</div>
        <div style="margin-top: 10px; opacity: 0.6; font-size: 12px">
          这一页**不画假数据**：取不到 DEM 就明说，而不是给你一条假等高线。
        </div>
      </div>
    </div>

    <script type="module">
      /* ══════════════════════════════════════════════════════════════════════════
         真等高线页（2026-09-19）

         机主原话：「地图的显示加载不出来**等高线**，只有白底」。
         查下来：**带等高线的公共地形瓦片源（opentopomap / Esri World_Topo / OSM 官方）
         从本机网络全部超时**，所以"拿一张现成地形图"这条路走不通 ⇒ 改成**自己算**：
         Terrarium DEM（`elevation-tiles-prod.s3.amazonaws.com`，实测 200/43KB/CORS 允许）
         → 解码 → marching squares（`src/composables/wsContour.ts`，自检 37/37）→ GeoJSON 线。

         地形图惯例：每 5 条一根**计曲线**（这里按整 100m 加粗提亮），其余首曲线细线。

         为什么这页在 `public/`：① 不经打包器（运行期动态 import 那个 composable 是 TS，
         必须由 vite dev 现编译，写进打包器会失败）；② 构建时原样拷进 `dist-webdev/`。
         ══════════════════════════════════════════════════════════════════════════ */
      const $ = (id) => document.getElementById(id);
      window.__ERRS__ = [];
      window.__PROBE__ = "booting";
      addEventListener("error", (e) => window.__ERRS__.push(String(e.message || e)));
      addEventListener("unhandledrejection", (e) => window.__ERRS__.push("rej: " + String((e.reason && e.reason.message) || e.reason)));

      const S = { interval: 20, ms: 0, feats: 0, eleMin: null, eleMax: null, tile: "—", note: "" };
      const say = (note) => {
        S.note = note;
        $("h-note").textContent = note;
      };
      const fail = (why) => {
        $("fb-why").textContent = why;
        $("fallback").classList.add("on");
        window.__PROBE__ = JSON.stringify({ ok: false, why: String(why).slice(0, 160) });
      };

      /* 底图：Carto 实测可达（0.57s）；等高线叠在底图之上、数据层之下 */
      const BASE_SRC = {
        type: "raster",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256,
        maxzoom: 20,
        attribution: "© OpenStreetMap contributors © CARTO · DEM: Mapzen Terrarium (AWS Open Data)",
      };
      const style = {
        version: 8,
        name: "ws-contour",
        sources: { base: BASE_SRC },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#0b1017" } },
          { id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.8 } },
        ],
      };

      /**
       * 底图自愈：本轮实测到 MapLibre 在**软件 WebGL / 上下文丢失**的环境里会把样式重置成
       * "只剩我们自己后加的那层"（探针实测 `srcIds:["contour"]`、`nLayers:1`，
       * 而底图瓦片此前明明抓了 24 张）。真机（有 GPU）不会这样，但**页面不该假设样式不会被重置**。
       */
      function ensureBase(map, styleReady, say) {
        if (!map || !styleReady) return;
        try {
          if (!map.getSource("base")) map.addSource("base", BASE_SRC);
          if (!map.getLayer("base")) {
            const ids = (map.getStyle()?.layers || []).map((l) => l.id);
            const first = ids.find((id) => id !== "bg" && id !== "base");
            map.addLayer({ id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.8 } }, first);
          }
        } catch (e) {
          say("底图重建失败：" + String((e && e.message) || e).slice(0, 40));
        }
      }

      /* composable 是 TS：① 同源 /src（页面开在 5210 时命中）
         → ② 5210 dev（页面开在 5212 预览时命中，dev 的 CORS 已放行）
         → ③ 都失败就**如实报**，不假装跑起来了。 */
      async function loadContourModule() {
        const cands = [
          "/src/composables/wsContour.ts",
          location.protocol + "//" + location.hostname + ":5210/src/composables/wsContour.ts",
        ];
        for (const u of cands) {
          try {
            const m = await import(/* @vite-ignore */ u);
            if (m && typeof m.readDemGrid === "function") return m;
          } catch (e) {
            say("模块候选失败：" + u.slice(0, 32));
          }
        }
        return null;
      }

      const mod = await loadContourModule();
      if (!mod) {
        fail("拿不到 wsContour.ts（需要 vite dev 在 5210 上跑；本页是 dev 页，依赖现编译）");
        throw new Error("no contour module");
      }

      const maplibregl = await (async () => {
        try {
          const m = await import(/* @vite-ignore */ "/vendor/maplibre/maplibre-gl.mjs");
          return m.default || m;
        } catch {
          return null;
        }
      })();
      if (!maplibregl?.Map) {
        fail("vendor/maplibre 缺失（public/vendor/maplibre/maplibre-gl.mjs）");
        throw new Error("no maplibre");
      }

      /* ⚠️ 先预检 WebGL 再建图：`new Map()` 在没有 WebGL 时**不一定抛**（可能异步失败），
         于是 `load` 永不触发 ⇒ 整条链卡死、页面白屏且不报错（本轮实测踩到，第二次探针停在 booting）。 */
      const webglOk = (() => {
        try {
          const t = document.createElement("canvas");
          return !!(t.getContext("webgl2") || t.getContext("webgl"));
        } catch {
          return false;
        }
      })();
      const map = (!webglOk
        ? null
        : (() => {
            try {
              return new maplibregl.Map({
                container: "map",
                style,
                center: [106.569, 29.558], // 重庆渝中区：山城，等高线好看且有真实地形起伏
                zoom: 12.2,
                pitch: 0,
                bearing: 0,
                attributionControl: false,
                preserveDrawingBuffer: true,
              });
            } catch (e) {
              say("地图库建图失败（无 WebGL）：仅计算并不显示 —— " + String((e && e.message) || e).slice(0, 40));
              return null;
            }
          })());
      const mapOk = !!map;
      let styleReady = false; // 只有 `load` 真触发过才允许碰 map 的源/层
      window.__map = map;
      /* 地图不可用时用默认中心（后面 moveend 只在有地图时更新它） */
      let center = { lng: 106.569, lat: 29.558 };

      let busy = false;
      async function drawContours() {
        if (busy) return;
        busy = true;
        try {
          if (mapOk && styleReady) {
            const c = map.getCenter();
            center = { lng: c.lng, lat: c.lat };
          }
          const z = mod.DEM_TILE_Z;
          const t = mod.lngLatToTile(center.lng, center.lat, z);
          const tx = Math.floor(t.x);
          const ty = Math.floor(t.y);
          S.tile = `z${z} ${tx}/${ty}`;
          const t0 = performance.now();
          let grid;
          try {
            grid = await mod.readDemGrid(mod.demTileUrl(z, tx, ty));
          } catch (e) {
            say("DEM 取不到：" + String((e && e.message) || e).slice(0, 60));
            window.__PROBE__ = JSON.stringify({ ok: false, why: "dem fetch: " + String((e && e.message) || e).slice(0, 80) });
            return;
          }
          const feats = mod.tileContours({
            grid,
            w: mod.DEM_TILE_SIZE,
            h: mod.DEM_TILE_SIZE,
            z,
            tx,
            ty,
            interval: S.interval,
          });
          let lo = Infinity;
          let hi = -Infinity;
          for (const v of grid) {
            if (v < lo) lo = v;
            if (v > hi) hi = v;
          }
          S.eleMin = Math.round(lo);
          S.eleMax = Math.round(hi);
          S.feats = feats.length;
          S.ms = Math.round(performance.now() - t0);

          const fc = mod.contourFeatureCollection(feats);
          if (mapOk && styleReady) {
            const src = map.getSource("contour");
            if (src) {
              src.setData(fc);
            } else {
              map.addSource("contour", { type: "geojson", data: fc });
              /* 计曲线（整 100m）加粗提亮 —— 地形图惯例，一眼能读出"这是第几条" */
              map.addLayer({
                id: "contour",
                type: "line",
                source: "contour",
                paint: {
                  "line-color": [
                    "case",
                    ["==", ["%", ["get", "ele"], 100], 0],
                    "#ffd28a",
                    "rgba(121, 217, 255, 0.72)",
                  ],
                  "line-width": ["case", ["==", ["%", ["get", "ele"], 100], 0], 1.5, 0.7],
                  "line-opacity": 0.9,
                },
              });
            }
          }
          /* 每次都顺手把底图补回来（自愈；真机上是一次无副作用的检查） */
          ensureBase(map, styleReady, say);
          $("h-ele").textContent = `${S.eleMin}~${S.eleMax} m`;
          $("h-feats").textContent = String(S.feats);
          $("h-tile").textContent = S.tile;
          $("h-ms").textContent = `${S.ms} ms`;
          say("");
          window.__PROBE__ = JSON.stringify({
            ok: true,
            mapOk,
            interval: S.interval,
            eleMin: S.eleMin,
            eleMax: S.eleMax,
            feats: S.feats,
            demTile: S.tile,
            ms: S.ms,
            layers: mapOk && styleReady ? (map.getStyle()?.layers || []).map((l) => l.id) : null,
            /* 底图与瓦片的**独立证据**：`layers` 只说明样式表，这里说明"源真的建了、瓦片真的下了" */
            baseSrc: mapOk && styleReady ? !!map.getSource("base") : null,
            srcIds: mapOk && styleReady ? Object.keys(map.getStyle()?.sources || {}) : null,
            nLayers: mapOk && styleReady ? (map.getStyle()?.layers || []).length : null,
            tiles: performance
              .getEntriesByType("resource")
              .filter((e) => /arcgisonline|cartocdn|opentopomap/.test(e.name)).length,
          });
        } finally {
          busy = false;
        }
      }

      if (mapOk) {
        /* 两个时机都要接：`style.load`（样式解析完就能加源/层）比 `load`（首帧画完）**早得多**，
           在软件 WebGL 环境里 `load` 可能一直不来 —— 只挂 `load` 就等于"图层永远加不上"（本轮实测）。 */
        const onReady = (tag) => {
          if (!styleReady) say(`地图就绪（${tag}）`);
          styleReady = true;
          $("h-int").textContent = String(S.interval);
          void drawContours();
        };
        map.on("style.load", () => onReady("style.load"));
        map.on("load", () => onReady("load"));
        /* 看门狗：8s 还没 `load`（无 WebGL/样式卡住/上下文秒丢）⇒ 降级成"只算不画"并把原因说出来，
           绝不留下"白屏且什么都不说"这一种状态。 */
        setTimeout(() => {
          if (!styleReady) {
            say("地图 8s 未就绪（无 WebGL 或样式卡住）：仅计算等高线，不显示");
            void drawContours();
          }
        }, 8000);
        let deb = 0;
        map.on("moveend", () => {
          clearTimeout(deb);
          deb = setTimeout(() => void drawContours(), 400);
        });
      } else {
        /* 地图不可用也要把数据链跑一遍：这样"DEM→解码→等高线"能在无 WebGL 环境里被验证 */
        say("无 WebGL：仅计算等高线，不显示地图");
        $("h-int").textContent = String(S.interval);
        void drawContours();
      }

      for (const b of document.querySelectorAll("#dock button[data-int]")) {
        b.addEventListener("click", () => {
          for (const x of document.querySelectorAll("#dock button[data-int]")) x.classList.remove("on");
          b.classList.add("on");
          S.interval = Number(b.dataset.int);
          $("h-int").textContent = String(S.interval);
          void drawContours();
        });
      }
      $("re").addEventListener("click", () => void drawContours());
    </script>
  </body>
</html>
