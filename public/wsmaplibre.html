<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>P0 技术验证 · MapLibre 吃我们的 GeoJSON（相机 / 2.5D / 回退）</title>
    <style>
      /* 语言对齐 LingChat：深色 + 冰蓝单主色 + 无边框玻璃。这一页只验技术，不做皮肤。 */
      @font-face {
        font-family: "Maoken Assorted Sans";
        src: url("/fonts/MaokenAssortedSans.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        --accent-color: #79d9ff;
        --glass: rgba(10, 16, 24, 0.58);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1017; }
      body {
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      #map { position: fixed; inset: 0; }
      /* 面板：只显示"待验证的指标"，验完就删 */
      .p {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
        display: flex; flex-wrap: wrap; gap: 6px 10px;
        padding: 8px 10px;
        border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        font-size: 12px;
        z-index: 20;
      }
      .p b { color: var(--accent-color); font-weight: 600; }
      .k { display: inline-flex; gap: 4px; align-items: baseline; }
      .ops {
        position: fixed;
        left: 50%; transform: translateX(-50%);
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        display: flex; gap: 6px; z-index: 20;
      }
      .ops button {
        min-height: 44px; padding: 0 14px;
        border: none; border-radius: 12px;
        background: var(--glass); color: #fff;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 13px; cursor: pointer;
      }
      .ops button.on { background: var(--accent-color); color: #06222e; font-weight: 600; }
      #fallback {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; padding: 24px;
        background: #0b1017; z-index: 40; text-align: center; line-height: 1.8;
      }
      #fallback.on { display: flex; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="p" id="panel">
      <span class="k">引擎 <b id="m-engine">—</b></span>
      <span class="k">要素 <b id="m-feats">—</b></span>
      <span class="k">加载 <b id="m-load">—</b></span>
      <span class="k">FPS <b id="m-fps">—</b></span>
      <span class="k">zoom <b id="m-zoom">—</b></span>
      <span class="k">pitch <b id="m-pitch">—</b></span>
      <span class="k">bearing <b id="m-bearing">—</b></span>
      <span class="k">帧均 <b id="m-frame">—</b> ms</span>
      <span class="k">错误 <b id="m-err">0</b></span>
    </div>

    <div class="ops">
      <button id="b-inertia">惯性缩放（连点放大 3 级）</button>
      <button id="b-3d">2.5D 倾斜</button>
      <button id="b-extrude">楼房挤出</button>
      <button id="b-rotate">旋转</button>
    </div>

    <div id="fallback">
      <div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 6px">WebGL 不可用 → 已回退</div>
        <div style="opacity: .72">
          这一页验证的就是这条：**没有 WebGL 时要能优雅回退**，<br />
          而不是白屏（我们在 SwiftShader 上被坑过一次）。
        </div>
      </div>
    </div>

    <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />

    <script type="module">
      /* ⚠️ 两条实测教训（都写下来免得后人再踩）：
         ① v6 是 **ESM-only**（没有 UMD，`<script src>` 引不了），而且它带 worker + 共享 chunk；
         ② 在 HTML 里写**静态** `import ... from "/vendor/..."` 会让 rollup 去解析这个路径并**构建失败**
            （`handleInvalidResolvedId`），所以这里用**运行时动态 import + `@vite-ignore`**：
            打包器完全不碰它，运行时按 URL 从 `public/vendor/maplibre/` 取。
         原型阶段**不碰项目包管理**：pnpm 在这台机器上装不了
         （`Cannot verify the identity of the @pnpm/exe.android-arm64 native binary`）。 */
      let maplibregl = null;

      const API = "http://127.0.0.1:8791";
      const $ = (id) => document.getElementById(id);
      const errs = [];
      window.addEventListener("error", (e) => {
        errs.push(String(e.message || e));
        $("m-err").textContent = String(errs.length);
      });

      /* ── ① WebGL 预检：没有就**显示回退说明**，不白屏（P0 的验证点之一）── */
      function hasWebGL() {
        try {
          const c = document.createElement("canvas");
          return !!(c.getContext("webgl2") || c.getContext("webgl"));
        } catch {
          return false;
        }
      }
      function showFallback(reason) {
        $("fallback").classList.add("on");
        window.__wsml = { ok: false, reason };
      }

      void (async () => {
        try {
          const mod = await import(/* @vite-ignore */ "/vendor/maplibre/maplibre-gl.mjs");
          maplibregl = mod?.default || mod;
        } catch (e) {
          errs.push("模块加载失败: " + e);
          showFallback("module-load-failed");
          return;
        }
        if (!maplibregl?.Map) {
          showFallback("module-shape-unexpected");
          return;
        }
        if (!hasWebGL()) {
          showFallback("no-webgl");
          return;
        }
        boot();
      })();

      function boot() {
        const t0 = performance.now();
        /* ── ② 样式：**不依赖任何瓦片服务器** —— 背景/边界/挤出全用我们自己的数据 ── */
        const style = {
          version: 8,
          name: "ws-p0",
          /* 🔴 2026-09-19 机主报「地图只有白底、加载不出等高线」——根因是这里 `sources: {}`
             ⇒ 样式里**一张瓦片都没有**，渲染出来只有背景色。现在接真底图。
             可达性实测（本机网络，同一时刻）：Carto ✅ 0.57s / OSM 镜像 ✅ 2.2s /
             tile.openstreetmap.org ❌ 超时 / opentopomap（**带等高线**）❌ 超时 / Esri 地形 ❌ 超时。
             ⇒ 先用**实测能取到**的 Carto；等高线那几家等找到可通源再补（别写上去装能取到）。 */
          sources: {
            base: {
              type: "raster",
              tiles: [
                "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
              ],
              tileSize: 256,
              maxzoom: 20,
              attribution: "© OpenStreetMap contributors © CARTO",
            },
          },
          layers: [
            { id: "bg", type: "background", paint: { "background-color": "#0b1017" } },
            /* 底图在背景之上、我们自己的数据层之下（数据层不能被底图盖住） */
            { id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.9 } },
          ],
          /* ⚠️ **不要写 `glyphs: undefined`** —— MapLibre 的样式校验会直接报
             `glyphs: string expected, undefined found`，然后**样式永远加载不完**：
             `load` 事件不触发 → 没有图层、没有 FPS、面板全是"—"、而页面**零报错**。
             （这是我实测踩到的，最难查的一类：不写就不报错，写了才炸且只在内部记录。） */
        };
        const map = new maplibregl.Map({
          container: "map",
          style,
          center: [104, 35],
          zoom: 3.2,
          pitch: 0,
          bearing: 0,
          attributionControl: false,
          // 手感：这些是"像高德"的关键，全部是成熟库自带
          dragRotate: true,
          pitchWithRotate: true,
          touchZoomRotate: true,
          fadeDuration: 120,
          /* ⚠️ **必须开**：WebGL canvas 默认 `preserveDrawingBuffer: false`，
             于是**无头截图拍到的是空白**（我第一张截图就是白的，而页面上其实是好的）——
             与 Pixi 那次的坑同源。真机不受影响，验证链路必须开。 */
          preserveDrawingBuffer: true,
        });
        window.__wsml = { ok: true, map, errs, metrics: {} };

        map.on("error", (e) => {
          errs.push(String(e?.error?.message || e));
          $("m-err").textContent = String(errs.length);
        });

        /* 我们的全国 GeoJSON 直接当 source（不需要瓦片服务器） */
        const url = `${API}/api/geo_json?ad=100000`;
        map.on("load", async () => {
          const t1 = performance.now();
          try {
            const fc = await fetch(url).then((r) => r.json());
            const feats = (fc.features || []).length;
            $("m-feats").textContent = String(feats);
            map.addSource("cn", { type: "geojson", data: fc });
            // 陆地填充（第 4 层：最低对比）
            map.addLayer({
              id: "cn-fill",
              type: "fill",
              source: "cn",
              paint: { "fill-color": "#1e2937", "fill-opacity": 1 },
            });
            // 行政边界（第 3 层）
            map.addLayer({
              id: "cn-line",
              type: "line",
              source: "cn",
              paint: { "line-color": "rgba(255,255,255,0.32)", "line-width": 0.8 },
            });
            // ②b 2.5D 挤出：先用**省级面**演示管线（真实楼房要 OSM building:levels，见下）
            map.addLayer({
              id: "cn-extrude",
              type: "fill-extrusion",
              source: "cn",
              layout: { visibility: "none" },
              paint: {
                "fill-extrusion-color": "#2f4a63",
                "fill-extrusion-height": ["*", 12, ["+", 1, ["coalesce", ["get", "childrenNum"], 1]]],
                "fill-extrusion-base": 0,
                "fill-extrusion-opacity": 0.92,
              },
            });
            $("m-load").textContent = `${Math.round(performance.now() - t1)} ms`;
            $("m-engine").textContent = "maplibre " + (maplibregl.getVersion?.() || "?");
            window.__wsml.metrics.loaded = true;
          } catch (e) {
            errs.push("geojson: " + e);
            $("m-err").textContent = String(errs.length);
          }
        });

        /* ── ③ FPS 采样（滚动 1 秒窗口，和主项目同一口径）── */
        let last = performance.now();
        let frames = 0;
        let acc = 0;
        let win = 0;
        function tick(now) {
          const dt = now - last;
          last = now;
          frames++;
          acc += dt;
          win += dt;
          if (win >= 1000) {
            $("m-fps").textContent = String(Math.round((frames * 1000) / win));
            $("m-frame").textContent = (acc / frames).toFixed(1);
            if (window.__wsml) {
              window.__wsml.metrics.fps = Math.round((frames * 1000) / win);
              window.__wsml.metrics.frameMs = +(acc / frames).toFixed(2);
            }
            frames = 0;
            acc = 0;
            win = 0;
          }
          const c = map.getCenter();
          $("m-zoom").textContent = map.getZoom().toFixed(2);
          $("m-pitch").textContent = String(Math.round(map.getPitch()));
          $("m-bearing").textContent = String(Math.round(map.getBearing()));
          requestAnimationFrame(tick);
        }
        map.once("load", () => requestAnimationFrame(tick));

        /* ── ④ 四个按钮，逐个验"成熟库是否原生给"── */
        $("b-inertia").onclick = () => {
          // 连点放大：MapLibre 的 zoomTo 自带缓动与惯性，我们不用写一行动画
          const z = map.getZoom();
          for (let i = 1; i <= 3; i++) {
            setTimeout(() => map.easeTo({ zoom: z + i, duration: 420, easing: (t) => 1 - Math.pow(1 - t, 3) }), i * 90);
          }
        };
        $("b-3d").onclick = (e) => {
          const on = map.getPitch() < 5;
          map.easeTo({ pitch: on ? 55 : 0, duration: 500 });
          e.currentTarget.classList.toggle("on", on);
        };
        $("b-extrude").onclick = (e) => {
          const on = map.getLayer("cn-extrude") && map.getLayoutProperty("cn-extrude", "visibility") === "none";
          if (map.getLayer("cn-extrude")) map.setLayoutProperty("cn-extrude", "visibility", on ? "visible" : "none");
          e.currentTarget.classList.toggle("on", !!on);
        };
        $("b-rotate").onclick = (e) => {
          const on = Math.abs(map.getBearing()) < 5;
          map.easeTo({ bearing: on ? 35 : 0, duration: 500 });
          e.currentTarget.classList.toggle("on", on);
        };

        /* 自动化验证用：把关键指标暴露出来（与项目里 verify-window 的采样脚本对接） */
        window.__wsml.probe = () => ({
          ok: true,
          zoom: +map.getZoom().toFixed(2),
          pitch: Math.round(map.getPitch()),
          bearing: Math.round(map.getBearing()),
          // ⚠️ 样式没加载完时 `getStyle()` 是 undefined（我自己第一次采样就踩了）
          layers: (map.getStyle()?.layers || []).map((l) => l.id),
          feats: map.getSource("cn") ? map.querySourceFeatures("cn").length : 0,
          fps: window.__wsml.metrics.fps ?? null,
          frameMs: window.__wsml.metrics.frameMs ?? null,
          errs: errs.slice(0, 5),
        });
      }
    </script>
  </body>
</html>
