<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>P1a · MapLibre 底图引擎（独立驱动 useWsMapLibre）</title>
    <style>
      /* 语言对齐 LingChat：深色 + 冰蓝单主色 + 无边框玻璃。 */
      @font-face {
        font-family: "Maoken Assorted Sans";
        src: url("/fonts/MaokenAssortedSans.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        --accent-color: #79d9ff;
        --glass: rgba(10, 16, 24, 0.58);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1017; }
      body {
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }

      #stage { position: fixed; inset: 0; }

      /* 旧路（Canvas2D）的占位画布：**故意**做得很显眼 ——
         引擎就绪后它必须被隐藏，失败/超时则必须原样放回来（回退硬要求）。 */
      #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

      /* ① 顶栏（= 真页面顶栏的footprint：top 8 + 高 44 → 占 52px，正好等于
            useWsMapLibre 的默认 fitPadding.top）。这一条里放指标，不额外盖地图。 */
      #topbar {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
        height: 44px;
        display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden;
        gap: 4px 9px;
        padding: 0 10px;
        border-radius: 16px;
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        z-index: 20;
        white-space: nowrap;
      }
      #topbar .k { display: inline-flex; gap: 4px; align-items: baseline; }
      #topbar b { color: var(--accent-color); font-weight: 600; }
      #topbar .drive { margin-left: auto; opacity: 0.72; font-size: 11px; }

      /* ② 底部动作条（= 真页面 .ws-foot 的 footprint：高 72 + bottom 12 → 占 84px，
            默认 fitPadding.bottom = 96 应把它整个让开）。 */
      #dock {
        position: fixed;
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        height: 72px;
        display: flex; align-items: center; gap: 8px;
        padding: 0 12px;
        border-radius: 18px;
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        z-index: 20;
        font-size: 12px;
        opacity: 0.94;
      }
      #dock .pill {
        min-height: 44px; padding: 0 14px;
        display: inline-flex; align-items: center;
        border-radius: 12px; background: rgba(255, 255, 255, 0.08);
      }
      #dock .pill.on { background: var(--accent-color); color: #06222e; font-weight: 600; }

      /* ③ 引擎不可用时的**显式回退说明**（不白屏、不假装）：把 err 原文贴出来 */
      #fallback {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; padding: 24px;
        background: #0b1017; z-index: 40; text-align: center; line-height: 1.9;
      }
      #fallback.on { display: flex; }
      #fallback code { color: var(--accent-color); font-size: 12px; word-break: break-all; }
    </style>
  </head>
  <body>
    <!-- 舞台：与 WorldSim 的 `.ws-geo` 同构 —— 旧画布 + （运行期插入的）新引擎容器 -->
    <div id="stage">
      <canvas id="cv"></canvas>
    </div>

    <div id="topbar">
      <span class="k">引擎 <b id="m-engine">—</b></span>
      <span class="k">要素 <b id="m-feats">—</b></span>
      <span class="k">加载 <b id="m-load">—</b></span>
      <span class="k">FPS <b id="m-fps">—</b></span>
      <span class="k">帧均 <b id="m-frame">—</b>ms</span>
      <span class="k">pitch <b id="m-pitch">—</b></span>
      <span class="k">bearing <b id="m-bearing">—</b></span>
      <span class="k">错误 <b id="m-err">0</b></span>
      <span class="drive" id="m-drive">driver: —</span>
    </div>

    <div id="dock">
      <span class="pill" id="d-ad">adcode 100000</span>
      <span class="pill" id="d-ok">ok —</span>
      <span class="pill" id="d-cv">旧 canvas —</span>
    </div>

    <div id="fallback">
      <div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 6px">
          MapLibre 引擎不可用 → 已回退旧路（Canvas2D / 后端 SVG）
        </div>
        <div style="opacity: 0.72">这正是必须成立的性质：新引擎坏掉时**地图不能消失**。</div>
        <div style="margin-top: 10px">原因：<code id="fb-why">—</code></div>
      </div>
    </div>

    <script type="module">
      /* ══════════════════════════════════════════════════════════════════════════
         这一页是 **P1a 的独立驱动器**：不经过 `WorldSim.vue`，直接驱动
         `useWsMapLibre` 渲染全国 GeoJSON，并把关键指标挂到 `window.__wsml` 供采样脚本读。

         ── 为什么放在 `public/` 里 ────────────────────────────────────────────
         ① `public/` 的文件**不经打包器**：这一页里有运行期动态 import，不会被 rollup 解析
            （踩过的坑：在 HTML/入口里写静态 `import ... from "/vendor/..."` → 构建失败）；
         ② 构建时 `public/` 原样拷进 `dist-webdev/`，5212 预览里直接能开。

         ── 为什么 composable 要从 5210 取（driver 那一栏会写实际走了哪条）────────
         本页是 `.html`，浏览器不认 TS；`useWsMapLibre.ts` 必须由 **vite dev**（5210）
         现编译。所以加载链是：① 同源 `/src/...`（页面开在 5210 时命中）
         → ② `http://127.0.0.1:5210/src/...`（页面开在 5212 预览时命中，dev server 的 CORS 已放行）
         → ③ 都失败就**如实报** `driver=unavailable`，绝不假装跑起来了。
         ⚠️ 路径是 `src/composables/useWsMapLibre.ts`（与它要逐项对应的 `useWsGeoStage.ts`
         同目录）。**路径写错的表现极坑**（我踩了，机主抓到的）：dev server 对**不存在的
         /src 路径**回的是 SPA 兜底的 `index.html`（200 + `text/html` + 1.2KB），
         浏览器只报 `Failed to fetch dynamically imported module: …`，
         **看不出**是"这个文件根本不在这个路径"。
         ⚠️ 反过来：vendored 的 maplibre 由 composable 按**页面源**解析（`assetUrl`）——
         它属于 `public/`，页面在哪个源就从哪个源取（这样预览页也能拿到，不会被指到 dev 侧）。
         ══════════════════════════════════════════════════════════════════════════ */

      const $ = (id) => document.getElementById(id);
      /* `?ad=110000` 可以先加载一个**省级**（数据量小得多）——用来把
         "引擎渲染不出来" 与 "全国 2MB 数据把软件光栅化压垮" 两种情况分开验。 */
      const Q = new URLSearchParams(location.search);
      const S = {
        ad: Q.get("ad") || "100000",
        dark: true,
        lastPick: null,
        log: [],
        errs: [],
        fps: null,
        frameMs: null,
        engineReady: false,
      };

      /* ── MapLibre 的内部诊断走 `console.warn`（压缩后的 `I()`）——
            页面自己收集一份，否则"样式悄悄没了"这类事在日志里完全看不见。 ── */
      const CON = [];
      for (const k of ["warn", "error"]) {
        const orig = console[k].bind(console);
        console[k] = function () {
          try {
            const parts = [];
            for (const a of arguments) parts.push(typeof a === "string" ? a : (a && a.message) || String(a));
            CON.push(k + "| " + parts.join(" ").slice(0, 260));
            if (CON.length > 60) CON.shift();
          } catch (e) {
            /* 采集本身不许影响页面 */
          }
          return orig.apply(null, arguments);
        };
      }

      /* ── WebGL 画布自拍（`preserveDrawingBuffer: true` 才能 toDataURL）──
            为什么需要：无头 SwiftShader 会在这个环境里把 WebGL 上下文弄丢，
            而最终截图是在**跑完全部动作之后**才拍的 —— 那时地图可能已经没了。
            在"刚画出来"的时刻抓一张 dataURL，才拿得到"底图真的渲染出来了"的证据。 */
      const SHOTS = {};
      function shoot(tag) {
        try {
          const E = window.__wsml && window.__wsml.engine;
          const m = E && E.map;
          if (!m || !m.getCanvas) return;
          const u = m.getCanvas().toDataURL("image/png");
          if (u && u.length > 500 && !SHOTS[tag]) SHOTS[tag] = u;
        } catch (e) {
          SHOTS[tag + ":err"] = String((e && e.message) || e);
        }
      }

      /** 在"样式活着 + 已经有数据"的时刻拍一张（覆盖式）——这一张用来证明"底图真的渲染出来了"。
       *  环境实测：无头 SwiftShader 会在数据到位后 1~2 秒内把 WebGL 上下文弄丢，
       *  所以"最终截图"很可能拍到的是回退态；想要证据就必须在这一刻抓。 */
      function shootBest() {
        try {
          const E = window.__wsml && window.__wsml.engine;
          const m = E && E.map;
          if (!m || !m.style || !(E.info.value.feats > 0)) return;
          const u = m.getCanvas().toDataURL("image/png");
          if (u && u.length > 500) SHOTS.best = u;
        } catch (e) {
          SHOTS.bestErr = String((e && e.message) || e);
        }
      }

      /* 页面自己的错误收集（验证脚本另外还注入了一份 window.__ERRS__） */
      addEventListener("error", (e) => {
        S.errs.push("error: " + (e.message || e.type));
        $("m-err").textContent = String(S.errs.length);
      });
      addEventListener("unhandledrejection", (e) => {
        S.errs.push("reject: " + String((e.reason && e.reason.message) || e.reason));
        $("m-err").textContent = String(S.errs.length);
      });

      /* 旧路占位画布：画点看得见的东西，才好判断"到底有没有被隐藏" */
      (function paintOldCanvas() {
        const cv = $("cv");
        const dpr = Math.min(2, devicePixelRatio || 1);
        cv.width = Math.round(innerWidth * dpr);
        cv.height = Math.round(innerHeight * dpr);
        const g = cv.getContext("2d");
        if (!g) return;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.fillStyle = "#123049";
        g.fillRect(0, 0, innerWidth, innerHeight);
        g.fillStyle = "rgba(255,255,255,0.85)";
        g.font = "600 16px -apple-system, system-ui, sans-serif";
        g.fillText("Canvas2D 旧路占位（引擎就绪后这一层应被隐藏）", 24, 120);
        g.font = "12px -apple-system, system-ui, sans-serif";
        g.fillStyle = "rgba(255,255,255,0.6)";
        g.fillText("engine ok=false 时你会看到这一屏 —— 那就是回退", 24, 144);
      })();

      /* ── 指标快照（采样/日志共用一份口径）──────────────────────────────────
         ⚠️ **每个字段都单独 try/catch**（`g()`）：踩过一次狠的 —— `map.getFilter()`
         在 `map.style` 已经没了的时候会抛 `Cannot read properties of null (reading 'getFilter')`
         （MapLibre 的实现就是 `this.style.getFilter(id)`），于是**整条采样挂掉**、
         8 次 `later()` 全变成页面错误，报告里只剩一句看不懂的话。
         现在每个字段各自兜底：坏掉的字段显示 `ERR:...`，其余照常拿到。 */
      function fullSample() {
        const out = {};
        const g = (k, fn) => {
          try {
            out[k] = fn();
          } catch (e) {
            out[k] = "ERR:" + String((e && e.message) || e);
          }
        };
        const W = window.__wsml || {};
        const E = W.engine || null;
        const m = E ? E.map : null;
        const mlEl = $("stage").querySelector(".ws-geo__ml");
        g("driver", () => W.driver || "");
        g("bootErr", () => W.err || "");
        g("ok", () => (E ? E.ok.value : false));
        g("err", () => (E ? E.err.value : ""));
        g("version", () => (E ? E.info.value.version : ""));
        g("feats", () => (E ? E.feats.value.length : 0));
        g("loadMs", () => (E ? E.info.value.loadMs : null));
        g("dataMs", () => (E ? E.info.value.dataMs : null));
        g("mapErrors", () => (E ? E.info.value.errors.slice(0, 6) : []));
        g("journal", () => (E ? E.info.value.journal.slice(0, 24) : []));
        // 引擎内部状态：`map.style` 是 MapLibre 的公开字段，它 null 掉 = 地图已被 remove()
        g("hasMap", () => !!m);
        g("hasStyle", () => !!(m && m.style));
        g("styleLayers", () => (m && m.style ? (m.style.serialize().layers || []).map((l) => l.id) : []));
        g("zoom", () => (m && m.style ? +m.getZoom().toFixed(2) : null));
        g("pitch", () => (m && m.style ? Math.round(m.getPitch()) : null));
        g("bearing", () => (m && m.style ? Math.round(m.getBearing()) : null));
        g("center", () => (m && m.style ? [+m.getCenter().lng.toFixed(3), +m.getCenter().lat.toFixed(3)] : null));
        g("hiFilter", () => (m && m.style ? JSON.stringify(m.getFilter("ws-ml-hi")).slice(0, 200) : null));
        g("labels", () => document.querySelectorAll(".ws-ml-label").length);
        g("mlContainer", () => !!mlEl);
        g("mlVisibility", () => (mlEl ? getComputedStyle(mlEl).visibility : null));
        g("mlPointerEvents", () => (mlEl ? getComputedStyle(mlEl).pointerEvents : null));
        g("mlChildren", () => (mlEl ? mlEl.children.length : null));
        // 回退性质的两条硬证据：新容器可见 + 旧 canvas 被隐藏（反之亦然）
        g("cvDisplay", () => getComputedStyle($("cv")).display);
        g("cvInline", () => $("cv").style.display || "(空)");
        g("adcode", () => S.ad);
        g("dark", () => S.dark);
        g("lastPick", () => S.lastPick);
        g("fps", () => S.fps);
        g("frameMs", () => S.frameMs);
        g("styleRaw", () => {
          const m2 = E ? E.map : null;
          if (!m2) return "no-map";
          if (m2.style === undefined) return "undefined";
          if (m2.style === null) return "null";
          return typeof m2.style;
        });
        g("conLog", () => CON.slice(0, 24));
        g("shotTags", () => Object.keys(SHOTS));
        g("ownErrs", () => S.errs.slice(0, 10));
        g("viewport", () => [window.innerWidth, window.innerHeight, window.devicePixelRatio]);
        return out;
      }

      function snap(tag) {
        const o = fullSample();
        o.tag = tag;
        return o;
      }

      /** 最终采样用：带上状态时间线。
       *  ⚠️ 时间线**不能**放进 `fullSample()` 里 —— 每条 tick 快照都持有 S.log，
       *  而 S.log 又装着这些快照 → **循环引用**，WebDriver 直接报
       *  `javascript error: circular reference`（踩过，整份采样都没了）。 */
      function logSample() {
        const o = fullSample();
        o.log = S.log.slice();
        o.diag = window.__wsml.diagResult || null;
        /* 画布自拍：**必须分片**。node 的 `console.log`（util.inspect）会把超长字符串截断
           （实测 base64 大图只留下前 1 万字符），整条 dataURL 原样返回拿不到完整 PNG。 */
        const chunk = (u) => {
          if (!u) return null;
          const out = [];
          for (let i = 0; i < u.length; i += 8000) out.push(u.slice(i, i + 8000));
          return out;
        };
        o.shotChunks = { best: chunk(SHOTS.best), ready: chunk(SHOTS.ready) };
        o.shotTags = Object.keys(SHOTS);
        return o;
      }

      /** 动作之后隔一小会儿再记一条（换级要等 fetch，缩放要等补间） */
      function later(tag, ms) {
        setTimeout(() => {
          S.log.push(snap(tag));
          shoot("last"); // 一直覆盖到最新的一张（最终态）
        }, ms || 420);
      }

      /* ── 动作表：命令行只写 `js:__wsml.act.xxx(...)`，**不含逗号/竖线**
            （`verify-window.mjs --click` 用 `,`/`|`/`;;` 切分步骤，脚本里出现这些会把它切碎）── */
      const act = {
        zoomIn: () => {
          window.__wsml.engine.zoomBy(1.35);
          later("zoomBy(1.35)");
        },
        zoomOut: () => {
          window.__wsml.engine.zoomBy(1 / 1.35);
          later("zoomBy(1/1.35)");
        },
        reset: () => {
          window.__wsml.engine.reset();
          later("reset()");
        },
        dark: (on) => {
          S.dark = !!on;
          window.__wsml.engine.setDark(S.dark);
          later("setDark(" + S.dark + ")");
        },
        hl: (ads) => {
          window.__wsml.engine.highlight(ads);
          later("highlight(" + JSON.stringify(ads) + ")");
        },
        drill: (ad) => {
          S.ad = String(ad);
          $("d-ad").textContent = "adcode " + S.ad;
          shootBest();
          window.__wsml.engine.load(S.ad, true);
          later("load(" + S.ad + ")", 1200);
        },
        layout: () => {
          window.__wsml.engine.layout();
          later("layout()");
        },
        /** 真·点击屏幕坐标：`act.clickAt('466 215')`
         *  ⚠️ 参数用**空格**分隔而不是逗号 —— `verify-window.mjs --click` 会用 `,`/`|`/`;;`
         *  切分步骤，脚本正文里出现逗号会把一条指令切碎（踩过两次）。 */
        clickAt: (spec) => {
          const xy = String(spec || "center").trim().split(/\s+/);
          const cv = $("stage").querySelector("canvas");
          const r = cv.getBoundingClientRect();
          const x = xy[0] === "center" || xy.length < 2 ? r.width / 2 : Number(xy[0]);
          const y = xy[0] === "center" || xy.length < 2 ? r.height / 2 : Number(xy[1]);
          const types = ["mousedown", "mouseup", "click"];
          for (const t of types) {
            const init = {};
            init.clientX = r.left + x;
            init.clientY = r.top + y;
            init.bubbles = true;
            cv.dispatchEvent(new MouseEvent(t, init));
          }
          later("clickAt(" + Math.round(x) + " " + Math.round(y) + ")", 500);
        },
        /** 点某个经纬度（页面自己 `map.project` 成像素）：`act.clickLngLat('116.4 39.9')` */
        clickLngLat: (spec) => {
          const ll = String(spec || "").trim().split(/\s+/);
          const m = window.__wsml.engine.map;
          if (!m || !m.project) return;
          const p = m.project([Number(ll[0]), Number(ll[1])]);
          act.clickAt(Math.round(p.x) + " " + Math.round(p.y));
        },
        /** 兜底：直接 fire 一个 MapLibre click（DOM 合成事件不生效时用） */
        fireClick: (spec) => {
          const xy = String(spec || "center").trim().split(/\s+/);
          const cv = $("stage").querySelector("canvas");
          const r = cv.getBoundingClientRect();
          const x = xy.length < 2 ? r.width / 2 : Number(xy[0]);
          const y = xy.length < 2 ? r.height / 2 : Number(xy[1]);
          const m = window.__wsml.engine.map;
          if (m && m.fire) m.fire("click", { point: { x, y } });
          later("fireClick(" + Math.round(x) + " " + Math.round(y) + ")", 400);
        },
      };

      $("d-ad").textContent = "adcode " + S.ad;

      window.__wsml = {
        ok: false,
        driver: "",
        moduleUrl: "",
        err: "",
        engine: null,
        log: S.log,
        errs: S.errs,
        act,
        snap,
        fullSample,
        logSample,
        probe: () => fullSample(),
      };

      /* ── FPS / 帧均（滚动 1 秒窗口，与 P0 页、主项目同一口径）────────────── */
      let last = performance.now();
      let frames = 0;
      let acc = 0;
      let win = 0;
      function tick(now) {
        const dt = now - last;
        last = now;
        frames++;
        acc += dt;
        win += dt;
        if (win >= 1000) {
          S.fps = Math.round((frames * 1000) / win);
          S.frameMs = +(acc / frames).toFixed(2);
          $("m-fps").textContent = String(S.fps);
          $("m-frame").textContent = String(S.frameMs);
          frames = 0;
          acc = 0;
          win = 0;
          const m = window.__wsml.engine && window.__wsml.engine.map;
          if (m) {
            $("m-pitch").textContent = String(Math.round(m.getPitch()));
            $("m-bearing").textContent = String(Math.round(m.getBearing()));
          }
          const E = window.__wsml.engine;
          if (E) {
            $("d-ok").textContent = E.ok.value ? "ok true" : "ok false";
            $("d-ok").className = "pill" + (E.ok.value ? " on" : "");
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      /* ── 加载链：同源 → 5210（vite dev）→ 如实报不可用 ───────────────────── */
      const PATHS = [
        ["same-origin", "/src/composables/useWsMapLibre.ts"],
        [
          "dev-5210",
          location.protocol + "//" + location.hostname + ":5210/src/composables/useWsMapLibre.ts",
        ],
      ];

      /**
       * 诊断：为什么驱动失败（失败时跑，把证据挂到 `window.__wsml.diagResult`）。
       * 2026-09-18 实测踩到的根因是**这一页自己的路径写错**（真身在 `src/composables/`），
       * dev server 对不存在的 `/src` 路径回 SPA 兜底的 index.html（200 + text/html + 1.2KB），
       * 浏览器只报 `Failed to fetch dynamically imported module` —— 光看那条消息会一路往
       * CORS / 依赖哈希 / 缓存上猜（我全猜错了，最后是机主 curl 出来的）。
       * ⇒ 所以这里把"网络层能不能取"和"模块层能不能 import"**分开记**：
       *   `status/ct/bytes` 一看就知道拿到的是不是真模块（text/javascript + 8 万字节）。
       */
      async function diag() {
        const base = location.protocol + "//" + location.hostname + ":5210";
        const urls = [
          [base + "/src/composables/useWsMapLibre.ts", "5210 composable（真身）"],
          [base + "/@vite/client", "5210 vite client"],
          [base + "/src/api/services/worldMap.ts", "5210 worldMap 服务"],
          ["/src/composables/useWsMapLibre.ts", "同源 composable（5212 上应为 404）"],
        ];
        const out = [];
        for (const [u, label] of urls) {
          const row = { label, url: u };
          try {
            const r = await fetch(u, { mode: "cors" });
            row.status = r.status;
            row.ct = r.headers.get("content-type");
            row.acao = r.headers.get("access-control-allow-origin");
            row.bytes = (await r.text()).length;
          } catch (e) {
            row.fetchErr = String((e && e.message) || e);
          }
          try {
            await import(/* @vite-ignore */ u);
            row.import = "ok";
          } catch (e) {
            row.importErr = String((e && e.message) || e);
          }
          out.push(row);
        }
        /* 🔴 最要紧的一条：**浏览器实际收到的是哪一版**？
           实测踩到的坑：dev server 的 /src 转换缓存会滞后于磁盘改动（改完 5 分钟内
           可能还在发旧版），页面于是"用旧代码跑出旧结果"，而日志上看不出任何异常。
           这里直接抓正文查 marker，一眼区分"代码没生效"和"代码生效了但行为不对"。 */
        const mu = (window.__wsml.moduleUrl || "") + "?t=diag" + Date.now();
        const probe = { label: "浏览器实收的 composable", url: mu };
        try {
          const r = await fetch(mu);
          const txt = await r.text();
          probe.status = r.status;
          probe.ct = r.headers.get("content-type");
          probe.bytes = txt.length;
          probe.hasEnsureLayers = txt.indexOf("ensureLayers") >= 0;
          probe.hasJournal = txt.indexOf("journal: []") >= 0;
          probe.hasCtxlost = txt.indexOf("ctxlost") >= 0;
        } catch (e) {
          probe.fetchErr = String((e && e.message) || e);
        }
        out.push(probe);
        window.__wsml.diagResult = out;
        return out;
      }

      (async () => {
        let mod = null;
        for (const [tag, url] of PATHS) {
          /* ⚠️ `?t=` 时间戳：vite dev 的模块产物里写着**带哈希的依赖 URL**
             （`/node_modules/.vite/deps/vue.js?v=d46824b8`）。一旦 dev 侧重优化过依赖，
             旧哈希就取不到了 → 整条 import 报 "Failed to fetch dynamically imported module"。
             每次带一个新 query 强制 dev 侧重新 transform，拿到的就是当前哈希。 */
          for (let attempt = 0; attempt < 2 && !mod; attempt++) {
            try {
              mod = await import(/* @vite-ignore */ url + "?t=" + Date.now());
              window.__wsml.driver = tag + (attempt ? "(retry)" : "");
              window.__wsml.moduleUrl = url;
            } catch (e) {
              window.__wsml.err = tag + " → " + String((e && e.message) || e);
              if (!attempt) await new Promise((r) => setTimeout(r, 900));
            }
          }
          if (mod) break;
        }
        $("m-drive").textContent = "driver: " + (window.__wsml.driver || "unavailable");
        if (!mod || typeof mod.useWsMapLibre !== "function") {
          window.__wsml.ok = false;
          window.__wsml.err = window.__wsml.err || "拿不到 useWsMapLibre（两种驱动路径都失败）";
          $("fb-why").textContent = window.__wsml.err;
          $("fallback").classList.add("on");
          void diag(); // 失败时更要留证据：网络层 vs 模块层，分开记
          return;
        }

        /* 裸元素（不是 ref）—— 顺带证明这个 composable **不依赖 Vue 组件实例**也能驱动 */
        const engine = mod.useWsMapLibre({
          host: $("stage"),
          canvas: $("cv"),
          adcode: () => S.ad,
          dark: () => S.dark,
          onPick: (p) => {
            S.lastPick = p;
          },
        });
        window.__wsml.engine = engine;
        engine.mount();

        /* ── 底图（2026-09-19 机主报「地图只有白底、加载不出等高线」）────────────────
           根因：这个引擎的样式里 `sources: {}` —— **一张瓦片都没有**，只有一层背景色，
           所以在有 GPU 的浏览器上渲染出来也是一片纯色。这里在 mount 之后补一层真底图。
           可达性实测（本机网络同一时刻）：Carto ✅ 0.57s / OSM 镜像 ✅ 2.2s /
           `tile.openstreetmap.org` ❌ / opentopomap（带等高线）❌ / Esri 地形 ❌ 全部超时
           ⇒ 只挂**实测能取到**的 Carto；等高线等找到可通源再补，不写上去装能取到。
           时机：`addSource` 必须在样式就绪之后（早了会抛 Style is not done loading）。 */
        const addBasemap = () => {
          const mp = engine.map;
          if (!mp || typeof mp.addSource !== "function" || mp.getSource?.("base")) return false;
          try {
            mp.addSource("base", {
              type: "raster",
              tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
              tileSize: 256,
              maxzoom: 20,
              attribution: "© OpenStreetMap contributors © CARTO",
            });
            const ids = ((mp.getStyle && mp.getStyle() && mp.getStyle().layers) || []).map((l) => l.id);
            const first = ids.filter((id) => id !== "ws-ml-bg")[0];
            mp.addLayer(
              { id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.9 } },
              first
            );
            S.log.push("basemap: on (esri dark gray)");
            console.info("[wsmlstage] basemap: on (carto dark)");
            return true;
          } catch (err) {
            S.log.push("basemap: fail " + String(err && err.message ? err.message : err).slice(0, 60));
            console.warn("[wsmlstage] basemap: fail", err);
            return false;
          }
        };
        if (!addBasemap()) {
          if (engine.map && engine.map.once) engine.map.once("load", addBasemap);
          setTimeout(addBasemap, 1200); // 兜底：样式已就绪、`once("load")` 赶不上的情况
          setTimeout(addBasemap, 3500);
        }
        S.log.push(snap("mount()"));
        void diag(); // 无条件留证：网络层 / 模块层 / **实收版本** 三条都记下来

        /* 引擎就绪/失败都要有记录（失败 = 回退说明必须出现，且 err 要能读）。
           ⚠️ 这里**不再**在就绪后就停：留一条 400ms 的状态时间线（有界 80 条），
           出问题时能看出"哪一刻开始坏"（第一次就是因为停在了就绪那一刻，
           面板上的「要素 0 / 旧 canvas 已隐藏」全是**过期快照**，把人带偏了）。 */
        const watch = setInterval(() => {
          $("m-engine").textContent = engine.info.value.version ? "maplibre " + engine.info.value.version : "—";
          $("m-feats").textContent = String(engine.info.value.feats);
          $("m-load").textContent = engine.info.value.loadMs ? engine.info.value.loadMs + " ms" : "—";
          $("d-cv").textContent = "旧 canvas " + (getComputedStyle($("cv")).display === "none" ? "已隐藏" : "可见");
          $("d-ok").textContent = engine.ok.value ? "ok true" : "ok false";
          $("d-ok").className = "pill" + (engine.ok.value ? " on" : "");
          if (engine.info.value.errors.length) $("m-err").textContent = String(engine.info.value.errors.length);
          S.log.push(snap("tick"));
          if (S.log.length > 80) S.log.shift();
          shootBest();
          if (engine.ok.value) {
            shoot("ready");
            // 恢复（上下文回来了）也要把回退说明撤掉，别让页面说谎
            $("fallback").classList.remove("on");
            if (!S.engineReady) {
              S.engineReady = true;
              S.log.push(snap("ready"));
            }
          } else if (engine.err.value && !S.engineReady) {
            window.__wsml.err = engine.err.value;
            $("fb-why").textContent = engine.err.value;
            $("fallback").classList.add("on");
            S.log.push(snap("failed"));
          }
        }, 400);

        /* 让采样脚本能在没做任何动作时也拿到"就绪后"的那一条 */
        setTimeout(() => {
          if (!S.log.some((x) => x.tag === "ready" || x.tag === "failed")) S.log.push(snap("idle"));
        }, 6000);
      })();
    </script>
  </body>
</html>
