<!doctype html>
<!--
  ws3dharness.html —— **three 后端靶场**（测试用：不随 app 发布、不属于 pnpm build 的入口）

  ## 为什么要有这一页
  无 GPU 的软件渲染环境里 **MapLibre 一渲染就把 GL 弄死**：
  实测最小 MapLibre 地图（空 style + 一个 background 层）1.5 秒内 `isContextLost()`，
  之后**同文档里新开的 WebGL 上下文一律拿不到**（证据见诊断脚本
  那组记录）。⇒ 走真页面的 `map → three` 那条路在这种环境里**永远走不到**。

  这一页把 MapLibre 完全绕开：**直接 import three 后端**，用一份夹具世界数据把它拉起来，
  于是 three 侧**自己能做主的那些读数**（帧/draw、楼路是否来自那份数据、立绘数、相机双射往返误差）
  都能在真浏览器 + 真 WebGL2（SwiftShader）里量出来。

  ## 它**不能**测什么（照实写，别把它当验收）
  · 舞台那套切换接线（DOM 互斥、台账、`captureWorld` 交接、失败即回退）**它一点都没碰** ——
    那些只能在真页面上量；
  · 「整页 canvas 总数」「只有一个上下文在渲染」这类**跨后端**的判据不在这里；
  · 夹具是从**真地图的 `bld`/`roads` source** 里捞出来喂进来的（`__WSRENDER__.worldJson()`），
    所以"同源"这件事成立；但夹具是**一份快照**，不证明交接过程本身。

  ## 谁在用
  夹具脚本：先开 App 页捞夹具 → 落盘到 `dist-webdev/_m1_fixture.json`
  → 再打开本页 → 读 `window.__HARNESS__` 里的原始读数做断言。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three 后端靶场（自用层 · 不参与验收）</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a1018;
        color: #e8eef7;
        font: 12px/1.5 ui-monospace, monospace;
      }
      #stage {
        position: relative;
        width: 932px;
        height: 557px;
        overflow: hidden;
      }
      #out {
        margin: 8px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .ok {
        color: #6ee7a8;
      }
      .bad {
        color: #ff9a9a;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <pre id="out">靶场启动中…</pre>
    <script type="module">
      /* 只读/驱动 three 后端本身，**不 import App 外壳**（没有 Vue、没有地图、没有路由） */
      import { createThreeBackend } from "/src/components/views/worldsim/wsThreeBackend";
      import {
        contractActors,
        contractTheme,
        metersBetweenCenters,
        WS_RENDER_KEY,
        parseRendererId,
      } from "/src/components/views/worldsim/wsRenderBackend";

      const out = document.getElementById("out");
      const stage = document.getElementById("stage");
      const rows = [];
      const raw = { fixture: null, states: [], diag: null, stats: null, canvas: {}, errs: [] };
      const errs = [];
      window.__ERR__ = errs;
      for (const [k, fn] of [
        ["console.error", console.error],
        ["console.warn", console.warn],
      ]) {
        console[k.split(".")[1]] = function () {
          try {
            errs.push(k + ": " + Array.prototype.map.call(arguments, (a) => (a && a.message) || String(a)).join(" "));
          } catch {
            /* ignore */
          }
          fn.apply(console, arguments);
        };
      }
      window.addEventListener("error", (e) => errs.push("error: " + (e.message || "")));
      window.addEventListener("unhandledrejection", (e) => errs.push("reject: " + String(e.reason)));

      const check = (name, ok, extra) => {
        rows.push({ name, ok: !!ok, extra: extra === undefined ? null : extra });
        out.innerHTML += `\n${ok ? '<span class="ok">✅</span>' : '<span class="bad">❌</span>'} ${name}${
          extra === undefined ? "" : "  → " + JSON.stringify(extra).slice(0, 400)
        }`;
      };
      const info = (s) => {
        out.innerHTML += `\n  · ${s}`;
      };
      const canvasN = () => stage.querySelectorAll("canvas").length;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      window.__HARNESS__ = { done: false, rows, raw, errs };

      async function main() {
        /* ── ① 夹具（从真地图的 source 里捞的那一份） ── */
        let fx = null;
        try {
          const r = await fetch("./_m1_fixture.json", { cache: "no-store" });
          fx = await r.json();
        } catch (e) {
          check("夹具读得到（dist-webdev/_m1_fixture.json）", false, String(e));
          window.__HARNESS__.done = true;
          return;
        }
        raw.fixture = {
          bld: fx.world?.buildings?.features?.length ?? null,
          roads: fx.world?.roads?.features?.length ?? null,
          theme: fx.world?.themeId ?? null,
          actors: fx.actors?.length ?? null,
          center: fx.view?.center ?? null,
          radius: fx.view?.radius ?? null,
        };
        check(
          "夹具到手（楼/路/角色都非空，且是从真地图 source 捞的）",
          (fx.world?.buildings?.features?.length ?? 0) > 0 && (fx.world?.roads?.features?.length ?? 0) > 0,
          raw.fixture
        );

        /* ── ② 契约里的角色/主题：夹具喂什么，靶场就推什么（与舞台上那条路同一份单例） ── */
        contractActors.value = (fx.actors || []).map((a) => ({ ...a }));
        contractTheme.value = {
          theme: fx.view?.theme || fx.world?.themeId || "anime",
          timeOfDay: Number(fx.view?.timeOfDay) || 0,
          clock: fx.view?.clock || "",
        };
        info(`契约角色数：${contractActors.value.length} / 主题：${contractTheme.value.theme}`);

        /* ── ③ 持久化：坏值必须回 map（契约的唯一判据，顺手在这里也真跑一遍） ── */
        const bad = ["true", "", "MAP", "webgl", "overlay ", "three ", null].map((v) => [v, parseRendererId(v)]);
        check(
          "wsm:v1:renderer 坏值一律回 map（键名 = " + WS_RENDER_KEY + "）",
          WS_RENDER_KEY === "wsm:v1:renderer" && bad.every(([v, got]) => (v === "three " ? true : got === "map")),
          bad
        );

        /* ── ④ 把 three 后端拉起来（真 WebGL2：软件渲染） ── */
        const b = createThreeBackend();
        window.__HARNESS_B__ = b;   // 给探针/诊断留个把手（这一页是自用测试页，不随 app 发布）
        const state = {
          center: { lat: Number(fx.view.center.lat), lng: Number(fx.view.center.lng) },
          radius: Number(fx.view.radius),
          bearing: Number(fx.view.bearing) || 0,
          pitch: Number(fx.view.pitch) || 0,
          theme: contractTheme.value.theme,
          timeOfDay: contractTheme.value.timeOfDay,
          clock: contractTheme.value.clock,
          actors: contractActors.value.map((a) => ({ ...a })),
          selection: null,
        };
        const beforeInit = canvasN();
        const t0 = performance.now();
        try {
          await b.init(stage, state, fx.world);
        } catch (e) {
          check("three 后端 init 成功（拿得到 WebGL2）", false, String(e?.message || e));
          window.__HARNESS__.done = true;
          return;
        }
        const initMs = Math.round(performance.now() - t0);
        await sleep(2500); // 让它真出几帧
        const st = b.stats();
        const dg = typeof b.diag === "function" ? b.diag() : null;
        raw.stats = st;
        raw.diag = dg;
        raw.canvas = { before: beforeInit, after: canvasN() };
        info(`init 用了 ${initMs} ms；stats = ${JSON.stringify(st)}`);
        check("three 真的在出帧（frames>0 且 draw call>0）", (dg?.frames ?? 0) > 0 && (dg?.draws ?? 0) > 0, {
          frames: dg?.frames,
          draws: dg?.draws,
          fps: st?.fps,
        });
        check("stats().rendering === true（它自己在跑）", st?.rendering === true, st);
        check("楼是从**交给它的那份数据**来的（有要素、color3d/h3d 逐栋齐）",
          (dg?.buildings ?? 0) > 0 && dg.withH3d === dg.buildings && dg.withColor3d === dg.buildings,
          { bld: dg?.buildings, capped: dg?.capped, withColor3d: dg?.withColor3d, withH3d: dg?.withH3d, tris: dg?.tris });
        check("路也来自那份数据（roadSegs>0 且有 rank 表）", (dg?.roadSegs ?? 0) > 0 && (dg?.roadRanks?.length ?? 0) > 0, {
          segs: dg?.roadSegs,
          ranks: dg?.roadRanks,
        });
        check("角色是 2D 立绘 billboard，且**个数 == 契约角色数**",
          dg?.actors === contractActors.value.length && (dg?.actors ?? 0) > 0,
          { three: dg?.actors, contract: contractActors.value.length, skipped: dg?.actorsSkipped, artFallback: dg?.artFallback });
        check("靶场里只有 three 自己那 1 块画布", canvasN() === beforeInit + 1, raw.canvas);

        /* ── ⑤ 相机双射往返：applyView(s) → readView() 必须回到同一眼 ──
           局部平面框架的锚点是**交接那一刻的中心**，所以这里测的是**同一视野附近**的几个点
              （0 / 50 / 200 / 800 米量级）—— 那正是"切换时相机交接"这件事本身。 */
        const cases = [
          state,
          { ...state, center: { lat: state.center.lat + 0.00045, lng: state.center.lng } },
          { ...state, center: { lat: state.center.lat, lng: state.center.lng + 0.002 } },
          { ...state, radius: state.radius * 1.6, bearing: 37, pitch: 12 },
          { ...state, radius: state.radius * 0.55, bearing: -140, pitch: 55 },
          { ...state, center: { lat: state.center.lat - 0.006, lng: state.center.lng + 0.007 }, radius: state.radius * 2.2 },
        ];
        let worstM = 0;
        let worstR = 0;
        let worstAng = 0;
        for (let i = 0; i < cases.length; i++) {
          const s = cases[i];
          b.applyView(s);
          const back = b.readView();
          if (!back) {
            check(`相机往返 #${i + 1}：readView() 有得答`, false, null);
            continue;
          }
          const dm = metersBetweenCenters(s.center, back.center);
          const dr = Math.abs(back.radius - s.radius) / Math.max(1e-9, s.radius);
          const db = Math.abs(((back.bearing - s.bearing + 540) % 360) - 180);
          const dp = Math.abs(back.pitch - s.pitch);
          worstM = Math.max(worstM, dm);
          worstR = Math.max(worstR, dr);
          worstAng = Math.max(worstAng, db, dp);
          raw.states.push({
            i: i + 1, want: { c: s.center, r: s.radius, b: s.bearing, p: s.pitch },
            got: { c: back.center, r: back.radius, b: back.bearing, p: back.pitch },
            meters: Number(dm.toFixed(4)), relRadius: Number(dr.toFixed(6)),
            dBearing: Number(db.toFixed(3)), dPitch: Number(dp.toFixed(3)),
          });
          info(`往返 #${i + 1}：center 差 ${dm.toFixed(3)} m / radius 相对差 ${(dr * 100).toFixed(4)}% / bearing 差 ${db.toFixed(3)}° / pitch 差 ${dp.toFixed(3)}°`);
        }
        check("相机双射：center 往返误差 ≤1 m（全部用例）", worstM <= 1, { worstMeters: Number(worstM.toFixed(4)) });
        check("相机双射：radius 往返相对误差 ≤1%（全部用例）", worstR <= 0.01, { worstRel: Number(worstR.toFixed(6)) });
        check("相机双射：bearing/pitch 往返误差 ≤0.5°（全部用例）", worstAng <= 0.5, { worstDeg: Number(worstAng.toFixed(4)) });

        /* ── ⑤b 中心命中：把相机**正对着夹具里的一栋楼**，看它报出来的 id 是不是那一栋 ──
           （这个 three 构建没有 `Raycaster`，后端自带射线求交 —— 这一格是它的**行为证据**：
             对着哪栋就该报哪栋，连问两次还得一致。） */
        const feats = fx.world.buildings.features || [];
        const idset = new Set(feats.map((f) => String(f.id ?? "")).filter((x) => x));
        const ring0 = (() => {
          const g = feats[0]?.geometry;
          if (!g) return null;
          const c = g.type === "Polygon" ? g.coordinates?.[0] : g.type === "MultiPolygon" ? g.coordinates?.[0]?.[0] : null;
          return Array.isArray(c) && c.length ? c : null;
        })();
        let aimed = null;
        if (ring0) {
          let sx = 0;
          let sy = 0;
          for (const pt of ring0) {
            sx += Number(pt[0]);
            sy += Number(pt[1]);
          }
          aimed = { lng: sx / ring0.length, lat: sy / ring0.length };
        }
        if (aimed) {
          /* ⚠️ 半径要**大到相机在屋顶之上**：`radius: 80` 时相机只在地面上方 240 米，
             而夹具里这栋楼带 `#antenna` 部件（是栋高楼）⇒ 射线从**楼体内部**往下走，
             一个三角形都撞不到，`centerPick()` 合法地给 null（2026-10-11 实测：
             同一机位半径 300 就稳定命中它）。这不是命中逻辑的毛病，是几何。 */
          b.applyView({ ...state, center: aimed, pitch: 0, bearing: 0, radius: 300 });
          await sleep(250);
          const p1 = b.centerPick ? b.centerPick() : null;
          const p2 = b.centerPick ? b.centerPick() : null;
          const dgp = typeof b.diag === "function" ? b.diag() : null;
          raw.pick = {
            want: String(feats[0]?.id ?? ""),
            got: p1 ? String(p1.id) : null,
            again: p2 ? String(p2.id) : null,
            color: dgp?.colorPick || null,
          };
          info(`中心命中：对着「${raw.pick.want}」看 ⇒ 报「${raw.pick.got}」（再问一次「${raw.pick.again}」）`);
          /* 同一栋楼在 `bld` 里可能拆成几个部件（`<楼id>#body` / `#antenna` …）⇒ 比"楼号"而不是整串 id */
          const baseOf = (x) => String(x || "").split("#")[0];
          check("centerPick() 报的是**那份数据里的**一栋，而且就是对着的那栋楼（同一栋的部件算同一栋；连问两次一致）",
            !!p1 && idset.has(String(p1.id)) && baseOf(p1.id) === baseOf(feats[0]?.id) && String(p1.id) === String(p2?.id),
            { ...raw.pick, aimedBase: baseOf(feats[0]?.id), ids: idset.size });
          const pickM = p1 && aimed && b.centerPick ? metersBetweenCenters(aimed, { lat: p1.lat, lng: p1.lng }) : null;
          raw.pick.metersToAimed = pickM === null ? null : Number(pickM.toFixed(3));
          check("命中点回的是**经纬度**（不是局部米当度用）：与对着的那点差 < 40 m",
            pickM !== null && pickM < 40, { meters: raw.pick.metersToAimed, got: p1 && { lng: p1.lng, lat: p1.lat } });
          check("命中时 diag.colorPick 记下了这栋的颜色/高度（与 2D 同一个字段）",
            !!dgp?.colorPick && !!dgp.colorPick.color && dgp.colorPick.h3d > 0,
            dgp?.colorPick || null);
        }

        /* ── ⑤c 手势：**合成 pointer/wheel 事件**，断言"相机真的跟着动" ──
           为什么在靶场做：真页面那条路在本机走不到（MapLibre 一渲染就把 GL 弄死，见文件头）。
           判据 = 事件前后 `readView()` 的差：拖了就是 center 变了、滚轮就是 radius 变了、
           双指扭转就是 bearing 变了；而且**契约里读到的必须是变完之后那一份**（相机 → 契约那一半）。 */
        const canvas = stage.querySelector("canvas");
        const view0 = b.readView ? b.readView() : null;
        const fire = (type, Ctor, opts) => {
          const r = canvas.getBoundingClientRect();
          const ev = new Ctor(type, Object.assign({
            bubbles: true, cancelable: true, composed: true, pointerId: 1, pointerType: "touch",
            isPrimary: true, buttons: 1, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2,
          }, opts || {}));
          canvas.dispatchEvent(ev);
        };
        const sees = [];
        b.setViewListener && b.setViewListener((s) => sees.push(s));
        b.applyView({ ...state, radius: state.radius, pitch: state.pitch, bearing: state.bearing });
        await sleep(120);
        const vBefore = b.readView();
        /* 单指拖 120px */
        fire("pointerdown", PointerEvent, { clientX: 400, clientY: 300 });
        fire("pointermove", PointerEvent, { clientX: 520, clientY: 300 });
        fire("pointerup", PointerEvent, { clientX: 520, clientY: 300, buttons: 0 });
        await sleep(120);
        const vPan = b.readView();
        /* 滚轮 */
        canvas.dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: -240, clientX: 400, clientY: 300 }));
        await sleep(120);
        const vZoom = b.readView();
        /* 双指：两指分开 + 扭转 */
        fire("pointerdown", PointerEvent, { pointerId: 1, clientX: 380, clientY: 300 });
        fire("pointerdown", PointerEvent, { pointerId: 2, clientX: 460, clientY: 300 });
        fire("pointermove", PointerEvent, { pointerId: 2, clientX: 500, clientY: 380 });
        fire("pointerup", PointerEvent, { pointerId: 1, clientX: 380, clientY: 300, buttons: 0 });
        fire("pointerup", PointerEvent, { pointerId: 2, clientX: 500, clientY: 380, buttons: 0 });
        await sleep(120);
        const vPinch = b.readView();
        raw.gesture = {
          canvas: canvas ? { w: canvas.clientWidth, h: canvas.clientHeight, touchAction: getComputedStyle(canvas).touchAction } : null,
          before: vBefore ? { c: vBefore.center, r: vBefore.radius, b: vBefore.bearing, p: vBefore.pitch } : null,
          afterPan: vPan ? { c: vPan.center, r: vPan.radius, b: vPan.bearing, p: vPan.pitch } : null,
          afterZoom: vZoom ? { r: vZoom.radius } : null,
          afterPinch: vPinch ? { r: vPinch.radius, b: vPinch.bearing, p: vPinch.pitch } : null,
          listenerCalls: sees.length,
        };
        const panM = vBefore && vPan ? metersBetweenCenters(vBefore.center, vPan.center) : 0;
        info(`手势读数：拖 120px ⇒ center 挪 ${panM.toFixed(2)} m / ${vBefore?.radius?.toFixed(1)}→${vPan?.radius?.toFixed(1)} m · 滚轮 ⇒ radius ${vPan?.radius?.toFixed(1)}→${vZoom?.radius?.toFixed(1)} m · 双指 ⇒ bearing ${vZoom?.bearing?.toFixed(2)}→${vPinch?.bearing?.toFixed(2)}° / radius ${vPinch?.radius?.toFixed(1)} m`);
        check("**拖得动**：单指拖 120px ⇒ center 真的挪了（>1 m）", panM > 1, { meters: Number(panM.toFixed(3)) });
        check("**缩得动**：滚轮 ⇒ radius 变小（放大）", !!vZoom && vZoom.radius < (vPan?.radius ?? 0) * 0.99, {
          before: vPan?.radius, after: vZoom?.radius,
        });
        check("**双指**：捏合 + 扭转 ⇒ radius 与 bearing 都跟着变", !!vPinch && vPinch.bearing !== vZoom?.bearing && vPinch.radius !== vZoom?.radius, {
          bearing: [vZoom?.bearing, vPinch?.bearing], radius: [vZoom?.radius, vPinch?.radius],
        });
        check("相机变完**契约里读到的就是新那一份**（后端叫了 viewListener）", sees.length >= 2 && !!vPinch, { calls: sees.length });

        /* ── ⑤d **方向**判据：纯扭转（顺时针 40°，两指距离不变）───────────────
           为什么单列：上一版那条只断言"bearing 变了"——**符号反了照样绿**，真机上"双指扭转跟地图
           相反"就是这么漏过去的。这里把 MapLibre 的算式抄进来**算期望增量**再比：
             `angleWith(this=新, 参数=旧) = atan2(新.x*旧.y − 新.y*旧.x, 新.x*旧.x + 新.y*旧.y)` = 旧角 − 新角，
             `setBearing(bearing + bearingDelta)` ⇒ **Δbearing = −(新角 − 旧角)**。
           公式改成别的，期望值跟着变（不硬编码数字）。 */
        const mapLibreTwistDelta = (nx, ny, ox, oy) => (Math.atan2(nx * oy - ny * ox, nx * ox + ny * oy) * 180) / Math.PI;
        const shortest = (d) => (((d + 180) % 360) + 360) % 360 - 180;
        const c0 = { x: 440, y: 300 };
        const half = 40;
        const th = (40 * Math.PI) / 180;
        const twistBefore = b.readView();
        const oldVec = { x: half, y: 0 };
        const newVec = { x: half * Math.cos(th), y: half * Math.sin(th) };
        const t1 = { x: c0.x - half, y: c0.y };
        const t2 = { x: c0.x + half, y: c0.y };
        const u1 = { x: c0.x - newVec.x, y: c0.y - newVec.y };
        const u2 = { x: c0.x + newVec.x, y: c0.y + newVec.y };
        fire("pointerdown", PointerEvent, { pointerId: 11, clientX: t1.x, clientY: t1.y });
        fire("pointerdown", PointerEvent, { pointerId: 12, clientX: t2.x, clientY: t2.y });
        fire("pointermove", PointerEvent, { pointerId: 12, clientX: u2.x, clientY: u2.y });
        fire("pointermove", PointerEvent, { pointerId: 11, clientX: u1.x, clientY: u1.y });
        fire("pointerup", PointerEvent, { pointerId: 11, clientX: u1.x, clientY: u1.y, buttons: 0 });
        fire("pointerup", PointerEvent, { pointerId: 12, clientX: u2.x, clientY: u2.y, buttons: 0 });
        await sleep(150);
        const twistAfter = b.readView();
        const want = mapLibreTwistDelta(newVec.x, newVec.y, oldVec.x, oldVec.y);
        const have = shortest((twistAfter?.bearing ?? 0) - (twistBefore?.bearing ?? 0));
        raw.twist = {
          want: Number(want.toFixed(4)), have: Number(have.toFixed(4)),
          bearing: [twistBefore?.bearing, twistAfter?.bearing],
          radius: [twistBefore?.radius, twistAfter?.radius],
          pitch: [twistBefore?.pitch, twistAfter?.pitch],
        };
        info(`纯扭转 40°（顺时针）：MapLibre 公式给 ${want.toFixed(3)}° / 实测 ${have.toFixed(3)}°（bearing ${twistBefore?.bearing?.toFixed(2)}° → ${twistAfter?.bearing?.toFixed(2)}°）`);
        check("**方向**：双指纯扭转的 Δbearing 与 MapLibre 公式**同号**（顺时针扭转 ⇒ 按 −(新角−旧角) 走）",
          Math.sign(want) === Math.sign(have) && Math.abs(want) > 1, raw.twist);
        check("**大小**：同一扭转的 |Δbearing − 期望| ≤ 0.5°", Math.abs(have - want) <= 0.5, raw.twist);
        check("纯扭转不该改半径与俯仰（两指距离、中点都没动）",
          Math.abs((twistAfter?.radius ?? 0) - (twistBefore?.radius ?? 0)) / Math.max(1, twistBefore?.radius ?? 1) < 0.02
            && Math.abs((twistAfter?.pitch ?? 0) - (twistBefore?.pitch ?? 0)) < 0.5, raw.twist);

        /* ── ⑥ 暂停 / 销毁：画布与上下文都要放掉 ── */
        b.pause();
        await sleep(300);
        const stPaused = b.stats();
        check("pause() 之后 stats().rendering === false", stPaused?.rendering === false, stPaused);
        b.resume();
        await sleep(600);
        b.destroy();
        await sleep(300);
        raw.canvas.afterDestroy = canvasN();
        check("destroy() 之后 stage 里一块画布都不剩", canvasN() === 0, raw.canvas);

        /* ── ⑦ 控制台 ── */
        raw.errs = errs.slice(0, 20);
        check("靶场里控制台 error/warn = 0", errs.length === 0, errs.slice(0, 6));
        window.__HARNESS__.done = true;
        out.innerHTML += `\n\n📋 靶场结果：${rows.filter((r) => r.ok).length} 过 / ${rows.filter((r) => !r.ok).length} 红`;
      }

      main().catch((e) => {
        errs.push("main: " + String(e?.stack || e));
        window.__HARNESS__.done = true;
      });
    </script>
  </body>
</html>
