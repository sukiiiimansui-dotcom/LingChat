<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>世界模拟 · 街区生活（PixiJS + Live2D 原型 v2）</title>
    <!--
      ════════════════════════════════════════════════════════════════════════
      wslife.html —— 「世界模拟」原型 **v2：按修正后的概念重做**（自用层，不进 PR）
      ════════════════════════════════════════════════════════════════════════

      机主 2026-09-16 的判断：「**那个模拟的完全不对**」—— 他是对的。我去看了两处：

        ① 真实聊天页（`MainChat.vue` 截图）：**角色立绘占满整屏** + 底部悬浮输入抽屉
        ② 代码里的世界模拟（`WorldSim.vue` 的 neighborhood 阶段）：
           `.ws-people` 人物层钉在地图上 · `WsEventBubble` 角色头顶事件气泡 ·
           `WsCharPanel` 角色面板（立绘 3511×5242）· `trips` 行程（角色会走动）·
           「去找他聊聊」→ 进对话

      ⇒ LingChat 的「世界」= **角色生活的小区**，不是一张中国省界图。
        我的 v1（`wsgame.html`）做成了**导航 App 式的全国地图**、把角色缩在角落当装饰，
        **主次完全反了**。这一版把它翻过来：

          · **角色是主角**：Live2D 立绘占主体，带呼吸/眨眼，可点（触发表情）
          · **地图是角色脚下的街区**：路网 / 楼块 / 绿地 / 水 —— 街区尺度，不是省界
          · **头顶事件气泡**：角色在做什么，一眼看到
          · **对话就在同一屏**：底部输入抽屉，样式对齐真聊天页
          · 保留「丝滑」：拖拽平移 + 滚轮/双指缩放（带惯性）

      ## 数据与依赖
      · 街区块是**程序化生成**的（确定性种子），不依赖 LLM 也不依赖网络 —— 原型要的是"观感对不对"。
        真接入时换成 `district_stream`（AI 精绘）或 `wsDistrictPaint` 的草图，几何接口不变。
      · 引擎：`pixi.js`（**已在 package.json 里**，零新增依赖）+ Live2D cubism 运行时。

      ⚠️ 自用层：进 PR 前必须剔除。
    -->
    <style>
      :root {
        --accent: #35d39a;
        --accent-dim: rgba(53, 211, 154, 0.16);
        --ink: #fff;
        --ink-2: rgba(255, 255, 255, 0.74);
        --ink-3: rgba(255, 255, 255, 0.46);
        --hud: rgba(14, 20, 28, 0.66);
        --line: rgba(255, 255, 255, 0.08);
        --r: 14px;
        --blur: saturate(1.2) blur(12px);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0b1118;
        font-family: system-ui, -apple-system, "Noto Sans SC", "Source Han Sans SC", sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { display: block; }
      /* canvas 是替换元素：只写 inset:0 时宽高会取固有尺寸 300×150（踩过） */
      #stage2d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }

      .hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
      .hud > * { pointer-events: auto; }

      /* ── 顶栏：一条细带，无边框；时间与天气是"安静的字"（层级 3）── */
      .top {
        position: absolute; left: 0; right: 0; top: 0;
        display: flex; align-items: center; gap: 12px; padding: 10px 14px 14px;
        background: linear-gradient(to bottom, rgba(10, 15, 21, 0.8), rgba(10, 15, 21, 0));
      }
      .back { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent;
        color: var(--ink-2); font-size: 19px; cursor: pointer; }
      .back:hover { background: rgba(255, 255, 255, 0.07); color: var(--ink); }
      .title { font-size: 15px; font-weight: 600; }
      .title i { font-style: normal; font-size: 12.5px; color: var(--ink-3); margin-left: 8px; }
      .spacer { flex: 1; }
      .meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
      .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }

      /* ── 角色头顶的事件气泡：**不是弹窗**，是贴着角色的一个小气泡 ── */
      .bubble {
        position: absolute; z-index: 6; pointer-events: none;
        max-width: 220px; padding: 7px 12px; border-radius: 13px 13px 13px 4px;
        background: rgba(20, 28, 38, 0.9); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45), inset 0 0 0 1px var(--line);
        font-size: 12.5px; line-height: 1.45; color: var(--ink);
        transform: translate(-50%, -100%);
        transition: opacity 0.25s linear, transform 0.25s cubic-bezier(0, 0, 0, 1);
      }
      .bubble.hide { opacity: 0; transform: translate(-50%, -96%); }

      /* ── 左下：角色卡（唯一一块卡片；半透明底 + 淡发光，不用描边）── */
      .who {
        position: absolute; left: 14px; bottom: 84px;
        display: flex; align-items: center; gap: 11px;
        padding: 9px 14px 9px 11px; border-radius: var(--r);
        background: var(--hud); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42), inset 0 0 0 1px var(--line);
      }
      .av { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
        background: var(--accent-dim); color: var(--accent); font-size: 15px; }
      .who .nm { font-size: 14px; font-weight: 600; line-height: 1.25; }
      .who .sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; }

      /* ── 右下：主操作（无边框按钮 + 单一主题色）── */
      .ops { position: absolute; right: 14px; bottom: 84px; display: flex; gap: 9px; }
      .icobtn {
        width: 46px; height: 46px; border-radius: 15px; border: 0; cursor: pointer;
        background: var(--hud); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
        color: var(--ink-2); font-size: 19px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4), inset 0 0 0 1px var(--line);
        transition: transform 0.14s cubic-bezier(0.2, 0, 0, 1);
      }
      .icobtn:hover { color: var(--ink); transform: translateY(-1px); }
      .cta {
        height: 46px; padding: 0 20px; border: 0; border-radius: 15px; cursor: pointer;
        background: var(--accent); color: #06231a; font-size: 14px; font-weight: 700;
        box-shadow: 0 10px 26px rgba(53, 211, 154, 0.3);
        transition: transform 0.14s cubic-bezier(0.2, 0, 0, 1);
      }
      .cta:hover { transform: translateY(-1px); }

      /* ── 底部：对话抽屉（**与真聊天页同形**：角色名 + 工具图标 + 输入框 + 语音/发送）── */
      .dock {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        background: linear-gradient(to top, rgba(16, 22, 30, 0.94) 62%, rgba(16, 22, 30, 0));
        backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
        border-top: 1px solid var(--line);
      }
      .dock__head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .dock__name { font-size: 15px; font-weight: 700; }
      .dock__tag { font-size: 11px; color: var(--accent); background: var(--accent-dim);
        padding: 2px 7px; border-radius: 6px; }
      .dock__tools { margin-left: auto; display: flex; gap: 14px; color: var(--ink-3); font-size: 15px; }
      .dock__tools span { cursor: pointer; }
      .dock__tools span:hover { color: var(--ink); }
      .dock__row { display: flex; align-items: center; gap: 12px; }
      .dock__input {
        flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
        color: var(--ink); font-size: 14px; padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .dock__input::placeholder { color: var(--ink-3); }
      .dock__btn { background: transparent; border: 0; color: var(--ink-3); font-size: 17px; cursor: pointer; }
      .dock__btn.send { color: var(--accent); }

      /* ── 入场：容器变换（小卡 → 全屏），只动 transform/opacity ── */
      #boot {
        position: absolute; inset: 0; z-index: 20; transform-origin: 0 0;
        will-change: transform, border-radius; background: #0e1621;
        display: grid; place-items: center; text-align: center; gap: 6px; color: var(--ink-2);
      }
      #boot.anim { transition: transform 320ms cubic-bezier(0, 0, 0, 1), border-radius 320ms cubic-bezier(0, 0, 0, 1); }
      #boot .big { font-size: 26px; }
      #boot .t { font-size: 12.5px; }
      #boot .s { font-size: 11px; color: var(--ink-3); }
      .stagger { opacity: 0; transform: translateY(6px);
        transition: opacity 220ms linear, transform 220ms cubic-bezier(0, 0, 0, 1); }
      .hud.in .stagger, .dock.in .stagger { opacity: 1; transform: none; }

      .err { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30;
        max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6;
        background: rgba(60, 18, 18, 0.9); color: #ffd9d9; }
      @media (prefers-reduced-motion: reduce) {
        #boot.anim, .stagger, .bubble { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <canvas id="stage2d"></canvas>

      <div class="hud" id="hud">
        <header class="top">
          <button class="back stagger" title="返回">←</button>
          <div class="title stagger">世界模拟<i id="areaName">幸福里 · 街区</i></div>
          <span class="spacer"></span>
          <div class="meta stagger">
            <span id="mTime">--:--</span><span class="dot"></span><span id="mWx">天气不可用</span>
          </div>
        </header>

        <div class="who stagger">
          <div class="av">◆</div>
          <div>
            <div class="nm" id="whoName">诺一钦灵</div>
            <div class="sub" id="whoSub">在家 · 休息</div>
          </div>
        </div>

        <div class="ops stagger">
          <button class="icobtn" id="zoomOut" title="缩小">−</button>
          <button class="icobtn" id="zoomIn" title="放大">＋</button>
          <button class="cta" id="goChat">去找他 ▸</button>
        </div>
      </div>

      <!-- 角色头顶的事件气泡（DOM，跟着角色屏幕坐标走） -->
      <div class="bubble hide" id="bubble">刚回到家，有点累…</div>

      <!-- 对话抽屉：与真聊天页同形 -->
      <div class="dock" id="dock">
        <div class="dock__head stagger">
          <span class="dock__name" id="dockName">诺一钦灵</span>
          <span class="dock__tag">街区</span>
          <span class="dock__tools"><span title="图片">🖼</span><span title="重说">↺</span><span title="语音">🎤</span><span title="相机">📷</span><span title="关闭">✕</span></span>
        </div>
        <div class="dock__row stagger">
          <span class="dock__btn" title="语音输入">ıllı</span>
          <input class="dock__input" id="chatInput" placeholder="在这里输入消息…" />
          <button class="dock__btn send" id="sendBtn" title="发送">➤</button>
        </div>
      </div>

      <div id="boot">
        <div class="big">🌃</div>
        <div class="t">世界模拟</div>
        <div class="s">点一下进入</div>
      </div>
    </div>

    <script type="module">
      /* ════════════════════════════════════════════════════════════════════
         0. 常量
         ════════════════════════════════════════════════════════════════════ */
      const CORE_SRC = "/vendor/live2d/live2dcubismcore.min.js";
      const MODEL_URL = "/vendor/l2d/haru/Haru.model3.json";
      const $ = (s) => document.querySelector(s);
      const fmt2 = (n) => String(n).padStart(2, "0");

      /* 配色：背景要素一律低对比，唯一高饱和色留给"用户内容/角色" */
      const C = {
        ground: 0x161d26,   // 地面
        road: 0x2b3440,     // 路（中性灰，**不上色** —— Mapbox 夜间规范）
        block: 0x222c39,    // 楼块
        blockLit: 0x2a3646,
        green: 0x1d3326,    // 绿地
        water: 0x123048,    // 水
        accent: 0x35d39a,
        text: 0xffffff,
      };

      /* ════════════════════════════════════════════════════════════════════
         1. 街区生成（确定性种子；真接入时换成 district_stream / wsDistrictPaint 的几何）
         ════════════════════════════════════════════════════════════════════ */
      /* 街区是**宽幅**的（36×22），不是正方形。
         为什么：舞台是横屏（932×430 可用区约 908×282，宽高比 3.2:1），
         正方形街区按高度适配后只占中间一小块、两侧全空 —— 已经踩过一次（v1 的全国图同病）。
         街区尺度本来就该铺满可视范围。 */
      const GRID_W = 36, GRID_H = 22;
      const rnd = (() => { let s = 20260917; return () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff); })();

      function makeDistrict() {
        const blocks = [];   // {x,y,w,h,lit}
        const roads = [];    // {x1,y1,x2,y2}
        const greens = [];
        let water = null;
        // 6×3 个街坊铺满 36×22（PITCH=6，街坊 5×6 再切楼）
        const PW = 6, PH = 7;
        for (let gy = 0; gy < 3; gy++) {
          for (let gx = 0; gx < 6; gx++) {
            const x = 1 + gx * PW, y = 1 + gy * PH;
            if (gx === 3 && gy === 1) { greens.push({ x, y, w: PW - 1.5, h: PH - 1.5 }); continue; } // 中央绿地
            if (gx === 5 && gy === 2) { water = { x, y, w: PW - 1.5, h: PH - 1.5 }; continue; }     // 右下水池
            for (let by = 0; by < 2; by++) {
              for (let bx = 0; bx < 3; bx++) {
                if (rnd() < 0.22) continue;
                const bw = 1.15 + rnd() * 0.45, bh = 2.0 + rnd() * 0.7;
                blocks.push({ x: x + bx * 1.75 + 0.15, y: y + by * 3.1 + 0.2, w: bw, h: bh, lit: rnd() });
              }
            }
          }
        }
        // 路网：横 4 条 / 竖 7 条
        for (let i = 0; i <= 3; i++) { const p = i * PH; roads.push({ x1: 0, y1: p, x2: GRID_W, y2: p, w: 1.1 }); }
        for (let i = 0; i <= 6; i++) { const p = i * PW; roads.push({ x1: p, y1: 0, x2: p, y2: GRID_H, w: 1.1 }); }
        // 角色的家：左上角那栋楼
        const home = blocks[0];
        return { blocks, roads, greens, water, home };
      }
      const D = makeDistrict();

      /* ════════════════════════════════════════════════════════════════════
         2. 运行时（照抄仓库 live2d-runtime.ts 的加载顺序）
         ════════════════════════════════════════════════════════════════════ */
      function loadScript(src) {
        return new Promise((res, rej) => {
          if (document.querySelector(`script[data-src="${src}"]`)) return res();
          const s = document.createElement("script");
          s.src = src; s.async = true; s.dataset.src = src;
          s.onload = () => res(); s.onerror = () => rej(new Error("加载失败：" + src));
          document.head.appendChild(s);
        });
      }
      async function loadRuntime() {
        await loadScript(CORE_SRC);
        const [pixi, engine] = await Promise.all([
          import("pixi.js"),
          import("untitled-pixi-live2d-engine/cubism"),
        ]);
        pixi.extensions.add(engine.Live2DPlugin);
        engine.configureCubismSDK({ memorySizeMB: 64 });
        await engine.cubismReady();
        return { pixi, engine };
      }

      /* ════════════════════════════════════════════════════════════════════
         3. 全局
         ════════════════════════════════════════════════════════════════════ */
      let pixi, engine, app, world, gGround, gBlocks, gRoads, labelLayer, model;
      let view = { x: 0, y: 0, s: 1 };
      let fitScale = 1;
      let charErr = "", ctxLostFlag = false;
      const backend = { kind: "?", init() {}, resize() {}, render() {} };

      function fail(msg) {
        const d = document.createElement("div");
        d.className = "err"; d.innerHTML = msg; $("#app").appendChild(d);
      }

      /* ════════════════════════════════════════════════════════════════════
         4. 主流程
         ════════════════════════════════════════════════════════════════════ */
      async function main() {
        const t0 = performance.now();
        try { const rt = await loadRuntime(); pixi = rt.pixi; engine = rt.engine; }
        catch (e) { return fail(`运行时加载失败：<br>${e.message}`); }

        let ok = false;
        try {
          app = new pixi.Application();
          await app.init({
            background: C.ground, resizeTo: $("#stage"), antialias: false,
            autoDensity: true, resolution: Math.min(2, window.devicePixelRatio || 1),
            preserveDrawingBuffer: true, // 否则无头截图拍到空白画布
          });
          $("#stage").appendChild(app.canvas);
          app.canvas.addEventListener("webglcontextlost", () => { ctxLostFlag = true; });
          await new Promise((r) => setTimeout(r, 400));
          const gl = app.renderer?.gl;
          ok = !ctxLostFlag && gl && !gl.isContextLost();
        } catch (e) { console.warn("[wslife] Pixi 起不来：", e); ok = false; }

        Object.assign(backend, ok ? makePixiBackend() : makeCanvas2dBackend());
        backend.init();
        if (backend.kind !== "pixi") pixi = null;

        // 看门狗：SwiftShader/低端 GPU 下 Pixi 会在第 2 帧丢上下文（实测）
        const wd = setInterval(() => {
          if (backend.kind !== "pixi") return clearInterval(wd);
          const gl = app?.renderer?.gl;
          if (ctxLostFlag || (gl && gl.isContextLost())) { clearInterval(wd); switchTo2d("WebGL 上下文丢失"); }
        }, 200);
        setTimeout(() => clearInterval(wd), 8000);

        layout();
        window.addEventListener("resize", () => { backend.resize(); layout(); });
        bindInput();
        startClock();
        placeBubble();
        (backend.kind === "pixi" ? loadCharacter() : Promise.reject(new Error("无 WebGL，跳过 Live2D")))
          .catch((e) => { charErr = String(e?.message || e); console.warn("[wslife] 角色没加载出来：", e); });

        console.log(`[wslife] 首屏 ${Math.round(performance.now() - t0)} ms，后端=${backend.kind}`);
        window.__WL__ = {
          get view() { return view; },
          get backend() { return backend.kind; },
          get charErr() { return charErr; },
          get hasModel() { return !!model; },
          get counts() { return { blocks: D.blocks.length, roads: D.roads.length }; },
        };

        await new Promise((r) => setTimeout(r, 240));
        playEnter();
      }

      /* ── 舞台尺寸 ── */
      const stageW = () => (backend.kind === "pixi" ? app.renderer.width / app.renderer.resolution : $("#stage2d").clientWidth);
      const stageH = () => (backend.kind === "pixi" ? app.renderer.height / app.renderer.resolution : $("#stage2d").clientHeight);

      /* 街区铺满舞台：留出顶栏 ~54px 与底部抽屉 ~86px */
      function layout() {
        const w = stageW(), h = stageH();
        if (!w || !h) return;
        const availW = w - 24, availH = h - 54 - 86 - 8;
        const s = Math.min(availW / GRID_W, availH / GRID_H);
        fitScale = s;
        view.s = s;
        view.x = (w - GRID_W * s) / 2;
        view.y = 54 + Math.max(0, (availH - GRID_H * s) / 2);
        applyView();
      }
      function applyView() { backend.render(); positionBubble(); }

      /* ════════════════════════════════════════════════════════════════════
         5. 两个渲染后端（Pixi / Canvas2D 兜底）
         ════════════════════════════════════════════════════════════════════ */
      function switchTo2d(reason) {
        if (backend.kind === "canvas2d") return;
        console.warn("[wslife] 切 Canvas2D 兜底：", reason);
        try { app?.destroy({ removeView: true }, { children: true }); } catch {}
        app = null; pixi = null;
        Object.assign(backend, makeCanvas2dBackend());
        backend.init(); layout();
      }

      function makePixiBackend() {
        const g = () => new pixi.Graphics();
        return {
          kind: "pixi",
          init() {
            world = new pixi.Container();
            app.stage.addChild(world);
            gGround = g(); gRoads = g(); gBlocks = g();
            world.addChild(gGround, gRoads, gBlocks);
            labelLayer = new pixi.Container();
            app.stage.addChild(labelLayer);
            this.drawStatic();
          },
          drawStatic() {
            gGround.clear(); gRoads.clear(); gBlocks.clear();
            // 地面
            gGround.rect(0, 0, GRID_W, GRID_H).fill({ color: C.ground });
            // 绿地 / 水
            for (const gr of D.greens) gGround.roundRect(gr.x, gr.y, gr.w, gr.h, 1).fill({ color: C.green });
            if (D.water) gGround.roundRect(D.water.x, D.water.y, D.water.w, D.water.h, 1).fill({ color: C.water });
            // 路（中性灰，不上色）
            for (const r of D.roads) {
              if (r.y1 === r.y2) gRoads.rect(r.x1, r.y1 - r.w / 2, r.x2 - r.x1, r.w);
              else gRoads.rect(r.x1 - r.w / 2, r.y1, r.w, r.y2 - r.y1);
            }
            gRoads.fill({ color: C.road });
            // 楼块（受光/未受光两档，做出层次）
            for (const b of D.blocks) gBlocks.roundRect(b.x, b.y, b.w, b.h, 0.45).fill({ color: b.lit > 0.5 ? C.blockLit : C.block });
            // 角色的家：主题色极淡描边（"用户内容"最高层）
            if (D.home) gBlocks.roundRect(D.home.x, D.home.y, D.home.w, D.home.h, 0.45).stroke({ width: 0.18, color: C.accent, alpha: 0.9 });
          },
          resize() { layout(); },
          render() {
            world.scale.set(view.s);
            world.position.set(view.x, view.y);
          },
        };
      }

      function makeCanvas2dBackend() {
        const cv = $("#stage2d");
        const g2 = cv.getContext("2d", { alpha: false });
        function fit() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          cv.width = Math.round(cv.clientWidth * dpr);
          cv.height = Math.round(cv.clientHeight * dpr);
          g2.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        const R = (v) => `rgb(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255})`;
        function rrect(x, y, w, h, r) {
          g2.beginPath();
          g2.moveTo(x + r, y);
          g2.arcTo(x + w, y, x + w, y + h, r);
          g2.arcTo(x + w, y + h, x, y + h, r);
          g2.arcTo(x, y + h, x, y, r);
          g2.arcTo(x, y, x + w, y, r);
          g2.closePath();
        }
        return {
          kind: "canvas2d",
          init() { $("#stage").style.display = "none"; cv.style.display = "block"; fit(); },
          drawStatic() {}, resize() { fit(); },
          render() {
            const w = cv.clientWidth, h = cv.clientHeight;
            g2.fillStyle = R(C.ground); g2.fillRect(0, 0, w, h);
            g2.save(); g2.translate(view.x, view.y); g2.scale(view.s, view.s);
            g2.fillStyle = R(C.green);
            for (const gr of D.greens) { rrect(gr.x, gr.y, gr.w, gr.h, 1); g2.fill(); }
            if (D.water) { g2.fillStyle = R(C.water); rrect(D.water.x, D.water.y, D.water.w, D.water.h, 1); g2.fill(); }
            g2.fillStyle = R(C.road);
            for (const r of D.roads) {
              if (r.y1 === r.y2) g2.fillRect(r.x1, r.y1 - r.w / 2, r.x2 - r.x1, r.w);
              else g2.fillRect(r.x1 - r.w / 2, r.y1, r.w, r.y2 - r.y1);
            }
            for (const b of D.blocks) {
              g2.fillStyle = R(b.lit > 0.5 ? C.blockLit : C.block);
              rrect(b.x, b.y, b.w, b.h, 0.45); g2.fill();
            }
            if (D.home) {
              g2.strokeStyle = "rgba(53,211,154,0.9)"; g2.lineWidth = 0.18;
              rrect(D.home.x, D.home.y, D.home.w, D.home.h, 0.45); g2.stroke();
            }
            g2.restore();
          },
        };
      }

      /* ════════════════════════════════════════════════════════════════════
         6. 角色（主角）
         ════════════════════════════════════════════════════════════════════ */
      async function loadCharacter() {
        model = await engine.Live2DModel.from(MODEL_URL, {
          ticker: app.ticker, autoFocus: false, autoHitTest: false, eyeBlink: true,
          idleMotionGroup: "Idle", motionPreload: engine.MotionPreloadStrategy.IDLE,
          useHighPrecisionMask: "auto", textureOptions: { lod: "single-auto" },
        });
        // 🔴 必须先判 app：WebGL 上下文丢失后看门狗会把 app 销毁（实测抛 null.stage）
        if (!app) throw new Error("无 WebGL：角色模型已就绪，但渲染后端已切 Canvas2D");
        const h = stageH();
        const k = (h * 0.62) / model.height;   // 角色占舞台高约 6 成 —— 是**主角**，不是装饰
        model.scale.set(k);
        app.stage.addChild(model);
        const follow = () => {
          if (!app || !model) return;
          // 站在"家"那栋楼的右下角
          const home = D.home || { x: 1, y: 1, w: 3, h: 2 };
          const px = view.x + (home.x + home.w) * view.s;
          const py = view.y + (home.y + home.h) * view.s;
          model.position.set(px - model.width * 0.42, py - model.height + 6);
        };
        follow();
        app.ticker.add(follow);
        // 点角色 → 表情/动作 + 气泡换一句（真接入时这里进对话）
        model.on("pointertap", () => {
          try { model.motion("TapBody"); } catch {}
          say("……嗯？你回来啦。");
        });
      }

      /* ── 事件气泡：跟着角色的屏幕坐标走 ── */
      let bubbleText = "刚回到家，有点累…";
      function say(t) { bubbleText = t; $("#bubble").textContent = t; showBubble(); }
      let bubbleTimer = 0;
      function showBubble() {
        const b = $("#bubble");
        b.classList.remove("hide");
        if (bubbleTimer) clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => b.classList.add("hide"), 20000);
      }
      function positionBubble() {
        const b = $("#bubble");
        if (!b || b.classList.contains("hide")) return;
        const home = D.home || { x: 1, y: 1, w: 3, h: 2 };
        // 角色头顶往上一点（角色是 Live2D 时用模型高度粗略代替）
        const px = view.x + (home.x + home.w) * view.s;
        const py = view.y + home.y * view.s - Math.min(160, stageH() * 0.42);
        b.style.left = Math.round(px) + "px";
        b.style.top = Math.round(Math.max(64, py)) + "px";
      }
      function placeBubble() { $("#bubble").textContent = bubbleText; showBubble(); positionBubble(); }

      /* ════════════════════════════════════════════════════════════════════
         7. 交互（拖拽 / 滚轮 / 双指 —— 锚点一律用**画布本地坐标**，并清掉惯性残留）
         ════════════════════════════════════════════════════════════════════ */
      function bindInput() {
        const el = () => (backend.kind === "pixi" ? app.canvas : $("#stage2d"));
        let dragging = false, lx = 0, ly = 0, vx = 0, vy = 0, raf = 0, lastD = 0;
        const pts = new Map();
        const local = (clientX, clientY) => {
          const r = el().getBoundingClientRect();
          return [clientX - r.left, clientY - r.top];
        };
        const stopInertia = () => { if (raf) cancelAnimationFrame(raf), (raf = 0); };
        const inertia = () => {
          vx *= 0.92; vy *= 0.92;
          if (Math.abs(vx) < 0.15 && Math.abs(vy) < 0.15) return stopInertia();
          view.x += vx; view.y += vy; applyView();
          raf = requestAnimationFrame(inertia);
        };
        const on = (t, fn, opt) => el().addEventListener(t, fn, opt);

        on("pointerdown", (e) => {
          stopInertia();
          pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (pts.size === 1) { dragging = true; lx = e.clientX; ly = e.clientY; vx = vy = 0; el().setPointerCapture(e.pointerId); }
        });
        on("pointermove", (e) => {
          if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (pts.size >= 2) {
            // 进入双指：**立刻**停掉单指拖拽与速度，否则松手后惯性会朝上次拖的方向漂走
            if (dragging) { dragging = false; vx = vy = 0; stopInertia(); }
            const [a, b] = [...pts.values()];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (lastD) {
              const [mx, my] = local((a.x + b.x) / 2, (a.y + b.y) / 2);
              zoomAt(mx, my, d / lastD);
            }
            lastD = d;
            return;
          }
          if (!dragging) return;
          const dx = e.clientX - lx, dy = e.clientY - ly;
          lx = e.clientX; ly = e.clientY; vx = dx; vy = dy;
          view.x += dx; view.y += dy; applyView();
        });
        const up = (e) => {
          const wasPinch = pts.size >= 2;
          pts.delete(e.pointerId);
          if (pts.size < 2) lastD = 0;
          if (wasPinch) { vx = vy = 0; dragging = false; stopInertia(); return; }
          if (pts.size === 0 && dragging) { dragging = false; raf = requestAnimationFrame(inertia); }
        };
        on("pointerup", up); on("pointercancel", up);
        on("wheel", (e) => {
          e.preventDefault();
          const [mx, my] = local(e.clientX, e.clientY);
          zoomAt(mx, my, e.deltaY < 0 ? 1.12 : 1 / 1.12);
        }, { passive: false });

        $("#zoomIn").onclick = () => zoomAt(stageW() / 2, stageH() / 2, 1.25);
        $("#zoomOut").onclick = () => zoomAt(stageW() / 2, stageH() / 2, 1 / 1.25);
        $("#goChat").onclick = () => { $("#chatInput").focus(); say("我们聊点什么吧？"); };
        $("#sendBtn").onclick = sendMsg;
        $("#chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
      }
      function sendMsg() {
        const i = $("#chatInput");
        const t = (i.value || "").trim();
        if (!t) return;
        i.value = "";
        say(`「${t.slice(0, 18)}」—— 好呀。`);   // 原型：不做真对话，只演示"同屏可聊"
      }
      function zoomAt(cx, cy, k) {
        const ns = Math.max(fitScale * 0.6, Math.min(fitScale * 6, view.s * k));
        const real = ns / view.s;
        view.x = cx - (cx - view.x) * real;
        view.y = cy - (cy - view.y) * real;
        view.s = ns;
        applyView();
      }

      /* ════════════════════════════════════════════════════════════════════
         8. 时间 / 天气（拿不到就说"不可用"，不编）
         ════════════════════════════════════════════════════════════════════ */
      function startClock() {
        const paint = (h) => {
          $("#mTime").textContent = `${fmt2(Math.floor(h))}:${fmt2(Math.floor((h % 1) * 60))}`;
        };
        const d = new Date();
        paint(d.getHours() + d.getMinutes() / 60);
        fetch("http://127.0.0.1:8791/api/time").then((r) => r.json())
          .then((t) => { const h = Number(t?.hour); if (Number.isFinite(h)) paint(h); }).catch(() => {});
        fetch("http://127.0.0.1:8791/api/weather").then((r) => r.json())
          .then((w) => {
            const cur = w?.current || w?.weather?.[0] || w;
            const desc = cur?.desc || cur?.weatherDesc?.[0]?.value;
            const t = cur?.temp_c ?? cur?.tempC ?? cur?.temp_C;
            if (desc || t != null) $("#mWx").textContent = `${desc || ""}${t != null ? ` ${t}°` : ""}`.trim();
          }).catch(() => {});
      }

      /* ════════════════════════════════════════════════════════════════════
         9. 入场：容器变换（小卡 → 全屏）
         ════════════════════════════════════════════════════════════════════ */
      function playEnter() {
        const boot = $("#boot");
        const W = window.innerWidth, H = window.innerHeight;
        const small = { x: W - 190, y: H - 160, w: 168, h: 116, r: 14 };
        const sx = small.w / W, sy = small.h / H;
        boot.style.transform = `translate(${small.x}px, ${small.y}px) scale(${sx}, ${sy})`;
        boot.style.borderRadius = small.r / Math.min(sx, sy) + "px";
        requestAnimationFrame(() => {
          boot.classList.add("anim");
          boot.style.transform = "translate(0,0) scale(1,1)";
          boot.style.borderRadius = "0px";
        });
        setTimeout(() => {
          boot.style.display = "none";
          $("#hud").classList.add("in");
          $("#dock").classList.add("in");
          document.querySelectorAll(".stagger").forEach((el, i) => (el.style.transitionDelay = `${i * 26}ms`));
          positionBubble();
        }, 340);
      }

      main().catch((e) => fail(`出错了：<br>${e.message}`));
    </script>
  </body>
</html>
